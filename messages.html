<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私信 - XHC 博客</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  :root{
    --tg-blue:#2aabee; --tg-blue-d:#1796d0;
    --tg-bg:#f4f6f8; --tg-panel:#ffffff; --tg-border:#e4e9ef;
    --tg-text:#111827; --tg-text2:#6b7280; --tg-text3:#9ca3af;
    --bubble-mine:#2aabee; --bubble-mine-txt:#fff;
  }
  body.dark{
    --tg-bg:#0f1319; --tg-panel:#171c23; --tg-border:#232a33;
    --tg-text:#e5e9ef; --tg-text2:#9aa3b0; --tg-text3:#6b7380;
    --bubble-mine:#2aabee; --bubble-mine-txt:#fff;
  }
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--tg-bg);color:var(--tg-text);}
  .app{max-width:1100px;margin:0 auto;height:calc(100vh - 30px);min-height:520px;display:flex;flex-direction:column;padding:14px 12px 0;box-sizing:border-box;}
  .t-app{flex:1;display:flex;background:var(--tg-panel);border-radius:16px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.1);min-height:0;border:1px solid var(--tg-border);}
  /* 左栏 */
  .t-left{width:300px;flex:none;border-right:1px solid var(--tg-border);display:flex;flex-direction:column;min-width:0;}
  .t-left-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--tg-border);flex:none;}
  .t-left-head .hd-l{display:flex;align-items:center;gap:6px;min-width:0;}
  .t-left-head h1{margin:0;font-size:16px;font-weight:800;white-space:nowrap;}
  .t-home{border:none;background:none;font-size:17px;cursor:pointer;color:var(--tg-text2);padding:5px 7px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .12s;}
  .t-home:hover{background:rgba(42,171,238,.12);color:var(--tg-blue);}
  .t-new{border:none;background:var(--tg-blue);color:#fff;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .t-new:hover{background:var(--tg-blue-d);}
  .t-users{flex:1;overflow-y:auto;padding:6px;}
  .t-user{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .12s;}
  .t-user:hover{background:rgba(42,171,238,.08);}
  .t-user.act{background:rgba(42,171,238,.14);}
  .t-ava{width:42px;height:42px;border-radius:50%;background:#e6ecf3;display:flex;align-items:center;justify-content:center;font-size:17px;color:#8a94a3;overflow:hidden;flex:none;}
  .t-ava img{width:100%;height:100%;object-fit:cover;}
  .t-u-main{flex:1;min-width:0;}
  .t-u-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .t-u-last{font-size:12px;color:var(--tg-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .t-u-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .t-u-time{font-size:10.5px;color:var(--tg-text3);}
  .t-u-unread{background:#ef4444;color:#fff;border-radius:10px;font-size:10.5px;font-weight:700;padding:1px 7px;min-width:18px;text-align:center;}
  /* 右栏 */
  .t-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--tg-bg);}
  .t-chat-head{padding:11px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--tg-border);background:var(--tg-panel);flex:none;}
  .t-chat-head .t-ava{width:36px;height:36px;font-size:15px;}
  .t-chat-title{font-weight:800;font-size:15px;}
  .t-chat-sub{font-size:12px;color:var(--tg-text2);margin-top:1px;}
  .t-back{border:none;background:none;font-size:20px;cursor:pointer;color:var(--tg-text2);display:none;padding:0 4px;}
  .t-msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-height:0;}
  .t-day{text-align:center;font-size:11px;color:var(--tg-text3);margin:8px 0;}
  .msg{max-width:72%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;position:relative;margin:2px 0;white-space:pre-wrap;}
  .msg.mine{align-self:flex-end;background:var(--bubble-mine);color:var(--bubble-mine-txt);border-bottom-right-radius:4px;}
  .msg.other{align-self:flex-start;background:var(--tg-panel);color:var(--tg-text);border:1px solid var(--tg-border);border-bottom-left-radius:4px;}
  .msg-time{font-size:10px;opacity:.75;text-align:right;margin-top:3px;}
  .t-input{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--tg-panel);border-top:1px solid var(--tg-border);flex:none;position:relative;}
  .t-emoji-btn{border:none;background:none;font-size:20px;cursor:pointer;padding:4px;flex:none;line-height:1;}
  .t-input input{flex:1;border:1px solid var(--tg-border);border-radius:20px;padding:10px 16px;font-size:14px;outline:none;background:var(--tg-bg);color:var(--tg-text);min-width:0;}
  .t-input input:focus{border-color:var(--tg-blue);}
  .t-send{border:none;background:var(--tg-blue);color:#fff;border-radius:20px;padding:0 20px;height:38px;font-size:14px;font-weight:700;cursor:pointer;flex:none;}
  .t-send:hover{background:var(--tg-blue-d);}
  .t-send:disabled{opacity:.5;cursor:default;}
  .emoji-pop{position:absolute;bottom:58px;left:12px;background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;z-index:20;max-width:320px;}
  .emoji-pop button{border:none;background:none;font-size:20px;cursor:pointer;padding:5px;border-radius:8px;line-height:1;}
  .emoji-pop button:hover{background:rgba(42,171,238,.12);}
  .empty{text-align:center;color:var(--tg-text3);padding:40px 0;font-size:13px;line-height:1.9;}
  .t-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tg-text3);font-size:14px;flex-direction:column;gap:8px;}
  .t-placeholder .big{font-size:44px;}
  @media(max-width:720px){
    .t-left{width:100%;}
    .t-right{position:absolute;inset:0;display:none;z-index:5;background:var(--tg-bg);}
    .t-right.show{display:flex;}
    .t-back{display:block;}
    .app{height:calc(100vh - 16px);padding:8px 6px 0;}
    .msg{max-width:85%;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="t-app">
    <!-- 左栏：会话 + 联系人 -->
    <div class="t-left" id="tLeft">
      <div class="t-left-head">
        <div class="hd-l">
          <a class="t-home" href="index.html" title="返回主页">🏠</a>
          <h1>💬 私信</h1>
        </div>
        <button class="t-new" id="newChatBtn">✏️ 新私信</button>
      </div>
      <div class="t-users" id="convList"><div class="empty">加载中…</div></div>
    </div>
    <!-- 右栏：聊天 -->
    <div class="t-right" id="tRight">
      <div class="t-chat-head">
        <button class="t-back" id="backBtn">←</button>
        <div class="t-ava" id="chAva">?</div>
        <div style="min-width:0;">
          <div class="t-chat-title" id="chName">选择对话</div>
          <div class="t-chat-sub" id="chSub"></div>
        </div>
      </div>
      <div class="t-msgs" id="msgs"><div class="t-placeholder"><span class="big">💬</span>从左侧选择一个会话<br>或点击「新私信」开始聊天</div></div>
      <div class="t-input">
        <button class="t-emoji-btn" id="emojiBtn" title="表情">😊</button>
        <input id="msgIn" placeholder="输入消息…" autocomplete="off">
        <button class="t-send" id="sendBtn" disabled>发送</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
const SB_URL = (typeof CFG !== "undefined" && CFG.SUPABASE_URL) || "https://ckitmwadwtoavnigsxag.supabase.co";
const ANON   = (typeof CFG !== "undefined" && CFG.SUPABASE_ANON_KEY) || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNraXRtd2Fkd3RvYXZuaWdzeGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzIwNjcsImV4cCI6MjEwMTA0ODA2N30.juUoJi66E7Td5Q-QPA-BUoHa7d4iywwDmaj2B7AIpqY";
const sb = supabase.createClient(SB_URL, ANON);
let ME = null, curChat = null, pollTimer = null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function avaHtml(ava, name){
  return ava ? '<img src="'+esc(ava)+'" alt="">' : esc((name||"?").charAt(0)||"?");
}
function fmtT(d){
  var t = new Date(d); if (isNaN(t.getTime())) return d||"";
  var now = new Date();
  if (t.toDateString() === now.toDateString()) return t.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  if (t.getFullYear() === now.getFullYear()) return t.toLocaleDateString("zh-CN",{month:"numeric",day:"numeric"});
  return t.toLocaleDateString("zh-CN");
}
function dayLabel(d){
  var t = new Date(d); var now = new Date();
  if (isNaN(t.getTime())) return "";
  if (t.toDateString() === now.toDateString()) return "今天";
  var y = new Date(now); y.setDate(now.getDate()-1);
  if (t.toDateString() === y.toDateString()) return "昨天";
  return t.toLocaleDateString("zh-CN");
}

/* ---------- 会话列表 ---------- */
async function loadConvs(){
  var list = document.getElementById("convList");
  if (!ME) { list.innerHTML = '<div class="empty">请先<a href="index.html" style="color:var(--tg-blue);font-weight:700;">登录</a></div>'; return; }
  list.innerHTML = '<div class="empty">加载中…</div>';
  var { data, error } = await sb.from("messages")
    .select("*, sender:profiles!messages_sender_id_fkey(display_name, avatar_url, username)")
    .or("sender_id.eq."+ME.id+",receiver_id.eq."+ME.id)
    .order("created_at",{ascending:false}).limit(300);
  if (error) { list.innerHTML = '<div class="empty">加载失败：'+esc(error.message||"")+'</div>'; return; }
  var rows = data || [];
  if (!rows.length) { list.innerHTML = '<div class="empty">还没有私信<br><span style="font-size:12px;">点「✏️ 新私信」找个人聊聊吧</span></div>'; return; }
  var map = {};
  rows.forEach(function (m) {
    var other = m.sender_id === ME.id ? m.receiver_id : m.sender_id;
    var o = m.sender_id === ME.id ? null : m.sender;
    if (!map[other]) map[other] = { name: (o && (o.display_name||o.username)) || "用户", ava: (o&&o.avatar_url)||"", unread: 0, last: null };
    if (!map[other].last || (m.created_at||"") > (map[other].last.created_at||"")) map[other].last = m;
    if (m.receiver_id === ME.id && !m.read) map[other].unread++;
  });
  var ids = Object.keys(map);
  ids.sort(function(a,b){ return (map[b].last&&map[b].last.created_at||"") < (map[a].last&&map[a].last.created_at||"") ? -1 : 1; });
  list.innerHTML = ids.map(function (uid) {
    var c = map[uid], l = c.last || {};
    return '<div class="t-user'+(curChat===uid?" act":"")+'" data-uid="'+esc(uid)+'">' +
      '<div class="t-ava">'+avaHtml(c.ava,c.name)+'</div>' +
      '<div class="t-u-main"><div class="t-u-name">'+esc(c.name)+'</div>' +
      '<div class="t-u-last">'+esc((l.sender_id===ME.id?"我：":"")+(l.content||""))+'</div></div>' +
      '<div class="t-u-right">' +
        (c.unread ? '<span class="t-u-unread">'+c.unread+'</span>' : '') +
        '<span class="t-u-time">'+fmtT(l.created_at)+'</span>' +
      '</div></div>';
  }).join("");
  list.querySelectorAll("[data-uid]").forEach(function (el) {
    el.addEventListener("click", function(){ openChat(el.getAttribute("data-uid")); });
  });
}

/* ---------- 用户列表（新私信） ---------- */
async function openUserList(){
  if (!ME) return;
  var list = document.getElementById("convList");
  list.innerHTML = '<div class="empty">加载中…</div>';
  var { data, error } = await sb.from("profiles")
    .select("id, display_name, username, avatar_url")
    .neq("id", ME.id).limit(200);
  if (error) { list.innerHTML = '<div class="empty">加载失败：'+esc(error.message||"")+'</div>'; return; }
  var users = (data||[]).filter(function(u){ return u.display_name || u.username; });
  if (!users.length) { list.innerHTML = '<div class="empty">还没有其他用户</div>'; return; }
  list.innerHTML =
    '<div style="padding:8px 10px;"><input id="userSearch" placeholder="🔍 搜索用户…" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid var(--tg-border);border-radius:12px;outline:none;background:var(--tg-bg);color:var(--tg-text);font-size:13px;"></div>' +
    users.map(function (u) {
      var nm = u.display_name || u.username || "用户";
      return '<div class="t-user" data-uid="'+esc(u.id)+'" data-name="'+esc(nm)+'" data-ava="'+esc(u.avatar_url||"")+'">' +
        '<div class="t-ava">'+avaHtml(u.avatar_url,nm)+'</div>' +
        '<div class="t-u-main"><div class="t-u-name">'+esc(nm)+'</div>' +
        '<div class="t-u-last">@'+esc(u.username||"")+'</div></div></div>';
    }).join("");
  list.querySelectorAll("[data-uid]").forEach(function (el) {
    el.addEventListener("click", function(){
      openChat(el.getAttribute("data-uid"));
      var nm = el.getAttribute("data-name") || "用户";
      var av = el.getAttribute("data-ava") || "";
      setChatHead(nm, av);
    });
  });
  var si = document.getElementById("userSearch");
  if (si) si.addEventListener("input", function(){
    var q = si.value.trim().toLowerCase();
    list.querySelectorAll("[data-uid]").forEach(function(el){
      var name = (el.getAttribute("data-name")||"").toLowerCase();
      el.style.display = name.indexOf(q) >= 0 ? "" : "none";
    });
  });
}
document.getElementById("newChatBtn").addEventListener("click", openUserList);

/* ---------- 聊天 ---------- */
function setChatHead(name, ava){
  document.getElementById("chName").textContent = name;
  document.getElementById("chAva").innerHTML = avaHtml(ava, name);
  document.getElementById("chSub").textContent = "在线消息";
}
async function openChat(uid){
  if (!ME) return;
  /* 标记对方未读已读 */
  try { await sb.from("messages").update({read:true}).eq("receiver_id",ME.id).eq("sender_id",uid).eq("read",false); } catch(e){}
  curChat = uid;
  var pr = await sb.from("profiles").select("display_name, avatar_url, username").eq("id",uid).single();
  var nm = (pr.data && (pr.data.display_name || pr.data.username)) || "用户";
  setChatHead(nm, (pr.data&&pr.data.avatar_url)||"");
  var msgs = document.getElementById("msgs");
  msgs.innerHTML = '<div class="empty">加载中…</div>';
  var { data, error } = await sb.from("messages")
    .select("*")
    .or("and(sender_id.eq."+ME.id+",receiver_id.eq."+uid+"),and(sender_id.eq."+uid+",receiver_id.eq."+ME.id+")")
    .order("created_at",{ascending:true}).limit(200);
  if (error) { msgs.innerHTML = '<div class="empty">加载失败：'+esc(error.message||"")+'</div>'; return; }
  renderMsgs(data||[], uid);
  /* 手机端：显示右栏 */
  var tr = document.getElementById("tRight");
  tr.classList.add("show");
  startPoll(uid);
  loadConvs();
}
function renderMsgs(rows, uid){
  var msgs = document.getElementById("msgs");
  if (!rows.length) { msgs.innerHTML = '<div class="empty">开始你们的对话吧 👋</div>'; return; }
  var lastDay = "";
  var html = "";
  rows.forEach(function (m) {
    var d = dayLabel(m.created_at);
    if (d && d !== lastDay) { html += '<div class="t-day">'+esc(d)+'</div>'; lastDay = d; }
    html += '<div class="msg '+(m.sender_id===ME.id?"mine":"other")+'">'+esc(m.content)+
      '<div class="msg-time">'+fmtT(m.created_at)+'</div></div>';
  });
  msgs.innerHTML = html;
  msgs.scrollTop = msgs.scrollHeight;
}
function startPoll(uid){
  clearInterval(pollTimer);
  pollTimer = setInterval(function(){
    if (!ME || curChat !== uid) { clearInterval(pollTimer); return; }
    sb.from("messages").select("*")
      .or("and(sender_id.eq."+ME.id+",receiver_id.eq."+uid+"),and(sender_id.eq."+uid+",receiver_id.eq."+ME.id+")")
      .order("created_at",{ascending:true}).limit(200)
      .then(function(r){
        if (!r.error && curChat === uid) renderMsgs(r.data||[], uid);
      });
  }, 4000);
}
function send(){
  var input = document.getElementById("msgIn");
  var v = input.value.trim();
  if (!v || !curChat) return;
  sb.from("messages").insert({ sender_id: ME.id, receiver_id: curChat, content: v }).then(function(r){
    if (r.error) { toast("发送失败："+(r.error.message||"")); return; }
    input.value = "";
    document.getElementById("sendBtn").disabled = true;
    sb.from("messages").select("*")
      .or("and(sender_id.eq."+ME.id+",receiver_id.eq."+curChat+"),and(sender_id.eq."+curChat+",receiver_id.eq."+ME.id+")")
      .order("created_at",{ascending:true}).limit(200)
      .then(function(r2){ if (!r2.error) renderMsgs(r2.data||[], curChat); });
    loadConvs();
  });
}
document.getElementById("sendBtn").addEventListener("click", send);
document.getElementById("msgIn").addEventListener("input", function(){
  document.getElementById("sendBtn").disabled = !this.value.trim();
});
document.getElementById("msgIn").addEventListener("keydown", function(e){ if (e.key === "Enter") send(); });
document.getElementById("backBtn").addEventListener("click", function(){
  document.getElementById("tRight").classList.remove("show");
  clearInterval(pollTimer); curChat = null;
});

/* ---------- Emoji 选择器 ---------- */
var EMOJIS = ["😀","😄","😁","😂","🤣","😊","😍","🥰","😘","😎","🤔","😅","😉","🙂","😭","😢","😡","😱","🥳","🤩","😴","🤗","🤝","👍","👎","👏","🙏","💪","🤞","✌️","👌","🤙","❤️","💔","💯","🔥","✨","🎉","🎂","💐","🌟","⚡","🎯","🚀","🍀","🌹","☕","🍺","💬","📌","🆗","👋","😳","🥺","😇","🤠","🤑","🤯","🥶","😷","🤒","🤢","🤮","😵","😈","👻","💀","🤖","🎃","🌈","🍭","🍔","🍕","🏀","⚽","🎮","🎵","🎁","📷","💡","📚","✏️"];
var emojiPop = null;
function toggleEmoji(){
  var inp = document.getElementById("msgIn");
  var old = document.getElementById("emojiPop");
  if (old) { old.remove(); return; }
  var pop = document.createElement("div");
  pop.id = "emojiPop"; pop.className = "emoji-pop";
  pop.innerHTML = EMOJIS.map(function(e){ return '<button type="button" data-e="'+e+'">'+e+'</button>'; }).join("");
  pop.querySelectorAll("[data-e]").forEach(function(btn){
    btn.addEventListener("click", function(){
      inp.value += btn.getAttribute("data-e");
      inp.focus();
      document.getElementById("sendBtn").disabled = false;
      pop.remove();
    });
  });
  var box = document.querySelector(".t-input");
  box.appendChild(pop);
}
document.getElementById("emojiBtn").addEventListener("click", toggleEmoji);

/* ---------- toast ---------- */
function toast(msg){
  var t = document.createElement("div");
  t.style.cssText = "position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.25);";
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

/* ---------- init ---------- */
(async function init(){
  var { data } = await sb.auth.getSession();
  ME = (data && data.session && data.session.user) || null;
  if (!ME) {
    document.getElementById("convList").innerHTML = '<div class="empty">请先 <a href="index.html" style="color:var(--tg-blue);font-weight:700;">登录</a> 后查看私信</div>';
    return;
  }
  loadConvs();
  /* 外部传入 ?to=uid 直接开聊 */
  var to = new URLSearchParams(location.search).get("to");
  if (to) openChat(to);
})();
</script>
</body>
</html>
