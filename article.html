<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 - XHCDNS</title>
  <meta name="description" content="XHC 个人博客文章详情">
  <link rel="icon" href="assets/images/xhc-96x96.png?v=20260812">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- 代码高亮（highlight.js，CDN） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

  <!-- 页面跳转加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="header">
    <div class="container">
      <a class="brand" href="index.html">
        <img src="assets/images/xhc-96x96.png?v=20260812" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <!-- 文章主体 -->
  <div class="container article-wrap">
    <article class="article-main" id="articleMain">
      <div class="breadcrumb" id="breadcrumb"></div>
      <h1 class="title" id="articleTitle"></h1>
      <div class="article-meta" id="articleMeta"></div>
      <div class="article-content" id="articleContent"></div>
      <div class="article-tags" id="articleTags"></div>
      <div class="prevnext" id="prevNext"></div>
      <div class="article-actions" id="articleActions" style="margin-top:18px;"></div>

      <!-- 相关推荐 -->
      <section id="relatedPosts" style="margin-top:28px;display:none;">
        <h3 style="margin-bottom:14px;color:var(--text);">📎 相关推荐</h3>
        <div id="relatedList" style="display:flex;flex-direction:column;gap:10px;"></div>
      </section>

      <!-- 评论 -->
      <section class="comments" id="comments">
        <h3 id="commentTitle">评论</h3>
        <div class="comment-form">
          <textarea id="commentText" placeholder="写下你的评论…（演示：评论保存在本地浏览器）"></textarea>
          <div class="row">
            <input id="commentName" type="text" placeholder="昵称（默认“访客”）">
            <button class="submit" id="commentSubmit">发表评论</button>
          </div>
        </div>
        <div class="comment-list" id="commentList"></div>
      </section>
    </article>

    <!-- 目录 -->
    <aside class="toc card" id="toc">
      <div class="card-h"><span class="bar"></span> 本文目录</div>
      <ol id="tocList"></ol>
    </aside>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- 左下角水印 -->
  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
