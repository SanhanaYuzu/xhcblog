<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用 XHC 博客登录 · 演示</title>
<style>
  body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f1f5f9;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; margin:0; color:#111827; }
  .card { background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.1);
    width:400px; max-width:94vw; padding:28px 26px; text-align:center; }
  .logo { width:56px; height:56px; border-radius:14px; background:#eef4ff; display:inline-flex;
    align-items:center; justify-content:center; font-size:28px; margin-bottom:8px; }
  h2 { margin:6px 0 4px; font-size:17px; }
  p.sub { font-size:13px; color:#6b7280; margin:0 0 14px; }
  button { width:100%; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:600;
    background:#2563eb; color:#fff; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  .info { font-size:13px; color:#4b5563; line-height:1.8; margin-top:14px; text-align:left;
    background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; word-break:break-all; }
  .ok { color:#16a34a; font-weight:600; }
  .avatar { width:64px; height:64px; border-radius:50%; background:#eef1f5; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:26px; color:#8a94a3; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .hint { font-size:11.5px; color:#9ca3af; margin-top:12px; line-height:1.7; }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="logo">🔐</div>
  <h2>第三方应用接入演示</h2>
  <p class="sub">通过 XHC 博客账号（hotpe.org）登录</p>
  <button id="loginBtn">用 XHC 博客账号登录</button>
  <div class="info" id="info">点击上方按钮，将跳转 XHC 博客授权页</div>
  <div class="hint">本页面是接入演示：OAuth 2.1 + PKCE，纯前端<br>回调地址与本页相同（redirect_uri 自动回跳）</div>
</div>

<script>
/* ============================================================
   XHC OAuth Server 接入演示（OAuth 2.1 + PKCE，纯前端）
   本页 = 登录发起页 + 回调处理页（redirect_uri 指向自身）
   ============================================================ */
var XHC = {
  authUrl:    "https://ckitmwadwtoavnigsxag.supabase.co/auth/v1/oauth/authorize",
  tokenUrl:   "https://ckitmwadwtoavnigsxag.supabase.co/auth/v1/oauth/token",
  userinfoUrl:"https://ckitmwadwtoavnigsxag.supabase.co/auth/v1/userinfo",
  clientId:   "cc9762a4-4a03-4926-a15e-386018a33479",
  redirectUri:"https://hotpe.org/oauth/demo.html",
  scope:      "email profile"
};

function b64url(buf) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function genVerifier() { var a = new Uint8Array(32); crypto.getRandomValues(a); return b64url(a); }
async function genChallenge(v) {
  var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return b64url(h);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }
function show(html) { document.getElementById("info").innerHTML = html; }

async function login() {
  var verifier = genVerifier();
  sessionStorage.setItem("xhc_cv", verifier);
  var challenge = await genChallenge(verifier);
  var p = new URLSearchParams({
    response_type: "code",
    client_id: XHC.clientId,
    redirect_uri: XHC.redirectUri,
    scope: XHC.scope,
    state: Math.random().toString(36).slice(2),
    code_challenge: challenge,
    code_challenge_method: "S256"
  });
  location.href = XHC.authUrl + "?" + p.toString();
}

async function handleCallback() {
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  if (!code) return;
  document.getElementById("loginBtn").style.display = "none";
  show("正在换取登录令牌…");
  var verifier = sessionStorage.getItem("xhc_cv");
  var body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    redirect_uri: XHC.redirectUri,
    client_id: XHC.clientId,
    code_verifier: verifier
  });
  try {
    var r = await fetch(XHC.tokenUrl, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    var t = await r.json();
    if (t.error) {
      show("❌ 换取令牌失败：" + esc(t.error_description || t.error) +
        '<br><br><button style="width:100%;" onclick="location.reload()">重新登录</button>');
      return;
    }
    localStorage.setItem("xhc_demo_token", t.access_token);
    var u = await fetch(XHC.userinfoUrl, { headers: { Authorization: "Bearer " + t.access_token } });
    var user = await u.json();
    var av = user.avatar_url || "";
    document.getElementById("app").innerHTML =
      '<div class="avatar">' + (av ? '<img src="' + esc(av) + '" alt="">' : "👤") + "</div>" +
      '<h2>✅ 登录成功</h2>' +
      '<p class="sub">' + esc(user.name || user.user_name || user.email || "XHC 用户") + "</p>" +
      '<div class="info"><b>用户信息：</b><br>' + esc(JSON.stringify(user, null, 2)) +
      '<br><br><b>access_token（可访问 XHC 数据，RLS 生效）：</b><br>' + esc(t.access_token.slice(0, 60)) + "…" +
      '<br><br><button style="width:100%;" onclick="location.href=location.pathname">再测一次</button></div>';
    history.replaceState(null, "", location.pathname);
  } catch (e) {
    show("❌ 网络错误：" + esc(e.message) + '<br><br><button style="width:100%;" onclick="location.reload()">重试</button>');
  }
}

document.getElementById("loginBtn").addEventListener("click", login);
handleCallback();
</script>
</body>
</html>
