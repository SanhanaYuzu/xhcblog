<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金额大写转换 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    input[type=text],input[type=number]{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;box-sizing:border-box;}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:14px 15px;color:var(--text);cursor:pointer;word-break:break-all;}
    .out:hover{border-color:var(--primary);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
    .big{font-size:18px;color:var(--primary);font-weight:700;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">💰</span>
      <div>
        <h1>金额大写转换</h1>
        <p class="tool-sub">把数字金额转为人民币中文大写（财务票据 / 合同常用）</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 输入金额（最多保留 2 位小数）</h2>
      <div class="row">
        <input type="text" id="amt" placeholder="如 1234.56、-10000、0.5" value="1234.56">
      </div>
      <div class="btns">
        <button class="btn-primary" id="conv">转换</button>
        <button class="btn-ghost" id="sample">示例</button>
      </div>
      <div class="out big" id="out" title="点击复制" style="margin-top:14px;">—</div>
      <div class="note">支持负数（自动前缀「负」）、整数与小数；超出万亿亦可处理，但日常票据规范一般仅到「元」。点击结果可复制。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var amt=document.getElementById("amt"), out=document.getElementById("out");
      var conv=document.getElementById("conv"), sample=document.getElementById("sample");
      document.getElementById("year").textContent=new Date().getFullYear();

      var dUnit=["","拾","佰","仟"];
      var dGroup=["","万","亿","兆"];
      function intToCn(n){
        if(n==="0") return "零";
        var str=n.replace(/^0+/,"")||"0";
        var len=str.length;
        var res="";
        // 按 4 位一组从右往左
        var groups=[];
        for(var i=str.length;i>0;i-=4){ groups.unshift(str.slice(Math.max(0,i-4),i)); }
        for(var g=0; g<groups.length; g++){
          var part=groups[g];
          var groupStr=group4(part);
          if(groupStr){
            res+=groupStr + dGroup[groups.length-1-g];
          } else {
            // 该组为 0，补一个零（避免连续零）
            if(res && !/零$/.test(res)) res+="零";
          }
        }
        return res.replace(/零+$/,"");
      }
      function group4(s){
        // s 长度<=4
        var arr=s.split(""); var out=""; var zero=false;
        var pos=s.length;
        for(var i=0;i<arr.length;i++){
          var d=arr[i]; var unitPos=(pos-1-i);
          if(d==="0"){
            zero=true;
          } else {
            if(zero && out){ out+="零"; }
            zero=false;
            out+=cnDigit(d)+dUnit[unitPos%4];
          }
        }
        return out;
      }
      function cnDigit(d){ return ["零","壹","贰","叁","肆","伍","陆","柒","捌","玖"][+d]; }

      function convert(){
        var raw=amt.value.trim();
        if(!raw){ out.textContent="请输入金额"; return; }
        var neg=false;
        if(raw.charAt(0)==="-"){ neg=true; raw=raw.slice(1); }
        if(!/^\d+(\.\d{1,2})?$/.test(raw)){ out.textContent="格式不正确（仅支持数字，最多两位小数）"; return; }
        var parts=raw.split(".");
        var intPart=parts[0];
        var decPart=parts[1]||"";
        var intCn=intToCn(intPart);
        if(intCn==="") intCn="零";
        var res=intCn+"元";
        if(decPart===""){
          res+="整";
        } else {
          var jiao=decPart.charAt(0), fen=decPart.charAt(1)||"";
          if(jiao==="0" && fen==="0"){ res+="整"; }
          else {
            if(jiao!=="0") res+=cnDigit(jiao)+"角";
            else if(fen!=="0") res+="零";
            if(fen!=="0" && fen!=="") res+=cnDigit(fen)+"分";
          }
        }
        res=neg?"负"+res:res;
        out.textContent=res;
      }
      conv.onclick=convert;
      amt.addEventListener("keydown",function(e){ if(e.key==="Enter") convert(); });
      sample.onclick=function(){ amt.value=(Math.random()*1000000).toFixed(2); convert(); };
      out.onclick=function(){ if(out.textContent&&out.textContent!=="—"){ var t=out.textContent; if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("已复制");},function(){fallback(t);});}else fallback(t); } };
      function toast(m){ var t=document.createElement("div"); t.textContent=m; t.style.cssText="position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:14px;"; document.body.appendChild(t); setTimeout(function(){document.body.removeChild(t);},1400); }
      function fallback(t){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("已复制");}catch(e){toast("复制失败");} document.body.removeChild(ta); }
      convert();
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
