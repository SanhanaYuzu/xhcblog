<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:30px 20px 56px;}
    .tool-page h1{margin:0 0 6px;font-size:26px;font-weight:800;color:#3498db;}
    .tool-page .desc{color:var(--text-3);font-size:14px;margin:0 0 24px;}
    .card{padding:24px;margin-bottom:20px;}
    .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
    .opts button{padding:10px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #3498db;background:#3498db;color:#fff;transition:.15s;}
    .opts button:hover{background:#2c81ba;}
    .opts label{font-size:14px;color:var(--text-2);display:flex;align-items:center;gap:6px;}
    .opts select{padding:8px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;background:var(--bg);color:var(--text-1);}
    canvas{display:block;margin:0 auto;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    body.dark canvas{background:#1c232c;box-shadow:0 2px 12px rgba(0,0,0,.3);}
      .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-content"><img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo"><div class="loader-bar"><div class="loader-bar-inner"></div></div></div></div>
  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html"><img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo"><span class="brand-name">XHC<b>DNS</b></span></a>
      <nav class="nav" id="navCats"></nav>
      <div class="search"><input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off"><button id="searchBtn" title="搜索">🔍</button></div>
      
      <span id="accountSlot"></span>
    </div>
  </header>
  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <h1>🏗️ 迷宫生成器</h1>
    <p class="desc">DFS 回溯算法随机生成迷宫。你可以选择不同大小，每次生成的迷宫都独一无二，入口在左上角，出口在右下角。</p>
    <div class="card">
      <div class="opts">
        <label>尺寸：<select id="sizeSelect"><option value="15">小 (15×15)</option><option value="25" selected>中 (25×25)</option><option value="35">大 (35×35)</option><option value="50">超大 (50×50)</option></select></label>
        <button id="genBtn">🔄 生成新迷宫</button>
      </div>
      <canvas id="mazeCanvas"></canvas>
    </div>
  </main>
  <footer class="footer"><div class="container">&copy; <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>本站由 XHCDNS 制作</div></footer>
  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>    /* app.js 把 qs/qsa/esc 包在 IIFE 内，本地定义自己的助手以避免 ReferenceError */
    function qs(s, r) { return (r || document).querySelector(s); }
    function qsa(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]; }); }


    var canvas=qs('#mazeCanvas'),ctx=canvas.getContext('2d');
    var n=25,cell,grid,visited;
    function init(){
      grid=[];visited=[];
      for(var r=0;r<n;r++){grid[r]=[];visited[r]=[];for(var c=0;c<n;c++){grid[r][c]=15;visited[r][c]=false;}}
    }
    var dirs=[[-1,0,1,2],[1,0,4,8],[0,-1,2,1],[0,1,8,4]];
    function carve(r,c){
      visited[r][c]=true;
      var d=dirs.slice().sort(function(){return Math.random()-.5;});
      for(var i=0;i<d.length;i++){
        var nr=r+d[i][0],nc=c+d[i][1];
        if(nr>=0&&nr<n&&nc>=0&&nc<n&&!visited[nr][nc]){
          grid[r][c]&=~d[i][2];grid[nr][nc]&=~d[i][3];
          carve(nr,nc);
        }
      }
    }
    function draw(){
      var w=Math.min(680,window.innerWidth-60),cs=Math.floor(w/(n+2));
      cs=Math.max(6,cs);
      var pad=cs,totalW=(n+2)*cs,totalH=(n+2)*cs;
      canvas.width=totalW;canvas.height=totalH;
      canvas.style.width=totalW+'px';canvas.style.height=totalH+'px';
      var dark=document.body.classList.contains('dark');
      ctx.fillStyle=dark?'#1c232c':'#fff';ctx.fillRect(0,0,totalW,totalH);
      var wallColor=dark?'#5dade2':'#3498db';
      ctx.strokeStyle=wallColor;ctx.lineWidth=Math.max(2,cs/6);ctx.lineCap='round';
      for(var r=0;r<n;r++)for(var c=0;c<n;c++){
        var x=pad+c*cs,y=pad+r*cs,g=grid[r][c];
        if(g&1){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+cs,y);ctx.stroke();}
        if(g&2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+cs);ctx.stroke();}
        if(g&4){ctx.beginPath();ctx.moveTo(x+cs,y);ctx.lineTo(x+cs,y+cs);ctx.stroke();}
        if(g&8){ctx.beginPath();ctx.moveTo(x,y+cs);ctx.lineTo(x+cs,y+cs);ctx.stroke();}
      }
      ctx.fillStyle='#27ae60';ctx.fillRect(pad+2,pad+2,cs-4,cs-4);
      ctx.fillStyle='#e74c3c';ctx.fillRect(pad+(n-1)*cs+2,pad+(n-1)*cs+2,cs-4,cs-4);
    }
    function generate(){n=parseInt(qs('#sizeSelect').value);init();carve(0,0);draw();}
    qs('#genBtn').addEventListener('click',generate);
    generate();
    qs('#year').textContent=new Date().getFullYear();
  </script>
</body>
</html>
