<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON 格式化 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:860px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    textarea{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:12px;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;resize:vertical;min-height:180px;line-height:1.6;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);white-space:pre;overflow:auto;min-height:160px;max-height:420px;line-height:1.6;cursor:pointer;}
    .out:hover{border-color:var(--primary);}
    .err{color:#e74c3c;font-size:13px;margin-top:8px;min-height:18px;}
    .stat{font-size:12.5px;color:var(--text-3);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🧾</span>
      <div>
        <h1>JSON 格式化</h1>
        <p class="tool-sub">美化 / 压缩 / 校验 JSON，自动定位语法错误</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 输入</h2>
      <textarea id="in" placeholder='粘贴 JSON，例如：{"name":"XHC","tools":[1,2,3]}'></textarea>
      <div class="row">
        <div class="field">缩进
          <select id="indent">
            <option value="2" selected>2 空格</option>
            <option value="4">4 空格</option>
            <option value="\t">Tab</option>
          </select>
        </div>
        <span class="stat" id="stat"></span>
      </div>
      <div class="btns">
        <button class="btn-primary" id="beautify">✨ 格式化</button>
        <button class="btn-ghost" id="minify">🗜️ 压缩</button>
        <button class="btn-ghost" id="validate">✔️ 校验</button>
        <button class="btn-ghost" id="sample">📋 示例</button>
        <button class="btn-ghost" id="clear">🧹 清空</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 输出（点击复制）</h2>
      <div class="out" id="out" title="点击复制">—</div>
      <div class="note">格式化会美化缩进；压缩会去掉空白；校验只检查语法并高亮错误位置（如 line:col）。纯本地处理，不上传数据。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var input=document.getElementById("in"), out=document.getElementById("out"), err=document.getElementById("err"), stat=document.getElementById("stat");
      var indentSel=document.getElementById("indent");
      function toast(m){ var t=document.createElement("div"); t.textContent=m; t.style.cssText="position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:14px;"; document.body.appendChild(t); setTimeout(function(){document.body.removeChild(t);},1400); }
      function copy(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("已复制");},function(){fallback(t);});} else fallback(t); }
      function fallback(t){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("已复制");}catch(e){toast("复制失败");} document.body.removeChild(ta); }

      function locOf(str, idx){
        var line=1, col=0;
        for(var i=0;i<idx && i<str.length;i++){ if(str[i]==="\n"){line++;col=0;} else col++; }
        return line+":"+col;
      }
      function countKeys(o){
        var n=0; (function walk(v){ if(Array.isArray(v)){n++;v.forEach(walk);} else if(v&&typeof v==="object"){n++;Object.keys(v).forEach(function(k){walk(v[k]);});} else {n++;} })(o);
        return n;
      }

      document.getElementById("beautify").onclick=function(){
        err.textContent=""; var raw=input.value;
        if(!raw.trim()){ out.textContent="—"; return; }
        try{
          var obj=JSON.parse(raw);
          var sp=indentSel.value==="\\t"?"\t":+indentSel.value;
          out.textContent=JSON.stringify(obj,null,sp);
          stat.textContent="根类型："+(Array.isArray(obj)?"Array":typeof obj==="object"&&obj?"Object":"其它")+" · 节点数："+countKeys(obj);
        }catch(e){ err.textContent="解析失败："+e.message; out.textContent="—"; }
      };
      document.getElementById("minify").onclick=function(){
        err.textContent=""; var raw=input.value;
        if(!raw.trim()){ out.textContent="—"; return; }
        try{ out.textContent=JSON.stringify(JSON.parse(raw)); stat.textContent="已压缩"; }
        catch(e){ err.textContent="解析失败："+e.message; out.textContent="—"; }
      };
      document.getElementById("validate").onclick=function(){
        err.textContent=""; var raw=input.value;
        if(!raw.trim()){ err.textContent="内容为空"; return; }
        try{ JSON.parse(raw); err.textContent="✅ JSON 合法"; err.style.color="#27ae60"; setTimeout(function(){err.style.color="";},2000); stat.textContent="长度 "+raw.length+" 字符"; }
        catch(e){
          err.style.color=""; var m=e.message; var mm=m.match(/position (\d+)/);
          if(mm){ err.textContent="❌ 第 "+locOf(raw,+mm[1])+" 附近：语法错误"; }
          else err.textContent="❌ "+m;
          out.textContent="—";
        }
      };
      document.getElementById("sample").onclick=function(){
        input.value='{\n  "site": "XHCDNS",\n  "tools": [\n    {"name":"计算器","cat":"实用"},\n    {"name":"俄罗斯方块","cat":"游戏"}\n  ],\n  "open": true\n}';
        document.getElementById("beautify").onclick();
      };
      document.getElementById("clear").onclick=function(){ input.value=""; out.textContent="—"; err.textContent=""; stat.textContent=""; };
      out.onclick=function(){ if(out.textContent&&out.textContent!=="—") copy(out.textContent); };

      document.getElementById("year").textContent=new Date().getFullYear();
    })();
  </script>

  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
