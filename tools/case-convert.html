<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大小写与格式转换 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    textarea.input{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit;line-height:1.6;}
    textarea.input:focus{outline:none;border-color:var(--primary);}
    .conv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
    .conv-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
    .conv-item .ch{font-size:12.5px;color:var(--primary);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;}
    .conv-item .ch .cc{color:var(--text-3);cursor:pointer;user-select:none;}
    .conv-item .cc:hover{color:var(--primary);}
    .conv-item code{display:block;font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;line-height:1.6;color:var(--text);word-break:break-all;white-space:pre-wrap;}
    .tip-toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:9999;}
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @media(max-width:560px){.conv-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🔡</span>
      <h1>大小写与格式转换</h1>
    </div>
    <p class="tool-sub">输入一段文本，实时生成多种大小写与命名风格，支持全半角互转，点击即可复制。</p>

    <div class="panel">
      <h2><span class="bar"></span> 输入文本</h2>
      <textarea class="input" id="srcInput" placeholder="在此输入文本，下方会实时转换…"></textarea>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 转换结果</h2>
      <div class="conv-grid" id="convGrid"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var toastEl = $("tipToast");
      function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove("show");},1700);}

      function toFull(s){return s.replace(/[!-~]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+0xFEE0);});}
      function toHalf(s){return s.replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});}
      function camel(s){return s.replace(/[^a-zA-Z0-9]+(.)/g,function(m,p){return p.toUpperCase();}).replace(/^./,function(c){return c.toLowerCase();});}
      function pascal(s){var c=camel(s);return c?c.charAt(0).toUpperCase()+c.slice(1):"";}
      function snake(s){return s.replace(/([a-z0-9])([A-Z])/g,"$1_$2").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"").toLowerCase();}
      function kebab(s){return snake(s).replace(/_/g,"-");}
      function titleCase(s){return s.toLowerCase().replace(/(^|\s|\p{P})\p{L}/gu,function(c){return c.toUpperCase();});}

      var ITEMS=[
        {name:"大写 UPPER",fn:function(s){return s.toUpperCase();}},
        {name:"小写 lower",fn:function(s){return s.toLowerCase();}},
        {name:"首字母大写",fn:function(s){return s.toLowerCase().replace(/(^|\s)\p{L}/gu,function(c){return c.toUpperCase();});}},
        {name:"标题格式",fn:titleCase},
        {name:"驼峰 camelCase",fn:camel},
        {name:"帕斯卡 PascalCase",fn:pascal},
        {name:"下划线 snake_case",fn:snake},
        {name:"连字符 kebab-case",fn:kebab},
        {name:"全角",fn:toFull},
        {name:"半角",fn:toHalf}
      ];

      function render(){
        var s=$("srcInput").value;
        var grid=$("convGrid");
        if(!s){grid.innerHTML='<div style="color:var(--text-3);font-size:13px;grid-column:1/-1;text-align:center;padding:16px 0;">输入文本后在此查看结果</div>';return;}
        grid.innerHTML="";
        ITEMS.forEach(function(it){
          var out=it.fn(s);
          var d=document.createElement("div");
          d.className="conv-item";
          d.innerHTML='<div class="ch"><span>'+it.name+'</span><span class="cc">复制</span></div><code></code>';
          d.querySelector("code").textContent=out;
          grid.appendChild(d);
        });
      }

      $("srcInput").addEventListener("input", render);

      $("convGrid").addEventListener("click", function(e){
        if(e.target.classList.contains("cc")){
          var code=e.target.closest(".conv-item").querySelector("code").textContent;
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(code).then(function(){toast("已复制");},function(){fallback(code);});
          }else fallback(code);
          function fallback(t){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制");}catch(err){toast("复制失败");}document.body.removeChild(ta);}
        }
      });

      render();
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
