<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON 对比 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .jd-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:560px){.jd-cols{grid-template-columns:1fr;}}
    .jd-out{margin-top:12px;font-family:monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;}
    .jd-add{color:#27ae60;}.jd-del{color:#c0392b;}.jd-chg{color:#e67e22;}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🆚</span>
      <h1>JSON 对比</h1>
    </div>
    <p class="tool-sub">粘贴两份 JSON，逐键比较，列出新增、删除与变更。</p>

    <div class="panel">
      <div class="jd-cols">
        <textarea id="jdA" rows="8" placeholder="原始 JSON"></textarea>
        <textarea id="jdB" rows="8" placeholder="修改后 JSON"></textarea>
      </div>
      <div class="row" style="justify-content:center;">
        <button class="btn primary" id="jdRun">比较</button>
        <button class="btn" id="jdClear">清空</button>
      </div>
      <div class="jd-out" id="jdOut"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHCDNS · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var aEl=document.getElementById('jdA'),bEl=document.getElementById('jdB'),out=document.getElementById('jdOut');
      function walk(pa,pb,path,lines){
        var ta=typ(pa),tb=typ(pb);
        if(ta==='obj'&&tb==='obj'){
          var keys={};var all=Object.keys(pa).concat(Object.keys(pb));
          for(var i=0;i<all.length;i++)keys[all[i]]=1;
          for(var k in keys){
            var np=path?path+'.'+k:k;
            if(!(k in pa))lines.push(['+',np,JSON.stringify(pb[k])]);
            else if(!(k in pb))lines.push(['-',np,JSON.stringify(pa[k])]);
            else walk(pa[k],pb[k],np,lines);
          }
        }else if(ta==='arr'&&tb==='arr'){
          var n=Math.max(pa.length,pb.length);
          for(var i=0;i<n;i++){var np=path+'['+i+']';
            if(i>=pa.length)lines.push(['+',np,JSON.stringify(pb[i])]);
            else if(i>=pb.length)lines.push(['-',np,JSON.stringify(pa[i])]);
            else walk(pa[i],pb[i],np,lines);}
        }else{
          if(JSON.stringify(pa)!==JSON.stringify(pb))lines.push(['~',path,JSON.stringify(pa)+' → '+JSON.stringify(pb)]);
        }
      }
      function typ(v){return v===null?'null':Array.isArray(v)?'arr':typeof v;}
      document.getElementById('jdRun').onclick=function(){
        try{var A=JSON.parse(aEl.value),B=JSON.parse(bEl.value);var lines=[];walk(A,B,'',lines);
          if(!lines.length){out.innerHTML='<span class="jd-add">两份 JSON 完全一致 ✅</span>';return;}
          var h='';for(var i=0;i<lines.length;i++){var c=lines[i][0];var cls=c==='+'?'jd-add':c==='-'?'jd-del':'jd-chg';h+='<div class="'+cls+'">'+c+' '+lines[i][1]+' = '+lines[i][2]+'</div>';}
          out.innerHTML=h;
        }catch(e){out.innerHTML='<span class="jd-del">解析错误：'+e.message+'</span>';}
      };
      document.getElementById('jdClear').onclick=function(){aEl.value='';bEl.value='';out.textContent='';};
    })();
  </script>
</body>
</html>
