<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>速算挑战 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .mq-q{font-size:30px;font-weight:800;text-align:center;margin:16px 0;color:var(--primary);}
    .mq-info{display:flex;justify-content:space-around;font-size:16px;color:var(--text-2);margin-bottom:10px;}
    .mq-info b{color:var(--text);font-size:20px;}
    .mq-stats{font-size:40px;font-weight:800;text-align:center;color:var(--primary);margin:16px 0;}
    .mq-area{display:none;}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🧠</span>
      <h1>速算挑战</h1>
    </div>
    <p class="tool-sub">30 秒内尽可能多地答对随机四则运算题，看看你能拿多少分。</p>

    <div class="panel">
      <div class="mq-info"><span>得分：<b id="mqScore">0</b></span><span>剩余：<b id="mqTime">30</b>s</span></div>
      <div class="mq-q" id="mqQ">准备开始</div>
      <div class="row" style="justify-content:center;">
        <button class="btn primary" id="mqStart">开始挑战</button>
        <input id="mqAns" type="number" placeholder="答案" style="display:none;width:120px;">
        <button class="btn" id="mqNext" style="display:none;">下一题</button>
      </div>
      <div class="mq-stats" id="mqFinal" style="display:none;"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHCDNS · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var score=0,time=30,a=0,b=0,op='+',ans=0,timer=null,running=false;
      var q=document.getElementById('mqQ'),scoreEl=document.getElementById('mqScore'),timeEl=document.getElementById('mqTime');
      var ansEl=document.getElementById('mqAns'),nextBtn=document.getElementById('mqNext'),finalEl=document.getElementById('mqFinal'),startBtn=document.getElementById('mqStart');
      function nextQ(){var ops=['+','-','*'];op=ops[Math.floor(Math.random()*3)];a=1+Math.floor(Math.random()*20);b=1+Math.floor(Math.random()*20);if(op==='-'){if(b>a){var t=a;a=b;b=t;}}ans=op==='+'?a+b:op==='-'?a-b:a*b;q.textContent=a+' '+op+' '+b+' = ?';ansEl.value='';ansEl.focus();}
      function tick(){time--;timeEl.textContent=time;if(time<=0)end();}
      function end(){running=false;clearInterval(timer);q.textContent='时间到！';ansEl.style.display='none';nextBtn.style.display='none';startBtn.style.display='inline-block';startBtn.textContent='再来一次';finalEl.style.display='block';finalEl.textContent='最终得分：'+score;}
      startBtn.onclick=function(){score=0;time=30;scoreEl.textContent=0;timeEl.textContent=30;running=true;finalEl.style.display='none';ansEl.style.display='inline-block';nextBtn.style.display='inline-block';startBtn.style.display='none';nextQ();timer=setInterval(tick,1000);};
      function submit(){if(!running)return;if(parseInt(ansEl.value,10)===ans){score++;scoreEl.textContent=score;}nextQ();}
      nextBtn.onclick=submit;
      ansEl.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
    })();
  </script>
</body>
</html>
