<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哈希计算 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    textarea.input{
      width:100%;box-sizing:border-box;min-height:120px;resize:vertical;
      border:1px solid var(--border);background:var(--bg);color:var(--text);
      border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit;line-height:1.6;
    }
    textarea.input:focus{outline:none;border-color:var(--primary);}
    .row{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;}
    .field{flex:1;min-width:160px;}
    .field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
    .field select{
      width:100%;box-sizing:border-box;border:1px solid var(--border);background:var(--bg);
      color:var(--text);border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;
    }
    .field select:focus{outline:none;border-color:var(--primary);}
    .btn-primary{width:100%;border:none;background:var(--primary);color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;margin-top:10px;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .opt-row{display:flex;gap:20px;flex-wrap:wrap;}
    .opt{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-2);cursor:pointer;user-select:none;}
    .opt input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}
    .result-list{display:flex;flex-direction:column;gap:12px;}
    .res-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
    .res-item .rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .res-item .ralg{font-size:13px;font-weight:700;color:var(--primary);}
    .res-item code{display:block;font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;line-height:1.7;color:var(--text);word-break:break-all;}
    .res-item .rcopy{font-size:12px;color:var(--text-3);cursor:pointer;user-select:none;}
    .res-item .rcopy:hover{color:var(--primary);}
    .empty{color:var(--text-3);font-size:13px;text-align:center;padding:24px 0;}
    .tip-toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:9999;}
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @media(max-width:560px){.row{gap:10px;}.field{min-width:130px;}}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🔐</span>
      <h1>哈希计算</h1>
    </div>
    <p class="tool-sub">基于浏览器原生 Web Crypto 计算 SHA 系列摘要，纯本地运行不上传数据，支持 Hex 与 Base64 输出。</p>

    <div class="panel">
      <h2><span class="bar"></span> 输入与设置</h2>
      <textarea class="input" id="srcInput" placeholder="在此输入要计算哈希的文本…"></textarea>
      <div class="opt-row" style="margin-top:14px;">
        <label class="opt"><input type="radio" name="fmt" value="hex" checked> Hex 十六进制</label>
        <label class="opt"><input type="radio" name="fmt" value="b64"> Base64</label>
      </div>
      <button class="btn-primary" id="calcBtn" style="margin-top:16px;">⚡ 计算哈希</button>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 计算结果</h2>
      <div class="result-list" id="resultList"><div class="empty">点击上方按钮开始计算</div></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var toastEl = $("tipToast");
      function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove("show");},1700);}

      function toHex(buf){
        var b=new Uint8Array(buf), s="";
        for(var i=0;i<b.length;i++) s+=b[i].toString(16).padStart(2,"0");
        return s;
      }
      function toB64(buf){
        var b=new Uint8Array(buf), s="";
        for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
        return btoa(s);
      }

      var ALGS=["SHA-1","SHA-256","SHA-384","SHA-512"];
      var SHORT={"SHA-1":"SHA-1","SHA-256":"SHA-256","SHA-384":"SHA-384","SHA-512":"SHA-512"};

      async function calc(){
        var txt = $("srcInput").value;
        if(!txt){ toast("请先输入文本"); return; }
        var fmt = document.querySelector('input[name="fmt"]:checked').value;
        var list = $("resultList");
        list.innerHTML = "";
        var enc = new TextEncoder();
        var buf = enc.encode(txt);
        var anyFail=false;
        for(var i=0;i<ALGS.length;i++){
          var alg=ALGS[i];
          var item=document.createElement("div");
          item.className="res-item";
          item.innerHTML='<div class="rh"><span class="ralg">'+SHORT[alg]+'</span><span class="rcopy" data-alg="'+alg+'">复制</span></div><code>计算中…</code>';
          list.appendChild(item);
          var codeEl=item.querySelector("code");
          try{
            var d=await crypto.subtle.digest(alg, buf);
            var out = fmt==="b64" ? toB64(d) : toHex(d);
            codeEl.textContent = out;
          }catch(e){
            anyFail=true;
            codeEl.textContent="该算法不可用（需在 HTTPS/localhost 环境）";
          }
        }
        if(anyFail) toast("部分算法需要安全上下文");
      }

      $("calcBtn").addEventListener("click", calc);

      $("resultList").addEventListener("click", function(e){
        if(e.target.classList.contains("rcopy")){
          var item=e.target.closest(".res-item");
          var code=item.querySelector("code").textContent;
          if(!code || code.indexOf("计算")>-1 || code.indexOf("不可用")>-1){toast("无可复制结果");return;}
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(code).then(function(){toast("已复制 "+e.target.dataset.alg);},function(){fallback(code);});
          }else fallback(code);
          function fallback(s){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制");}catch(err){toast("复制失败");}document.body.removeChild(ta);}
        }
      });
    })();
  </script>

  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
