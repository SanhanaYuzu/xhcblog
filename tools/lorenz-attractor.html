<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洛伦兹吸引子 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:880px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 18px;}

    .layout{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start;}
    .canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px;}
    canvas{display:block;width:100%;height:auto;background:#0d1117;border-radius:10px;}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}

    .ctrl{margin-bottom:14px;}
    .ctrl label{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
    .ctrl input[type=range]{width:100%;accent-color:var(--primary);}
    .btn-row{display:flex;gap:8px;}
    .btn-row button{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-row button:hover{border-color:var(--primary);color:var(--primary);}
    .btn-row button.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn-row button.primary:hover{background:var(--primary-dark);color:#fff;}
    .legend{font-size:12px;color:var(--text-3);line-height:1.9;margin-top:10px;}

    @media(max-width:720px){.layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🦋</span>
      <h1>洛伦兹吸引子</h1>
    </div>
    <p class="tool-sub">由大气对流方程导出的经典混沌系统。轨迹在双翼间永不重复地翻飞，是"蝴蝶效应"的几何化身。</p>

    <div class="layout">
      <div class="canvas-wrap">
        <canvas id="cv" width="560" height="520"></canvas>
      </div>
      <div class="panel">
        <h2><span class="bar"></span> 参数</h2>
        <div class="ctrl">
          <label>ρ (rho) <span id="rVal">28</span></label>
          <input type="range" id="rho" min="10" max="50" step="0.5" value="28">
        </div>
        <div class="ctrl">
          <label>σ (sigma) <span id="sVal">10</span></label>
          <input type="range" id="sig" min="2" max="20" step="0.5" value="10">
        </div>
        <div class="ctrl">
          <label>β (beta) <span id="bVal">2.67</span></label>
          <input type="range" id="bet" min="1" max="5" step="0.05" value="2.666">
        </div>
        <div class="ctrl">
          <label>速度 <span id="vVal">1.0×</span></label>
          <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
        </div>
        <div class="btn-row">
          <button id="resetBtn">↺ 重置</button>
          <button id="pauseBtn" class="primary">⏸ 暂停</button>
        </div>
        <div class="legend">
          蓝→红表示轨迹随时间推进。<br>
          拖动滑块可看到吸引子形态突变。
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var cv = document.getElementById("cv");
      var ctx = cv.getContext("2d");
      var W = cv.width, H = cv.height;

      var rho=28, sigma=10, beta=2.666, speed=1;
      var x,y,z, pts, paused=false, rotY=0;

      function reset(){
        x=0.01; y=0; z=0; pts=[]; rotY=0;
      }

      function step(dt){
        var dx = sigma*(y-x);
        var dy = x*(rho-z)-y;
        var dz = x*y - beta*z;
        x += dx*dt; y += dy*dt; z += dz*dt;
        rotY += dt*0.25;
      }

      // 3D->2D 投影（绕Y轴旋转 + 等距投影）
      function project(px,py,pz){
        var cos=Math.cos(rotY), sin=Math.sin(rotY);
        var rx = px*cos - pz*sin;
        var rz = px*sin + pz*cos;
        var sc = 9;
        var ox=W/2, oy=H/2+20;
        return {x:ox+rx*sc, y:oy - (py-rz*0.4)*sc};
      }

      function draw(){
        ctx.fillStyle="rgba(13,17,23,0.18)"; // 拖影
        ctx.fillRect(0,0,W,H);
        if(pts.length>1){
          for(var i=1;i<pts.length;i++){
            var p0=project(pts[i-1][0],pts[i-1][1],pts[i-1][2]);
            var p1=project(pts[i][0],pts[i][1],pts[i][2]);
            var t=i/pts.length;
            var r=Math.round(40+215*t), b=Math.round(220-160*t);
            ctx.strokeStyle="rgb("+r+","+Math.round(120*t)+","+b+")";
            ctx.lineWidth=1.4;
            ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
          }
        }
      }

      function loop(){
        if(!paused){
          for(var i=0;i<6;i++) step(0.006*speed);
          pts.push([x,y,z]);
          if(pts.length>900) pts.shift();
        }
        draw();
        requestAnimationFrame(loop);
      }

      document.getElementById("rho").oninput=function(){rho=+this.value;document.getElementById("rVal").textContent=rho;};
      document.getElementById("sig").oninput=function(){sigma=+this.value;document.getElementById("sVal").textContent=sigma;};
      document.getElementById("bet").oninput=function(){beta=+this.value;document.getElementById("bVal").textContent=beta.toFixed(2);};
      document.getElementById("speed").oninput=function(){speed=+this.value;document.getElementById("vVal").textContent=speed.toFixed(1)+"×";};
      document.getElementById("resetBtn").onclick=reset;
      document.getElementById("pauseBtn").onclick=function(){paused=!paused;this.textContent=paused?"▶ 继续":"⏸ 暂停";};

      reset();
      requestAnimationFrame(loop);
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
