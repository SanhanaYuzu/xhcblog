<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTTP 状态码速查 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .hs-list{max-height:420px;overflow-y:auto;}
    .hs-item{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);}
    .hs-code{font-weight:800;font-size:16px;min-width:54px;}
    .hs-2{color:#27ae60;}.hs-3{color:#2980b9;}.hs-4{color:#e67e22;}.hs-5{color:#c0392b;}
    .hs-text{color:var(--text-2);font-size:14px;}
    .hs-text b{color:var(--text);}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">📟</span>
      <h1>HTTP 状态码速查</h1>
    </div>
    <p class="tool-sub">常见 HTTP 状态码中英文对照，支持关键词搜索。</p>

    <div class="panel">
      <input id="hsSearch" type="text" placeholder="搜索状态码或含义，如 404 / 未找到" style="width:100%;margin-bottom:12px;">
      <div class="hs-list" id="hsList"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHC 博客 · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var DATA=[
        [200,'OK','请求成功'],
        [201,'Created','已创建'],
        [204,'No Content','无内容'],
        [301,'Moved Permanently','永久重定向'],
        [302,'Found','临时重定向'],
        [304,'Not Modified','未修改（缓存）'],
        [400,'Bad Request','请求有误'],
        [401,'Unauthorized','未授权'],
        [403,'Forbidden','禁止访问'],
        [404,'Not Found','未找到'],
        [405,'Method Not Allowed','方法不允许'],
        [408,'Request Timeout','请求超时'],
        [429,'Too Many Requests','请求过于频繁'],
        [500,'Internal Server Error','服务器内部错误'],
        [502,'Bad Gateway','网关错误'],
        [503,'Service Unavailable','服务不可用'],
        [504,'Gateway Timeout','网关超时']
      ];
      var list=document.getElementById('hsList'),search=document.getElementById('hsSearch');
      function render(kw){
        kw=(kw||'').toLowerCase();list.innerHTML='';
        for(var i=0;i<DATA.length;i++){var d=DATA[i];if(kw&&((''+d[0]).indexOf(kw)<0&&d[1].toLowerCase().indexOf(kw)<0&&d[2].toLowerCase().indexOf(kw)<0))continue;
          var it=document.createElement('div');it.className='hs-item';
          it.innerHTML='<div class="hs-code hs-'+(Math.floor(d[0]/100))+'">'+d[0]+'</div><div class="hs-text"><b>'+d[1]+'</b> · '+d[2]+'</div>';
          list.appendChild(it);}
      }
      search.oninput=function(){render(search.value);};
      render('');
    })();
  </script>
</body>
</html>
