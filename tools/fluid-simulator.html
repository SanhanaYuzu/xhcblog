<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流体物理模拟器 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .sim-wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 22px;}
    .stage{
      position:relative;background:#04060c;border-radius:16px;overflow:hidden;
      border:1px solid #1a2030;box-shadow:0 10px 40px rgba(0,0,0,.5);
    }
    body.dark .stage{border-color:#232c3d;background:#03050b;}
    #fluid{display:block;width:100%;height:auto;touch-action:none;cursor:cross;}
    .fl-controls{
      display:flex;flex-wrap:wrap;align-items:center;gap:14px;
      padding:14px 16px;margin-top:14px;background:var(--card);
      border:1px solid var(--border);border-radius:14px;
    }
    .btn-ctrl{
      border:1px solid var(--border);background:var(--bg);color:var(--text);
      border-radius:11px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;
      font-family:inherit;transition:.15s;
    }
    .btn-ctrl:hover{border-color:var(--primary);color:var(--primary);}
    .ctrl-group{display:flex;align-items:center;gap:10px;}
    .ctrl-group label{font-size:13px;color:var(--text-2);white-space:nowrap;}
    .ctrl-group input[type=range]{width:150px;accent-color:var(--primary);cursor:pointer;}
    .ctrl-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none;}
    .ctrl-check input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
    .fl-hint{font-size:12.5px;color:var(--text-3);margin-top:14px;line-height:1.7;}
    @media(max-width:560px){
      .fl-controls{padding:12px;flex-direction:column;align-items:stretch;}
      .ctrl-group input[type=range]{width:100%;}
    }
  </style>
</head>
<body>

  <!-- 页面跳转加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="sim-wrap">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🌊</span>
      <h1>流体物理模拟器</h1>
    </div>
    <p class="tool-sub">基于粒子的流体动画。在画布上拖动鼠标即可产生流体扰动，粒子以彩虹色流动、相互吸引并留下柔和拖尾。</p>

    <div class="stage">
      <canvas id="fluid"></canvas>
    </div>

    <div class="fl-controls">
      <div class="ctrl-group">
        <label>粒子数量 <span id="flCountVal">240</span></label>
        <input id="flCount" type="range" min="60" max="900" step="20" value="240">
      </div>
      <label class="ctrl-check"><input type="checkbox" id="flGravity" checked> 重力</label>
      <div class="ctrl-group">
        <label>摩擦力 <span id="flFricVal">0.94</span></label>
        <input id="flFric" type="range" min="0.80" max="0.99" step="0.01" value="0.94">
      </div>
      <button id="flClear" class="btn-ctrl">🗑 清除</button>
    </div>

    <p class="fl-hint">
      提示：在画布上按住并移动鼠标可产生流体涌动；调小「摩擦力」让粒子更飘逸，调大「粒子数量」让画面更密集。
      开启「重力」后粒子会缓缓下沉，形成瀑布般的下落流体。
    </p>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
  (function () {
    const canvas = document.getElementById('fluid');
    const ctx = canvas.getContext('2d');
    let W, H, dpr;
    let particles = [];
    let targetCount = 240;
    let gravityOn = true;
    let friction = 0.94;
    let mouse = { x: 0, y: 0, down: false };
    let raf = null;
    let hueShift = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      W = w; H = h;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeParticle(x, y) {
      const ang = Math.random() * Math.PI * 2;
      const sp = Math.random() * 1.6 + 0.4;
      return {
        x: x, y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        r: Math.random() * 3 + 2,
        hue: (hueShift + Math.random() * 40) % 360
      };
    }

    function spawnBatch(n) {
      for (let i = 0; i < n; i++) {
        particles.push(makeParticle(
          Math.random() * W, Math.random() * H
        ));
      }
    }

    function clearAll() {
      particles = [];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawParticle(p) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ',90%,62%,0.9)';
      ctx.shadowBlur = 16;
      ctx.shadowColor = 'hsla(' + p.hue + ',90%,62%,0.9)';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function step() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(4,6,12,0.16)';
      ctx.fillRect(0, 0, W, H);

      if (mouse.down) {
        for (let i = 0; i < 3; i++) {
          if (particles.length < 1500) {
            particles.push(makeParticle(
              mouse.x + (Math.random() - 0.5) * 18,
              mouse.y + (Math.random() - 0.5) * 18
            ));
          }
        }
      }

      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (mouse.down) {
          const ax = mouse.x - p.x, ay = mouse.y - p.y;
          const d = Math.hypot(ax, ay) + 0.001;
          const f = Math.max(0, 1 - d / 130);
          p.vx += ax / d * f * 0.4;
          p.vy += ay / d * f * 0.4;
        }
        if (gravityOn) p.vy += 0.10;
        p.vx *= friction; p.vy *= friction;
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x += W; else if (p.x > W) p.x -= W;
        if (p.y < 0) p.y += H; else if (p.y > H) p.y -= H;
        p.hue = (p.hue + 0.6) % 360;
        drawParticle(p);
        if (particles.length > targetCount && Math.random() < 0.04) particles.splice(i, 1);
      }
      ctx.globalCompositeOperation = 'source-over';
      hueShift = (hueShift + 0.25) % 360;
      raf = requestAnimationFrame(step);
    }

    function start() {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(step);
    }

    // 交互
    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - rect.left) * (W / rect.width),
        y: (t.clientY - rect.top) * (H / rect.height)
      };
    }
    canvas.addEventListener('mousedown', e => { mouse.down = true; const q = pos(e); mouse.x = q.x; mouse.y = q.y; });
    canvas.addEventListener('mousemove', e => { if (mouse.down) { const q = pos(e); mouse.x = q.x; mouse.y = q.y; } });
    window.addEventListener('mouseup', () => mouse.down = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); mouse.down = true; const q = pos(e); mouse.x = q.x; mouse.y = q.y; }, { passive: false });
    canvas.addEventListener('touchmove', e => { if (mouse.down) { e.preventDefault(); const q = pos(e); mouse.x = q.x; mouse.y = q.y; } }, { passive: false });
    window.addEventListener('touchend', () => mouse.down = false);

    // 控件
    const countInput = document.getElementById('flCount');
    const countVal = document.getElementById('flCountVal');
    const gravityChk = document.getElementById('flGravity');
    const fricInput = document.getElementById('flFric');
    const fricVal = document.getElementById('flFricVal');
    const clearBtn = document.getElementById('flClear');

    countInput.addEventListener('input', () => {
      targetCount = parseInt(countInput.value, 10);
      countVal.textContent = targetCount;
    });
    gravityChk.addEventListener('change', () => gravityOn = gravityChk.checked);
    fricInput.addEventListener('input', () => {
      friction = parseFloat(fricInput.value);
      fricVal.textContent = friction.toFixed(2);
    });
    clearBtn.addEventListener('click', clearAll);

    function init() {
      resize();
      spawnBatch(targetCount);
      start();
      window.addEventListener('resize', () => { resize(); if (!mouse.down) {/* keep particles */} });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>

  <!-- 站内链接修正 + 搜索 -->
  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? '../' + h : null;
      }
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!a) return;
        var n = fix(a.getAttribute('href'));
        if (n) a.setAttribute('href', n);
      }, true);
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var si = document.getElementById('searchInput'), sb = document.getElementById('searchBtn');
          if (!si || !sb) return;
          var go = function () { location.href = '../index.html?q=' + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <!-- 左下角水印 -->
  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
