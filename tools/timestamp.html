<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时间戳转换 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;box-sizing:border-box;}
    textarea{resize:vertical;min-height:64px;}
    .field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:11px 13px;color:var(--text);word-break:break-all;cursor:pointer;}
    .out:hover{border-color:var(--primary);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
    .big{font-size:18px;color:var(--primary);font-weight:700;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">⏰</span>
      <div>
        <h1>时间戳转换</h1>
        <p class="tool-sub">Unix 时间戳 ↔ 日期时间，支持秒 / 毫秒，默认北京时间</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 当前时间戳</h2>
      <div class="row"><div class="out big" id="nowTs" title="点击复制">—</div></div>
      <div class="btns">
        <button class="btn-ghost" id="copyNow">📋 复制当前时间戳</button>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 时间戳 → 日期</h2>
      <div class="row">
        <input type="text" id="tsInput" placeholder="输入时间戳，如 1700000000 或 1700000000000">
      </div>
      <div class="row">
        <div class="field"><input type="radio" name="unit" id="uSec" checked><label for="uSec">秒</label></div>
        <div class="field"><input type="radio" name="unit" id="uMs"><label for="uMs">毫秒</label></div>
      </div>
      <div class="out" id="tsOut" title="点击复制">—</div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 日期 → 时间戳</h2>
      <div class="row">
        <input type="text" id="dateInput" placeholder="如 2026-08-01 12:00:00">
      </div>
      <div class="btns">
        <button class="btn-primary" id="toTs">转换</button>
        <button class="btn-ghost" id="nowBtn">用当前时间</button>
      </div>
      <div class="out" id="dateOut" title="点击复制" style="margin-top:12px;">—</div>
      <div class="note">北京时间 = UTC+8。时间戳通常以秒或毫秒计；毫秒为 13 位、秒为 10 位。点击任意结果框可复制。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var nowTs=document.getElementById("nowTs"), copyNow=document.getElementById("copyNow");
      var tsInput=document.getElementById("tsInput"), tsOut=document.getElementById("tsOut");
      var uSec=document.getElementById("uSec"), uMs=document.getElementById("uMs");
      var dateInput=document.getElementById("dateInput"), dateOut=document.getElementById("dateOut");
      var toTs=document.getElementById("toTs"), nowBtn=document.getElementById("nowBtn");

      function pad(n){return n<10?"0"+n:""+n;}
      function fmtBJ(d){
        // d 为 Date（UTC 内部）
        var utc=d.getTime()+d.getTimezoneOffset()*60000;
        var bj=new Date(utc+8*3600000);
        return bj.getFullYear()+"-"+pad(bj.getMonth()+1)+"-"+pad(bj.getDate())+" "+pad(bj.getHours())+":"+pad(bj.getMinutes())+":"+pad(bj.getSeconds())+" (北京时间)";
      }
      function toast(m){ var t=document.createElement("div"); t.textContent=m; t.style.cssText="position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:14px;"; document.body.appendChild(t); setTimeout(function(){document.body.removeChild(t);},1400); }
      function copy(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("已复制");},function(){fallback(t);});} else fallback(t); }
      function fallback(t){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("已复制");}catch(e){toast("复制失败");} document.body.removeChild(ta); }

      function tick(){ nowTs.textContent=Math.floor(Date.now()/1000)+"  (秒)"; }
      tick(); setInterval(tick,1000);

      copyNow.onclick=function(){ copy(Math.floor(Date.now()/1000)); };
      nowTs.onclick=function(){ copy(Math.floor(Date.now()/1000)); };
      tsInput.oninput=function(){
        var v=this.value.trim();
        if(!v){ tsOut.textContent="—"; return; }
        var n=Number(v);
        if(!isFinite(n)){ tsOut.textContent="无效时间戳"; return; }
        var ms=uMs.checked? n : n*1000;
        var d=new Date(ms);
        if(isNaN(d.getTime())){ tsOut.textContent="无效时间戳"; return; }
        tsOut.textContent=fmtBJ(d);
      };
      uSec.onchange=uMs.onchange=function(){ tsInput.oninput(); };
      tsOut.onclick=function(){ if(tsOut.textContent&&tsOut.textContent!=="—") copy(tsOut.textContent); };

      function parseDate(s){
        s=s.trim().replace("T"," ");
        var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ ](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/);
        if(!m) return null;
        var y=+m[1],mo=+m[2]-1,d=+m[3],h=m[4]?+m[4]:0,mi=m[5]?+m[5]:0,se=m[6]?+m[6]:0;
        // 视为北京时间，转为 UTC 毫秒
        var bjMs=Date.UTC(y,mo,d,h,mi,se)-8*3600000;
        return bjMs;
      }
      toTs.onclick=function(){
        var ms=parseDate(dateInput.value);
        if(ms===null){ dateOut.textContent="日期格式不正确，示例：2026-08-01 12:00:00"; return; }
        dateOut.textContent="秒："+Math.floor(ms/1000)+"    毫秒："+ms;
      };
      nowBtn.onclick=function(){
        var d=new Date();
        dateInput.value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
        toTs.onclick();
      };
      dateOut.onclick=function(){ if(dateOut.textContent&&dateOut.textContent!=="—") copy(dateOut.textContent); };

      document.getElementById("year").textContent=new Date().getFullYear();
    })();
  </script>

  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
