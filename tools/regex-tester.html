<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正则表达式测试器 - XHC 博客</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
/* 所有样式统一加 .tool-page 前缀，避免与全局 style.css 冲突 */
.tool-page{max-width:960px;}
.tool-page .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.tool-page .panel-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.tool-page .lbl{font-size:14px;font-weight:700;color:var(--text-2);}
.tool-page .meta{margin-left:auto;font-size:12px;color:var(--text-3);}
.tool-page .re-input{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden;}
.tool-page .re-input .slash{padding:0 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;color:var(--text-3);user-select:none;flex:0 0 auto;}
.tool-page .re-input input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;color:inherit;outline:none;}
.tool-page .re-input .tail{padding:0 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--primary);user-select:none;flex:0 0 auto;font-weight:700;}
.tool-page .re-input.bad{border-color:#e74c3c;}
.tool-page .re-input:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,110,253,.12);}
.tool-page .flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.tool-page .flags label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:18px;background:var(--bg);font-size:13px;cursor:pointer;user-select:none;transition:.15s;}
.tool-page .flags label:hover{border-color:var(--primary);}
.tool-page .flags label.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600;}
.tool-page .flags input{accent-color:var(--primary);margin:0;}
.tool-page .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.tool-page .presets button{padding:6px 14px;border-radius:18px;border:1px dashed var(--border);background:transparent;color:var(--text-2);font-size:13px;cursor:pointer;transition:.15s;}
.tool-page .presets button:hover{border-style:solid;border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
.tool-page textarea{width:100%;box-sizing:border-box;min-height:160px;resize:vertical;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.7;}
.tool-page textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,110,253,.12);}
.tool-page .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px;}
.tool-page .btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
.tool-page .btn:hover{border-color:var(--primary);color:var(--primary);}
.tool-page .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.tool-page .btn.primary:hover{background:var(--primary-dark);color:#fff;}
.tool-page .tip{margin:12px 0;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.7;display:none;word-break:break-all;}
.tool-page .tip.err{display:block;background:#fdecec;color:#c0392b;border:1px solid #f5c6c6;}
.tool-page .tip.ok{display:block;background:#eaf7ee;color:#1e7e34;border:1px solid #c3e6cb;}
.tool-page .tip b{display:block;margin-bottom:4px;font-size:14px;}
.tool-page .hl{padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;}
.tool-page .hl mark{background:#ffe58f;color:#5c3d00;padding:1px 2px;border-radius:3px;box-shadow:0 0 0 1px rgba(230,180,20,.5);}
.tool-page .hl mark.alt{background:#b7e4ff;color:#004a70;box-shadow:0 0 0 1px rgba(20,140,200,.5);}
.tool-page .mlist{margin-top:14px;max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
.tool-page .mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.tool-page .mrow:last-child{border-bottom:0;}
.tool-page .mrow .idx{flex:0 0 auto;min-width:34px;height:22px;line-height:22px;text-align:center;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12px;}
.tool-page .mrow .val{flex:1;min-width:120px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--text);}
.tool-page .mrow .pos{flex:0 0 auto;color:var(--text-3);font-size:12px;}
.tool-page .mrow .grp{width:100%;padding-left:42px;color:var(--text-3);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;}
.tool-page .empty{padding:18px;text-align:center;color:var(--text-3);font-size:13px;}
.tool-page .hint{font-size:13px;color:var(--text-3);line-height:1.8;margin-top:14px;}
.tool-page .hint code{background:var(--bg);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;}
.tool-page .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(20,22,28,.92);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;}
.tool-page .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:680px){
  .tool-page .btn{flex:1 1 auto;min-width:calc(50% - 5px);padding:10px 8px;}
  .tool-page .re-input input{font-size:14px;}
  .tool-page textarea{min-height:130px;font-size:13px;}
  .tool-page .hl{font-size:13px;max-height:300px;}
  .tool-page .meta{margin-left:0;width:100%;}
  .tool-page .mrow .grp{padding-left:0;}
}
/* 深色模式适配 */
body.dark .tool-page .panel{background:var(--card);border-color:var(--border);}
body.dark .tool-page textarea,
body.dark .tool-page .re-input,
body.dark .tool-page .hl{background:#171b22;border-color:var(--border);color:var(--text);}
body.dark .tool-page .flags label{background:#171b22;border-color:var(--border);color:var(--text-2);}
body.dark .tool-page .flags label.on{background:rgba(13,110,253,.18);border-color:var(--primary);color:#7ab8ff;}
body.dark .tool-page .presets button{color:var(--text-2);border-color:var(--border);}
body.dark .tool-page .presets button:hover{background:rgba(13,110,253,.18);color:#7ab8ff;}
body.dark .tool-page .btn{background:#1d2128;color:var(--text-2);border-color:var(--border);}
body.dark .tool-page .btn.primary{background:var(--primary);color:#fff;}
body.dark .tool-page .hl mark{background:#c8971a;color:#1a1300;box-shadow:none;}
body.dark .tool-page .hl mark.alt{background:#2f7fb0;color:#eaf6ff;box-shadow:none;}
body.dark .tool-page .mlist{border-color:var(--border);}
body.dark .tool-page .mrow{border-bottom-color:var(--border);}
body.dark .tool-page .mrow .idx{background:rgba(13,110,253,.18);color:#7ab8ff;}
body.dark .tool-page .hint code{background:#171b22;border-color:var(--border);}
body.dark .tool-page .tip.err{background:#3a1d1f;color:#ff8a80;border-color:#5a2a2d;}
body.dark .tool-page .tip.ok{background:#16301f;color:#7ee2a8;border-color:#255c3a;}
</style>
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="loader-content"><img src="../assets/images/loading-logo.png" alt="" class="loader-logo"><div class="loader-bar"><div class="loader-bar-inner"></div></div></div></div>
<header class="header"><div class="container">
<a class="brand" href="../index.html"><img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo"><span class="brand-name">XHC<b>博客</b></span></a>
<nav class="nav" id="navCats"></nav>
<div class="search"><input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off"><button id="searchBtn" title="搜索">🔍</button></div>
<a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
<span id="accountSlot"></span>
</div></header>
<main class="container" style="padding:28px 0 40px;">
<a class="back-link" href="../tools.html" style="display:inline-block;margin-bottom:16px;color:var(--primary);text-decoration:none;">← 返回工具箱</a>
<section class="tool-page">
  <h1 style="font-size:24px;margin-bottom:6px;">正则表达式测试器</h1>
  <p class="sub" style="color:var(--text-3);margin-bottom:20px;">实时匹配、高亮结果、查看分组与位置</p>

  <div class="panel">
    <div class="panel-head"><span class="lbl">正则表达式（无需填写 / / 定界符）</span></div>
    <div class="re-input" id="reWrap">
      <span class="slash">/</span>
      <input id="reInput" type="text" placeholder="例如：\d{4}-\d{2}-\d{2}" spellcheck="false" autocomplete="off">
      <span class="slash">/</span>
      <span class="tail" id="flagTail">gi</span>
    </div>

    <div class="flags" id="flagBox">
      <label data-f="g" class="on"><input type="checkbox" id="fg" checked> g 全局</label>
      <label data-f="i" class="on"><input type="checkbox" id="fi" checked> i 忽略大小写</label>
      <label data-f="m"><input type="checkbox" id="fm"> m 多行</label>
      <label data-f="s"><input type="checkbox" id="fs"> s 点匹配换行</label>
      <label data-f="u"><input type="checkbox" id="fu"> u Unicode</label>
    </div>

    <div class="presets">
      <button type="button" data-re="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}">邮箱</button>
      <button type="button" data-re="1[3-9]\d{9}">手机号</button>
      <button type="button" data-re="https?://[\w\-.~:/?#\[\]@!$&'()*+,;=%]+">URL</button>
      <button type="button" data-re="\b(?:(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\b">IPv4</button>
      <button type="button" data-re="\d{4}-\d{2}-\d{2}">日期</button>
      <button type="button" data-re="#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})\b">HEX 颜色</button>
      <button type="button" data-re="[\u4e00-\u9fa5]+">中文</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="lbl">测试文本</span>
      <span class="meta" id="txtMeta">0 字符</span>
    </div>
    <textarea id="textInput" placeholder="在此粘贴要测试的文本…" spellcheck="false"></textarea>
  </div>

  <div class="btn-row">
    <button class="btn primary" id="runBtn" type="button">立即匹配</button>
    <button class="btn" id="sampleBtn" type="button">载入示例文本</button>
    <button class="btn" id="copyBtn" type="button">📋 复制结果</button>
    <button class="btn" id="clearBtn" type="button">清空</button>
  </div>

  <div class="tip" id="tipBox"></div>

  <div class="panel">
    <div class="panel-head">
      <span class="lbl">高亮预览</span>
      <span class="meta" id="cntMeta">共 0 处匹配</span>
    </div>
    <div class="hl" id="hlBox">匹配结果会在这里高亮显示…</div>
    <div class="mlist" id="mList"><div class="empty">暂无匹配</div></div>
  </div>

  <p class="hint">提示：未勾选 <code>g</code> 时只匹配第一处；「复制结果」会复制所有匹配内容（每行一条）。正则语法错误会在上方红色区域提示。</p>
  <div class="toast" id="toastBox"></div>
</section>

<script>
(function () {
  var reInput = document.getElementById('reInput');
  var reWrap = document.getElementById('reWrap');
  var textInput = document.getElementById('textInput');
  var flagTail = document.getElementById('flagTail');
  var tipBox = document.getElementById('tipBox');
  var hlBox = document.getElementById('hlBox');
  var mList = document.getElementById('mList');
  var cntMeta = document.getElementById('cntMeta');
  var txtMeta = document.getElementById('txtMeta');
  var toastBox = document.getElementById('toastBox');
  var flagIds = ['fg', 'fi', 'fm', 'fs', 'fu'];
  var flagChars = { fg: 'g', fi: 'i', fm: 'm', fs: 's', fu: 'u' };
  var lastMatches = [];
  var toastTimer = null;
  var debounceTimer = null;

  var SAMPLE = [
    '联系邮箱：xhc@dpdns.org，备用 admin@example.com',
    '客服电话：13800138000 / 15912345678',
    '官网 http://xhc.dpdns.org 备用站 https://blog.example.com/post?id=42',
    '内网地址 192.168.1.1，网关 10.0.0.254，公网 8.8.8.8',
    '发布日期 2026-08-01，更新于 2026-07-31',
    '主题色 #0d6efd，辅助色 #fff，强调 #ff6b35',
    '这是一段中文测试文本 Hello World.'
  ].join('\n');

  function toast(msg) {
    toastBox.textContent = msg;
    toastBox.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastBox.classList.remove('show'); }, 1800);
  }

  function hideTip() {
    tipBox.className = 'tip';
    tipBox.innerHTML = '';
  }

  function showTip(html, kind) {
    tipBox.className = 'tip ' + kind;
    tipBox.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function currentFlags() {
    var s = '';
    for (var i = 0; i < flagIds.length; i++) {
      var el = document.getElementById(flagIds[i]);
      if (el && el.checked) { s += flagChars[flagIds[i]]; }
    }
    return s;
  }

  function syncFlagUI() {
    var labels = document.querySelectorAll('.tool-page .flags label');
    for (var i = 0; i < labels.length; i++) {
      var cb = labels[i].querySelector('input');
      if (cb) { labels[i].classList.toggle('on', cb.checked); }
    }
    flagTail.textContent = currentFlags();
  }

  function resetOutput(msg) {
    lastMatches = [];
    hlBox.textContent = msg;
    mList.innerHTML = '<div class="empty">暂无匹配</div>';
    cntMeta.textContent = '共 0 处匹配';
  }

  function buildHighlight(text, matches) {
    if (!matches.length) { return escapeHtml(text); }
    var html = '';
    var cursor = 0;
    for (var i = 0; i < matches.length; i++) {
      var m = matches[i];
      if (m.index > cursor) { html += escapeHtml(text.slice(cursor, m.index)); }
      var body = m.text.length ? escapeHtml(m.text) : '∅';
      html += '<mark class="' + (i % 2 === 1 ? 'alt' : '') + '" title="第 ' + (i + 1) + ' 处 · 位置 ' + m.index + '">' + body + '</mark>';
      cursor = m.index + m.text.length;
    }
    if (cursor < text.length) { html += escapeHtml(text.slice(cursor)); }
    return html;
  }

  function renderList(matches) {
    if (!matches.length) {
      mList.innerHTML = '<div class="empty">暂无匹配</div>';
      return;
    }
    var html = '';
    var limit = Math.min(matches.length, 300);
    for (var i = 0; i < limit; i++) {
      var m = matches[i];
      var shown = m.text.length ? escapeHtml(m.text) : '（空字符串匹配）';
      html += '<div class="mrow">';
      html += '<span class="idx">#' + (i + 1) + '</span>';
      html += '<span class="val">' + shown + '</span>';
      html += '<span class="pos">位置 ' + m.index + ' ~ ' + (m.index + m.text.length) + ' · 长度 ' + m.text.length + '</span>';
      if (m.groups && m.groups.length) {
        var g = '';
        for (var k = 0; k < m.groups.length; k++) {
          var gv = m.groups[k];
          g += '$' + (k + 1) + '=' + (gv === undefined ? '(未匹配)' : escapeHtml(gv)) + '　';
        }
        html += '<span class="grp">分组：' + g + '</span>';
      }
      if (m.named) { html += '<span class="grp">命名分组：' + escapeHtml(m.named) + '</span>'; }
      html += '</div>';
    }
    if (matches.length > limit) {
      html += '<div class="empty">仅显示前 ' + limit + ' 条，共 ' + matches.length + ' 条</div>';
    }
    mList.innerHTML = html;
  }

  function run() {
    var pattern = reInput.value;
    var text = textInput.value;
    var flags = currentFlags();

    if (!pattern) {
      reWrap.classList.remove('bad');
      hideTip();
      resetOutput(text ? text : '匹配结果会在这里高亮显示…');
      if (text) { hlBox.textContent = text; }
      return;
    }

    var re;
    try {
      re = new RegExp(pattern, flags);
      reWrap.classList.remove('bad');
    } catch (err) {
      reWrap.classList.add('bad');
      showTip('<b>❌ 正则语法错误</b>' + escapeHtml(err && err.message ? err.message : String(err)), 'err');
      resetOutput('（正则无效，请修正后重试）');
      return;
    }

    if (!text) {
      hideTip();
      resetOutput('请输入测试文本…');
      return;
    }

    var matches = [];
    var guard = 0;
    try {
      if (re.global) {
        re.lastIndex = 0;
        var m;
        while ((m = re.exec(text)) !== null) {
          matches.push({
            text: m[0],
            index: m.index,
            groups: m.length > 1 ? Array.prototype.slice.call(m, 1) : null,
            named: m.groups ? JSON.stringify(m.groups) : ''
          });
          if (m[0] === '') { re.lastIndex++; }
          guard++;
          if (guard > 20000) { break; }
        }
      } else {
        var one = re.exec(text);
        if (one) {
          matches.push({
            text: one[0],
            index: one.index,
            groups: one.length > 1 ? Array.prototype.slice.call(one, 1) : null,
            named: one.groups ? JSON.stringify(one.groups) : ''
          });
        }
      }
    } catch (err2) {
      showTip('<b>❌ 匹配执行出错</b>' + escapeHtml(err2 && err2.message ? err2.message : String(err2)), 'err');
      resetOutput('（匹配失败）');
      return;
    }

    lastMatches = matches;
    hlBox.innerHTML = buildHighlight(text, matches);
    renderList(matches);
    cntMeta.textContent = '共 ' + matches.length + ' 处匹配';

    if (matches.length) {
      var extra = re.global ? '' : '（未开启 g，仅返回第一处）';
      showTip('<b>✅ 匹配成功</b>正则 /' + escapeHtml(pattern) + '/' + escapeHtml(flags) + ' 共找到 <b style="display:inline">' + matches.length + '</b> 处匹配。' + extra, 'ok');
    } else {
      showTip('<b>🔍 没有匹配</b>正则 /' + escapeHtml(pattern) + '/' + escapeHtml(flags) + ' 在当前文本中没有找到任何匹配。', 'err');
    }
  }

  function scheduleRun() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(run, 220);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板'); }
    catch (e) { toast('复制失败，请手动选择复制'); }
    document.body.removeChild(ta);
  }

  function copyResult() {
    if (!lastMatches.length) { toast('还没有可复制的匹配结果'); return; }
    var lines = [];
    for (var i = 0; i < lastMatches.length; i++) { lines.push(lastMatches[i].text); }
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('已复制 ' + lines.length + ' 条匹配');
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  reInput.addEventListener('input', scheduleRun);
  textInput.addEventListener('input', function () {
    txtMeta.textContent = textInput.value.length + ' 字符';
    scheduleRun();
  });

  for (var i = 0; i < flagIds.length; i++) {
    (function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', function () { syncFlagUI(); run(); });
      }
    })(flagIds[i]);
  }

  var presetBtns = document.querySelectorAll('.tool-page .presets button');
  for (var p = 0; p < presetBtns.length; p++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        reInput.value = btn.getAttribute('data-re') || '';
        if (!textInput.value) {
          textInput.value = SAMPLE;
          txtMeta.textContent = textInput.value.length + ' 字符';
        }
        run();
      });
    })(presetBtns[p]);
  }

  document.getElementById('runBtn').addEventListener('click', run);
  document.getElementById('copyBtn').addEventListener('click', copyResult);

  document.getElementById('sampleBtn').addEventListener('click', function () {
    textInput.value = SAMPLE;
    txtMeta.textContent = textInput.value.length + ' 字符';
    if (!reInput.value) { reInput.value = '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}'; }
    run();
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    reInput.value = '';
    textInput.value = '';
    txtMeta.textContent = '0 字符';
    reWrap.classList.remove('bad');
    hideTip();
    resetOutput('匹配结果会在这里高亮显示…');
    reInput.focus();
  });

  var yearEl = document.getElementById('year');
  if (yearEl && !yearEl.textContent) { yearEl.textContent = new Date().getFullYear(); }

  syncFlagUI();
})();
</script>
</body>
</html>
