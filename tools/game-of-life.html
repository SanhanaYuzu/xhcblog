<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生命游戏 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    canvas{display:block;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;cursor:pointer;}
    .ctrl-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    .field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);}
    .field input[type=range]{accent-color:var(--primary);width:120px;}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
    .stat{font-size:13px;color:var(--text-2);}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🧬</span>
      <h1>生命游戏</h1>
    </div>
    <p class="tool-sub">康威生命游戏（元胞自动机）：点击格子切换存活，观察简单规则如何涌现复杂图案。</p>

    <div class="panel">
      <h2><span class="bar"></span> 控制</h2>
      <div class="ctrl-row">
        <div class="field">速度 <span id="spdLbl">中</span>
          <input type="range" id="spd" min="1" max="30" value="10">
        </div>
        <div class="stat">第 <b id="gen">0</b> 代 · 存活 <b id="alive">0</b></div>
      </div>
      <div class="btns">
        <button class="btn-primary" id="playBtn">▶ 播放</button>
        <button class="btn-ghost" id="stepBtn">⏭ 单步</button>
        <button class="btn-ghost" id="randomBtn">🎲 随机</button>
        <button class="btn-ghost" id="clearBtn">🗑 清空</button>
        <button class="btn-ghost" id="seedBtn">✨ 滑翔机</button>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 棋盘</h2>
      <canvas id="cv" height="420"></canvas>
      <div class="note">规则：周围 3 个邻居则诞生，2–3 个邻居则存活，否则死亡。点击可手动绘制初始图案。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
      var COLS=60, ROWS=40, cell=0, grid=[], gen=0, playing=false, timer=null, spd=10;
      var spdLbl=document.getElementById("spdLbl"), genEl=document.getElementById("gen"), aliveEl=document.getElementById("alive");

      function resize(){
        cv.width=cv.clientWidth;
        cell=Math.floor(Math.min(cv.width/COLS, 420/ROWS));
        var w=cell*COLS, h=cell*ROWS;
        cv.width=w; cv.height=h;
        draw();
      }
      function init(){ grid=[]; for(var r=0;r<ROWS;r++){var row=[];for(var c=0;c<COLS;c++)row.push(0);grid.push(row);} }

      function draw(){
        var bg=getCss("--bg")||"#fff", fg=getCss("--primary")||"#3498db";
        ctx.fillStyle=bg; ctx.fillRect(0,0,cv.width,cv.height);
        var alive=0;
        for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
          if(grid[r][c]){ ctx.fillStyle=fg; ctx.fillRect(c*cell+1,r*cell+1,cell-2,cell-2); alive++; }
        }
        ctx.strokeStyle=getCss("--border")||"#ddd"; ctx.lineWidth=1;
        for(var r=0;r<=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*cell); ctx.lineTo(cv.width,r*cell); ctx.stroke(); }
        for(var c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(c*cell,0); ctx.lineTo(c*cell,cv.height); ctx.stroke(); }
        genEl.textContent=gen; aliveEl.textContent=alive;
      }

      function step(){
        var ng=[];
        for(var r=0;r<ROWS;r++){ var row=[]; for(var c=0;c<COLS;c++){
          var n=0;
          for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
            if(dr===0&&dc===0)continue;
            var rr=r+dr, cc=c+dc;
            if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]) n++;
          }
          row.push((grid[r][c]?(n===2||n===3):(n===3))?1:0);
        } ng.push(row); }
        grid=ng; gen++; draw();
      }

      function loop(){ if(playing){ step(); } }
      function startTimer(){ if(timer)clearInterval(timer); timer=setInterval(loop, 1000/spd); }

      function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

      // 交互：点击切换
      cv.addEventListener("click", function(e){
        var rect=cv.getBoundingClientRect();
        var c=Math.floor((e.clientX-rect.left)/cell), r=Math.floor((e.clientY-rect.top)/cell);
        if(r>=0&&r<ROWS&&c>=0&&c<COLS){ grid[r][c]^=1; draw(); }
      });

      document.getElementById("playBtn").addEventListener("click", function(){
        playing=!playing; this.textContent=playing?"⏸ 暂停":"▶ 播放";
        if(playing) startTimer(); else if(timer){clearInterval(timer);}
      });
      document.getElementById("stepBtn").addEventListener("click", function(){ if(!playing) step(); });
      document.getElementById("clearBtn").addEventListener("click", function(){ init(); gen=0; draw(); });
      document.getElementById("randomBtn").addEventListener("click", function(){
        init(); for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++) grid[r][c]=Math.random()<0.28?1:0; gen=0; draw();
      });
      document.getElementById("seedBtn").addEventListener("click", function(){
        init();
        // 滑翔机图案（4 行结构）
        var pat=[[0,1,0],[0,0,1],[1,1,1]];
        var br=2,bc=2;
        for(var r=0;r<3;r++)for(var c=0;c<3;c++) grid[br+r][bc+c]=pat[r][c]?1:0;
        gen=0; draw();
      });
      document.getElementById("spd").addEventListener("input", function(){
        spd=parseInt(this.value,10);
        spdLbl.textContent = spd<8?"慢":(spd<20?"中":"快");
        if(playing) startTimer();
      });

      init(); resize();
      window.addEventListener("resize", resize);
    })();
  </script>

  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
