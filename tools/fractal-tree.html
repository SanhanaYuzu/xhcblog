<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分形树 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:860px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    canvas{display:block;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;}
    .ctrl-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    .field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);}
    .field select,.field input[type=range]{accent-color:var(--primary);}
    .field select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font-family:inherit;}
    .field .val{color:var(--primary);font-weight:700;min-width:42px;text-align:right;}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🌳</span>
      <div>
        <h1>分形树</h1>
        <p class="tool-sub">递归自相似的树枝结构，调节角度与层数探索数学之美</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 参数</h2>
      <div class="ctrl-row">
        <div class="field">分支角度
          <input type="range" id="angle" min="5" max="60" value="25" step="1">
          <span class="val" id="angleV">25°</span>
        </div>
        <div class="field">递归层数
          <input type="range" id="depth" min="3" max="13" value="10" step="1">
          <span class="val" id="depthV">10</span>
        </div>
        <div class="field">长度比例
          <input type="range" id="ratio" min="0.55" max="0.82" value="0.72" step="0.01">
          <span class="val" id="ratioV">0.72</span>
        </div>
        <div class="field">摇摆
          <select id="sway">
            <option value="0">关闭</option>
            <option value="1" selected>随风摆动</option>
          </select>
        </div>
      </div>
      <div class="btns">
        <button class="btn-primary" id="redrawBtn">🎲 随机形态</button>
        <button class="btn-ghost" id="saveBtn">💾 保存图片</button>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 预览</h2>
      <canvas id="cv" height="460"></canvas>
      <div class="note">从底部主干向两侧递归分枝，每深一层枝更短更细；开启「随风摆动」后枝条角度随时间轻微晃动，呈现生长动感。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
      var angleEl=document.getElementById("angle"), depthEl=document.getElementById("depth"),
          ratioEl=document.getElementById("ratio"), swayEl=document.getElementById("sway");
      var angleV=document.getElementById("angleV"), depthV=document.getElementById("depthV"), ratioV=document.getElementById("ratioV");
      var redrawBtn=document.getElementById("redrawBtn"), saveBtn=document.getElementById("saveBtn");
      var seed=Math.random()*1000, t=0, raf=null;

      function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||null;}

      function resize(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=460*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); draw(); }
      window.addEventListener("resize", resize);

      function branch(len, ang, depth){
        if(depth<=0 || len<2) return;
        var fg=getCss("--text")||"#222";
        var col=getCss("--primary")||"#6c5ce7";
        ctx.strokeStyle = depth>2 ? col : "#7aa86c";
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = Math.max(0.6, depth*0.55);
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(0,-len); ctx.stroke();
        ctx.translate(0,-len);
        ctx.save(); ctx.rotate(ang); branch(len*ratio, ang, depth-1); ctx.restore();
        ctx.save(); ctx.rotate(-ang); branch(len*ratio, ang, depth-1); ctx.restore();
        ctx.globalAlpha=1;
      }

      function draw(){
        var W=cv.clientWidth, H=460;
        ctx.fillStyle=getCss("--bg")||"#fff"; ctx.fillRect(0,0,W,H);
        var baseAng = (+angleEl.value)*Math.PI/180;
        if(swayEl.value==="1"){ baseAng += Math.sin(t*0.6+seed)*0.12; }
        ctx.save();
        ctx.translate(W/2, H-10);
        branch(Math.min(120, H*0.28), baseAng, +depthEl.value);
        ctx.restore();
      }

      function loop(){ t+=0.03; draw(); raf=requestAnimationFrame(loop); }

      angleEl.oninput=function(){ angleV.textContent=this.value+"°"; if(swayEl.value==="0") draw(); };
      depthEl.oninput=function(){ depthV.textContent=this.value; if(swayEl.value==="0") draw(); };
      ratioEl.oninput=function(){ ratioV.textContent=(+this.value).toFixed(2); if(swayEl.value==="0") draw(); };
      swayEl.onchange=function(){
        if(this.value==="1"){ if(!raf) loop(); }
        else { if(raf) cancelAnimationFrame(raf); raf=null; draw(); }
      };
      redrawBtn.onclick=function(){ seed=Math.random()*1000; if(swayEl.value==="0") draw(); };
      saveBtn.onclick=function(){
        var a=document.createElement("a");
        a.download="fractal-tree.png"; a.href=cv.toDataURL("image/png"); a.click();
        toast("已保存图片");
      };

      document.getElementById("year").textContent=new Date().getFullYear();
      resize();
      if(swayEl.value==="1") loop();
    })();
  </script>

  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
