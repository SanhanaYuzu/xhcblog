<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年龄计算 - XHC 博客</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
/* 所有样式统一加 .tool-page 前缀，避免与全局 style.css 冲突 */
.tool-page{max-width:960px;margin:0 auto;}
.tool-page .grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}
.tool-page .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px;}

.tool-page .fld{margin-bottom:14px;}
.tool-page .fld label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.tool-page .fld input{width:100%;padding:11px 13px;font-size:15px;font-weight:600;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;}
.tool-page .fld input:focus{border-color:var(--primary);}
.tool-page .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.tool-page .chip{border:1px solid var(--border);background:var(--bg);color:var(--text-2);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
.tool-page .chip:hover{border-color:var(--primary);color:var(--primary);}
.tool-page .btn{width:100%;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;margin-top:6px;}
.tool-page .btn:hover{background:var(--primary-dark);}
.tool-page .err{font-size:12.5px;color:#ef4444;margin-top:8px;min-height:16px;}

.tool-page .big-age{text-align:center;padding:4px 0 16px;border-bottom:1px dashed var(--border);}
.tool-page .big-age .line{display:flex;justify-content:center;align-items:baseline;gap:4px;flex-wrap:wrap;}
.tool-page .big-age b{font-size:46px;font-weight:800;color:var(--primary);line-height:1.1;font-variant-numeric:tabular-nums;}
.tool-page .big-age s{text-decoration:none;font-size:15px;color:var(--text-2);font-weight:600;margin-right:6px;}
.tool-page .big-age .sub2{font-size:12.5px;color:var(--text-3);margin-top:8px;}

.tool-page .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.tool-page .card2{border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:12px 10px;text-align:center;}
.tool-page .card2 .k{font-size:11.5px;color:var(--text-3);}
.tool-page .card2 .v{font-size:16px;font-weight:700;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all;}

.tool-page .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.tool-page .box{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg);}
.tool-page .box .h{font-size:12px;color:var(--text-3);margin-bottom:6px;}
.tool-page .box .m{font-size:22px;font-weight:800;color:var(--text);}
.tool-page .box .m em{font-style:normal;font-size:28px;color:var(--primary);}
.tool-page .box .d{font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.7;}

.tool-page .zs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.tool-page .zs .item{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg);display:flex;align-items:center;gap:12px;}
.tool-page .zs .ico{font-size:34px;line-height:1;}
.tool-page .zs .k{font-size:11.5px;color:var(--text-3);}
.tool-page .zs .v{font-size:18px;font-weight:800;color:var(--text);margin-top:2px;}
.tool-page .zs .x{font-size:11.5px;color:var(--text-3);margin-top:3px;}
.tool-page .note{font-size:11.5px;color:var(--text-3);margin-top:14px;line-height:1.7;}

@media(max-width:680px){
  .tool-page .grid{grid-template-columns:1fr;}
  .tool-page .panel{padding:16px;}
  .tool-page .cards{grid-template-columns:1fr;}
  .tool-page .two,.tool-page .zs{grid-template-columns:1fr;}
  .tool-page .big-age b{font-size:36px;}
}

/* 深色模式适配 */
body.dark .tool-page .panel{box-shadow:none;}
body.dark .tool-page .fld input,
body.dark .tool-page .chip,
body.dark .tool-page .card2,
body.dark .tool-page .box,
body.dark .tool-page .zs .item{background:#12151b;color:var(--text);}
body.dark .tool-page .fld input{color:var(--text);}
body.dark .tool-page .card2 .v,
body.dark .tool-page .box .m,
body.dark .tool-page .zs .v{color:var(--text);}
</style>
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="loader-content"><img src="../assets/images/loading-logo.png" alt="" class="loader-logo"><div class="loader-bar"><div class="loader-bar-inner"></div></div></div></div>
<header class="header"><div class="container">
<a class="brand" href="../index.html"><img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo"><span class="brand-name">XHC<b>博客</b></span></a>
<nav class="nav" id="navCats"></nav>
<div class="search"><input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off"><button id="searchBtn" title="搜索">🔍</button></div>
<a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
<span id="accountSlot"></span>
</div></header>
<main class="container" style="padding:28px 0 40px;">
<a class="back-link" href="../tools.html" style="display:inline-block;margin-bottom:16px;color:var(--primary);text-decoration:none;">← 返回工具箱</a>
<section class="tool-page">
  <h1 style="font-size:24px;margin-bottom:6px;">🎂 年龄计算</h1>
  <p class="sub" style="color:var(--text-3);margin-bottom:20px;">输入出生日期，精确到岁月日，并算出总天数、下次生日倒计时、生肖与星座。</p>

  <div class="grid">
    <div class="panel">
      <div class="fld">
        <label for="birth">出生日期</label>
        <input type="date" id="birth">
      </div>
      <div class="fld">
        <label for="btime">出生时间（可选）</label>
        <input type="time" id="btime" value="00:00">
      </div>
      <div class="quick">
        <button class="chip" data-y="1990">1990</button>
        <button class="chip" data-y="1995">1995</button>
        <button class="chip" data-y="2000">2000</button>
        <button class="chip" data-y="2005">2005</button>
        <button class="chip" data-y="2010">2010</button>
      </div>
      <button class="btn" id="calcBtn">计算年龄</button>
      <div class="err" id="err"></div>
    </div>

    <div class="panel">
      <div class="big-age">
        <div class="line">
          <b id="aY">—</b><s>岁</s><b id="aM">—</b><s>个月</s><b id="aD">—</b><s>天</s>
        </div>
        <div class="sub2" id="bornInfo">请选择出生日期</div>
      </div>

      <div class="cards">
        <div class="card2"><div class="k">总共活了</div><div class="v" id="tDays">—</div></div>
        <div class="card2"><div class="k">总小时数</div><div class="v" id="tHours">—</div></div>
        <div class="card2"><div class="k">总分钟数</div><div class="v" id="tMins">—</div></div>
      </div>

      <div class="two">
        <div class="box">
          <div class="h">距离下一个生日</div>
          <div class="m"><em id="nextDays">—</em> 天</div>
          <div class="d" id="nextInfo">—</div>
        </div>
        <div class="box">
          <div class="h">已经度过</div>
          <div class="m"><em id="tWeeks">—</em> 周</div>
          <div class="d" id="secInfo">—</div>
        </div>
      </div>

      <div class="zs">
        <div class="item">
          <div class="ico" id="zIco">🐾</div>
          <div>
            <div class="k">生肖</div>
            <div class="v" id="zName">—</div>
            <div class="x" id="zYear">按公历年份推算</div>
          </div>
        </div>
        <div class="item">
          <div class="ico" id="xIco">✨</div>
          <div>
            <div class="k">星座</div>
            <div class="v" id="xName">—</div>
            <div class="x" id="xRange">—</div>
          </div>
        </div>
      </div>

      <p class="note">说明：生肖按公历年份换算，若出生在农历新年之前（1 月至 2 月中旬），实际生肖应以农历年为准；星座按公历出生月日判定。</p>
    </div>
  </div>
</section>
</main>
<footer class="footer"><div class="container"><p>&copy; <span id="year"></span> XHC 博客 · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p></div></footer>
<div class="watermark"><img src="../assets/images/xhcntgroup.png" alt=""></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var birth = $("birth"), btime = $("btime"), errBox = $("err");
  var aY = $("aY"), aM = $("aM"), aD = $("aD"), bornInfo = $("bornInfo");
  var tDays = $("tDays"), tHours = $("tHours"), tMins = $("tMins"), tWeeks = $("tWeeks");
  var nextDays = $("nextDays"), nextInfo = $("nextInfo"), secInfo = $("secInfo");
  var zIco = $("zIco"), zName = $("zName"), zYear = $("zYear");
  var xIco = $("xIco"), xName = $("xName"), xRange = $("xRange");

  var WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  var ZODIAC = [
    { n: "鼠", e: "🐭" }, { n: "牛", e: "🐮" }, { n: "虎", e: "🐯" }, { n: "兔", e: "🐰" },
    { n: "龙", e: "🐲" }, { n: "蛇", e: "🐍" }, { n: "马", e: "🐴" }, { n: "羊", e: "🐑" },
    { n: "猴", e: "🐵" }, { n: "鸡", e: "🐔" }, { n: "狗", e: "🐶" }, { n: "猪", e: "🐷" }
  ];
  var SIGN_EDGE = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
  var SIGNS = [
    { n: "摩羯座", e: "♑", r: "12.22 - 1.19" },
    { n: "水瓶座", e: "♒", r: "1.20 - 2.18" },
    { n: "双鱼座", e: "♓", r: "2.19 - 3.20" },
    { n: "白羊座", e: "♈", r: "3.21 - 4.19" },
    { n: "金牛座", e: "♉", r: "4.20 - 5.20" },
    { n: "双子座", e: "♊", r: "5.21 - 6.21" },
    { n: "巨蟹座", e: "♋", r: "6.22 - 7.22" },
    { n: "狮子座", e: "♌", r: "7.23 - 8.22" },
    { n: "处女座", e: "♍", r: "8.23 - 9.22" },
    { n: "天秤座", e: "♎", r: "9.23 - 10.23" },
    { n: "天蝎座", e: "♏", r: "10.24 - 11.22" },
    { n: "射手座", e: "♐", r: "11.23 - 12.21" },
    { n: "摩羯座", e: "♑", r: "12.22 - 1.19" }
  ];

  var timer = null;

  function comma(n) {
    var s = String(n), out = "", c = 0;
    for (var i = s.length - 1; i >= 0; i--) {
      out = s.charAt(i) + out;
      c++;
      if (c % 3 === 0 && i > 0) out = "," + out;
    }
    return out;
  }

  function zodiacOf(y) {
    var i = ((y - 4) % 12 + 12) % 12;
    return ZODIAC[i];
  }

  function signOf(m, d) {
    var idx = d < SIGN_EDGE[m - 1] ? m - 1 : m;
    return SIGNS[idx];
  }

  function run() {
    var v = birth.value;
    if (!v) {
      errBox.textContent = "请选择出生日期";
      return;
    }
    var parts = v.split("-");
    var by = parseInt(parts[0], 10), bm = parseInt(parts[1], 10), bd = parseInt(parts[2], 10);
    var hh = 0, mm = 0;
    if (btime.value) {
      var tp = btime.value.split(":");
      hh = parseInt(tp[0], 10) || 0;
      mm = parseInt(tp[1], 10) || 0;
    }
    var b = new Date(by, bm - 1, bd, hh, mm, 0, 0);
    var now = new Date();
    if (isNaN(b.getTime())) { errBox.textContent = "日期无效"; return; }
    if (b.getTime() > now.getTime()) { errBox.textContent = "出生日期不能晚于现在"; return; }
    errBox.textContent = "";

    var y = now.getFullYear() - b.getFullYear();
    var mo = now.getMonth() - b.getMonth();
    var d = now.getDate() - b.getDate();
    if (now.getHours() < hh || (now.getHours() === hh && now.getMinutes() < mm)) d -= 1;
    if (d < 0) {
      mo -= 1;
      d += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (mo < 0) { y -= 1; mo += 12; }
    if (y < 0) { y = 0; mo = 0; d = 0; }

    aY.textContent = y;
    aM.textContent = mo;
    aD.textContent = d;

    var ms = now.getTime() - b.getTime();
    var secs = Math.floor(ms / 1000);
    var days = Math.floor(secs / 86400);
    var hours = Math.floor(secs / 3600);
    var mins = Math.floor(secs / 60);

    tDays.textContent = comma(days) + " 天";
    tHours.textContent = comma(hours) + " 小时";
    tMins.textContent = comma(mins) + " 分钟";
    tWeeks.textContent = comma(Math.floor(days / 7));
    secInfo.textContent = "约 " + comma(secs) + " 秒 · 相当于 " + (days / 365.2425).toFixed(2) + " 个回归年";

    var todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var nb = new Date(now.getFullYear(), bm - 1, bd);
    if (nb.getTime() < todayZero.getTime()) nb = new Date(now.getFullYear() + 1, bm - 1, bd);
    var left = Math.round((nb.getTime() - todayZero.getTime()) / 86400000);
    nextDays.textContent = left;
    var nbAge = nb.getFullYear() - by;
    if (left === 0) {
      nextInfo.textContent = "🎉 今天就是你的生日！生日快乐（" + nbAge + " 岁）";
    } else {
      nextInfo.textContent = nb.getFullYear() + " 年 " + (nb.getMonth() + 1) + " 月 " + nb.getDate() +
        " 日 · " + WEEK[nb.getDay()] + " · 将满 " + nbAge + " 岁";
    }

    bornInfo.textContent = "出生于 " + by + " 年 " + bm + " 月 " + bd + " 日 · " + WEEK[b.getDay()] +
      (btime.value ? " " + btime.value : "");

    var z = zodiacOf(by);
    zIco.textContent = z.e;
    zName.textContent = "属" + z.n;
    zYear.textContent = by + " 年 · " + z.n + "年";

    var s = signOf(bm, bd);
    xIco.textContent = s.e;
    xName.textContent = s.n;
    xRange.textContent = s.r;
  }

  function start() {
    run();
    clearInterval(timer);
    if (birth.value && !errBox.textContent) {
      timer = setInterval(run, 1000);
    }
  }

  birth.addEventListener("change", start);
  btime.addEventListener("change", start);
  $("calcBtn").addEventListener("click", start);

  var chips = document.querySelectorAll(".tool-page .chip");
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener("click", function () {
      var y = this.getAttribute("data-y");
      birth.value = y + "-01-01";
      start();
    });
  }

  var t = new Date();
  var pad = function (n) { return n < 10 ? "0" + n : String(n); };
  birth.max = t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
  birth.value = (t.getFullYear() - 25) + "-06-15";
  start();
})();
</script>
</body>
</html>
