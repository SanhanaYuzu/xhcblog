<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老虎机 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .sm-reels{display:flex;gap:12px;justify-content:center;margin:14px 0;}
    .sm-reel{width:80px;height:90px;font-size:54px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--border);border-radius:12px;}
    .sm-reel.spin{animation:smshake .12s linear infinite;}
    @keyframes smshake{0%{transform:translateY(-8px);}50%{transform:translateY(8px);}100%{transform:translateY(-8px);}}
    .sm-msg{text-align:center;font-size:18px;font-weight:700;margin:10px 0;color:var(--primary);}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🎰</span>
      <h1>老虎机</h1>
    </div>
    <p class="tool-sub">三转轮老虎机，押注旋转，三连或两连可赢积分。</p>

    <div class="panel">
      <div class="sm-reels" id="smReels"></div>
      <div class="sm-msg" id="smMsg">积分：<b id="smCredit">100</b></div>
      <div class="row" style="justify-content:center;">
        <button class="btn primary" id="smSpin">🎰 旋转（-10）</button>
        <button class="btn" id="smReset">重置积分</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHC 博客 · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var SYMS=['🍒','🍋','🍉','⭐','7️⃣','💎'];
      var credit=100,spinning=false;
      var reels=document.getElementById('smReels'),msg=document.getElementById('smMsg'),creditEl=document.getElementById('smCredit');
      function render(arr){reels.innerHTML='';for(var i=0;i<3;i++){var d=document.createElement('div');d.className='sm-reel';d.textContent=arr?arr[i]:SYMS[Math.floor(Math.random()*SYMS.length)];reels.appendChild(d);}}
      render();
      document.getElementById('smSpin').onclick=function(){
        if(spinning||credit<10)return;
        credit-=10;creditEl.textContent=credit;spinning=true;
        var els=reels.children;
        for(var i=0;i<3;i++)els[i].classList.add('spin');
        var ticks=0,res=[0,0,0];
        var t=setInterval(function(){
          ticks++;
          for(var i=0;i<3;i++){if(ticks>8+i*5)continue;els[i].textContent=SYMS[Math.floor(Math.random()*SYMS.length)];}
          if(ticks>18){
            clearInterval(t);spinning=false;
            for(var i=0;i<3;i++){res[i]=Math.floor(Math.random()*SYMS.length);els[i].textContent=SYMS[res[i]];els[i].classList.remove('spin');}
            if(res[0]===res[1]&&res[1]===res[2]){var win=res[0]===4||res[0]===5?100:50;credit+=win;msg.textContent='🎉 三连！+'+win+' 积分';}
            else if(res[0]===res[1]||res[1]===res[2]||res[0]===res[2]){credit+=20;msg.textContent='两连！+20 积分';}
            else msg.textContent='没中，再试一次';
            creditEl.textContent=credit;
            if(credit<10)msg.textContent+='（积分不足，点重置）';
          }
        },70);
      };
      document.getElementById('smReset').onclick=function(){credit=100;creditEl.textContent=credit;msg.textContent='积分已重置';render();};
    })();
  </script>
</body>
</html>
