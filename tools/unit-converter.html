<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单位换算 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .uc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:520px){.uc-grid{grid-template-columns:1fr;}}
    .uc-out{margin-top:14px;text-align:center;font-size:16px;}
    .uc-out b{font-size:26px;color:var(--primary);}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">📏</span>
      <h1>单位换算</h1>
    </div>
    <p class="tool-sub">长度、质量、温度、面积、体积、速度、时间、数据量等常用单位换算。</p>

    <div class="panel">
      <div class="row">
        <label>类别</label>
        <select id="ucCat"></select>
      </div>
      <div class="uc-grid">
        <div><label style="font-size:13px;color:var(--text-3);">从</label><select id="ucFrom" style="width:100%;"></select></div>
        <div><label style="font-size:13px;color:var(--text-3);">到</label><select id="ucTo" style="width:100%;"></select></div>
      </div>
      <div class="row" style="margin-top:12px;"><label>数值</label><input id="ucVal" type="number" value="1" style="width:140px;"></div>
      <div class="uc-out" id="ucOut"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHC 博客 · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var CATS={
        '长度':{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.34,yd:0.9144,ft:0.3048,in:0.0254},
        '质量':{kg:1,g:0.001,t:1000,lb:0.453592,oz:0.0283495},
        '面积':{m2:1,km2:1e6,cm2:0.0001,ha:10000,acre:4046.86,ft2:0.092903},
        '体积':{L:1,mL:0.001,m3:1000,gal:3.78541,ft3:28.3168},
        '速度':{mps:1,kph:0.277778,mph:0.44704,knot:0.514444},
        '时间':{s:1,min:60,h:3600,day:86400},
        '数据量':{B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776}
      };
      var cat=document.getElementById('ucCat'),from=document.getElementById('ucFrom'),to=document.getElementById('ucTo'),val=document.getElementById('ucVal'),out=document.getElementById('ucOut');
      function fill(sel,units){sel.innerHTML='';for(var u in units){var o=document.createElement('option');o.value=u;o.textContent=u;sel.appendChild(o);}}
      function load(){var units=CATS[cat.value];var ks=Object.keys(units);fill(from,units);fill(to,units);if(ks.length>1)to.selectedIndex=1;calc();}
      function calc(){var units=CATS[cat.value];var v=parseFloat(val.value)||0;var base=v*units[from.value];var r=base/units[to.value];out.innerHTML=v+' '+from.value+' = <b>'+r+'</b> '+to.value;}
      cat.onchange=load;from.onchange=calc;to.onchange=calc;val.oninput=calc;
      for(var c in CATS){var o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o);}
      load();
    })();
  </script>
</body>
</html>
