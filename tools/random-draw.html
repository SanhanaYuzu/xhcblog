<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机抽签 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:680px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px;}

    .stage{height:170px;border-radius:14px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:var(--bg);overflow:hidden;position:relative;}
    .stage .name{font-size:40px;font-weight:800;color:var(--primary);padding:0 16px;text-align:center;word-break:break-all;line-height:1.3;transition:transform .05s;}
    .stage.rolling .name{color:var(--text-3);}
    .stage .placeholder{color:var(--text-3);font-size:16px;}

    .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .field{flex:1;min-width:160px;}
    .field label{display:block;font-size:13px;color:var(--text-2);font-weight:600;margin-bottom:6px;}
    .field textarea{width:100%;box-sizing:border-box;min-height:96px;resize:vertical;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:11px;font-size:14px;font-family:inherit;line-height:1.6;}
    .field textarea:focus{outline:none;border-color:var(--primary);}
    .field select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;width:100%;}

    .btn-primary{width:100%;border:none;background:var(--primary);color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-primary:disabled{opacity:.55;cursor:not-allowed;}

    .opt-row{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 14px;}
    .opt{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-2);cursor:pointer;user-select:none;}
    .opt input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}

    .result-panel{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:54px;}
    .result-panel h3{font-size:14px;margin:0 0 10px;color:var(--text-2);}
    .tag{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:6px 12px;margin:4px;font-weight:600;font-size:14px;}
    .tag button{border:none;background:none;color:var(--primary);cursor:pointer;font-size:14px;padding:0;line-height:1;}
    .empty-hint{color:var(--text-3);font-size:13px;}

    .tip-toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:9999;}
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🎯</span>
      <h1>随机抽签</h1>
    </div>
    <p class="tool-sub">输入名单，随机抽取一人或多人，可设置不重复抽取，适合点名、抽奖、分组等场景。</p>

    <div class="panel">
      <div class="stage" id="stage"><span class="placeholder">点击下方按钮开始抽签</span></div>

      <div class="row">
        <div class="field" style="flex:2;">
          <label>名单（每行一个，或用逗号 / 空格分隔）</label>
          <textarea id="names" placeholder="张三&#10;李四&#10;王五&#10;赵六"></textarea>
        </div>
        <div class="field" style="flex:1;">
          <label>抽取数量</label>
          <input type="number" id="pickN" value="1" min="1" max="50">
          <label style="margin-top:12px;">抽取模式</label>
          <select id="mode">
            <option value="once">单次抽取</option>
            <option value="repeat">可重复抽取</option>
          </select>
        </div>
      </div>
      <div class="opt-row">
        <label class="opt"><input type="checkbox" id="remove"> 抽中后从名单移除（不重复）</label>
      </div>

      <button class="btn-primary" id="drawBtn">🎲 开始抽签</button>
    </div>

    <div class="panel">
      <div class="result-panel" id="resultPanel">
        <h3>抽签结果</h3>
        <div class="empty-hint" id="emptyHint">还没有抽取结果</div>
        <div id="tags"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var stage = document.getElementById("stage");
      var drawBtn = document.getElementById("drawBtn");
      var namesEl = document.getElementById("names");
      var pickNEl = document.getElementById("pickN");
      var modeEl = document.getElementById("mode");
      var removeEl = document.getElementById("remove");
      var tags = document.getElementById("tags");
      var emptyHint = document.getElementById("emptyHint");
      var toastEl = document.getElementById("tipToast");

      function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove("show");},1700);}

      function getList(){
        return namesEl.value.split(/[\n,，、\s]+/).map(function(s){return s.trim();}).filter(function(s){return s.length;});
      }
      function getNameNode(){return stage.querySelector(".name");}

      function draw(){
        var pool = getList();
        if(!pool.length){toast("请先输入名单");return;}
        var n = parseInt(pickNEl.value,10); if(isNaN(n)||n<1) n=1;
        if(n>pool.length && modeEl.value==="once"){toast("抽取数量超过名单人数，已调整为 "+pool.length);n=pool.length;}
        if(n>50) n=50;

        var rolling = true;
        stage.classList.add("rolling");
        drawBtn.disabled = true;
        var ri = setInterval(function(){
          var r = pool[Math.floor(Math.random()*pool.length)];
          var node = getNameNode();
          if(!node){node=document.createElement("div");node.className="name";stage.innerHTML="";stage.appendChild(node);}
          node.textContent = r;
        }, 60);

        var stopAfter = 900 + n*120;
        setTimeout(function(){
          clearInterval(ri);
          rolling = false;
          stage.classList.remove("rolling");
          drawBtn.disabled = false;

          var picked = [];
          if(modeEl.value==="once" && removeEl.checked){
            // 不重复：打乱取前 n 个并从名单移除
            var shuffled = pool.slice();
            for(var i=shuffled.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=t;}
            picked = shuffled.slice(0,n);
            var remain = pool.filter(function(x){return picked.indexOf(x)===-1;});
            namesEl.value = remain.join("\n");
          }else if(modeEl.value==="once"){
            var idxs={}; var guard=0;
            while(picked.length<n && guard<1000){
              var k=Math.floor(Math.random()*pool.length);
              if(!(k in idxs)){idxs[k]=1;picked.push(pool[k]);}
              guard++;
            }
          }else{
            for(var m=0;m<n;m++) picked.push(pool[Math.floor(Math.random()*pool.length)]);
          }

          var node = getNameNode();
          node.textContent = picked.join("、");
          node.style.transform="scale(1.08)";
          setTimeout(function(){node.style.transform="";},160);

          addTags(picked);
          toast("已抽出 "+picked.length+" 个");
        }, stopAfter);
      }

      function addTags(arr){
        emptyHint.style.display="none";
        arr.forEach(function(name){
          var tag=document.createElement("span");
          tag.className="tag";
          tag.innerHTML = name+' <button title="移除">✕</button>';
          tag.querySelector("button").addEventListener("click",function(){tag.remove();if(!tags.children.length)emptyHint.style.display="block";});
          tags.appendChild(tag);
        });
      }

      drawBtn.addEventListener("click", draw);
    })();
  </script>

  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
