<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数独 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .sd-grid{display:grid;grid-template-columns:repeat(9,34px);gap:2px;justify-content:center;margin:10px auto;}
    .sd-cell{width:34px;height:34px;text-align:center;font-size:18px;font-weight:600;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    .sd-cell.fixed{background:var(--card);color:var(--primary);font-weight:800;}
    .sd-cell.bad{background:#fde2e2;color:#c0392b;}
    .sd-cell:nth-child(3n){margin-right:3px;}
    .sd-grid .sd-cell:nth-child(n+19):nth-child(-n+27),.sd-grid .sd-cell:nth-child(n+46):nth-child(-n+54){margin-bottom:3px;}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🔢</span>
      <h1>数独</h1>
    </div>
    <p class="tool-sub">在空格中填入 1–9，每行每列每宫不重复。填入后点检查。</p>

    <div class="panel">
      <div class="sd-grid" id="sdGrid"></div>
      <div class="res" id="sdMsg">提示：灰色为已知数，不可改。</div>
      <div class="row" style="justify-content:center;">
        <button class="btn primary" id="sdCheck">检查</button>
        <button class="btn" id="sdNew">换一题</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHCDNS · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var PUZZLES=[
        '530070000600195000098000060800060003400803001700020006060000280000419005000080079',
        '000260701680070090190004500820100040004602900050003028009300074040050036703018000'
      ];
      var SOL=['534678912672195348198342567859761423426853791713924856961537284287419635345286179','000260701680070090190004500820100040004602900050003028009300074040050036703018000'];
      var grid=[],fixed=[],sol=[],idx=0;
      var g=document.getElementById('sdGrid'),msg=document.getElementById('sdMsg');
      function load(){
        var p=PUZZLES[idx%PUZZLES.length];idx++;
        grid=[];fixed=[];sol=[];
        for(var i=0;i<81;i++){var ch=p[i];grid.push(ch==='0'?0:parseInt(ch,10));fixed.push(ch!=='0');}
        sol=grid.slice();
        g.innerHTML='';
        for(var i=0;i<81;i++){
          var c=document.createElement('input');
          c.className='sd-cell'+(fixed[i]?' fixed':'');
          c.maxLength=1;
          if(fixed[i]){c.value=grid[i];c.readOnly=true;}
          (function(i){c.oninput=function(){var v=c.value.replace(/[^1-9]/g,'');c.value=v;grid[i]=v?parseInt(v,10):0;c.classList.remove('bad');};})(i);
          g.appendChild(c);
        }
        msg.textContent='提示：灰色为已知数，不可改。';
      }
      document.getElementById('sdCheck').onclick=function(){
        var ok=true,full=true;
        var cells=g.children;
        for(var i=0;i<81;i++){
          cells[i].classList.remove('bad');
          if(!grid[i]){full=false;continue;}
          // 校验行/列/宫
          var r=Math.floor(i/9),col=i%9,br=Math.floor(r/3)*3,bc=Math.floor(col/3)*3,bad=false;
          for(var k=0;k<9;k++){if(k!==col&&grid[r*9+k]===grid[i])bad=true;if(k!==r&&grid[k*9+col]===grid[i])bad=true;}
          for(var dr=0;dr<3;dr++)for(var dc=0;dc<3;dc++){var j=(br+dr)*9+(bc+dc);if(j!==i&&grid[j]===grid[i])bad=true;}
          if(bad){cells[i].classList.add('bad');ok=false;}
        }
        if(!full){msg.textContent='还有空格没填哦';}
        else if(ok){msg.textContent='🎉 当前填写无冲突，全部正确！';}
        else{msg.textContent='有红色格子冲突，检查一下';}
      };
      document.getElementById('sdNew').onclick=load;
      load();
    })();
  </script>
</body>
</html>
