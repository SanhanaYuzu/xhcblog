<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正则片段库 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .rx-item{padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;}
    .rx-item:hover{border-color:var(--primary);}
    .rx-name{font-weight:700;color:var(--text);}
    .rx-pat{font-family:monospace;font-size:13px;color:var(--primary);}
    .rx-out{margin-top:10px;line-height:1.8;font-size:15px;}
    .rx-out mark{background:#fff3a0;padding:0 2px;border-radius:3px;}
    .rx-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:560px){.rx-cols{grid-template-columns:1fr;}}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">📚</span>
      <h1>正则片段库</h1>
    </div>
    <p class="tool-sub">常用正则表达式集合，一键加载并实时测试匹配效果。</p>

    <div class="panel">
      <div class="rx-cols">
        <div>
          <div style="font-weight:600;margin-bottom:8px;color:var(--text-2);">常用正则（点击加载）</div>
          <div id="rxList"></div>
        </div>
        <div>
          <label style="font-weight:600;color:var(--text-2);">测试文本</label>
          <textarea id="rxText" rows="4" style="margin-top:6px;"></textarea>
          <div class="rx-out" id="rxOut"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHCDNS · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var LIB=[
        ['邮箱','[\w.+-]+@[\w-]+\.[\w.-]+','test@example.com'],
        ['手机号(中国)','1[3-9]\d{9}','我的号码13812345678'],
        ['URL','https?:\/\/[\w.-]+(?:\/[\w./?%&=-]*)?','访问 https://xhc.dpdns.org 吧'],
        ['IPv4','\b(?:\d{1,3}\.){3}\d{1,3}\b','服务器 192.168.1.1 正常'],
        ['日期 YYYY-MM-DD','\d{4}-\d{2}-\d{2}','今天 2026-08-13'],
        ['中文字符','[\u4e00-\u9fa5]+','Hello 世界'],
        ['十六进制色值','#(?:[0-9a-fA-F]{3}){1,2}','颜色 #ff8800 好看'],
        ['整数','-?\d+','温度 -5 度']
      ];
      var list=document.getElementById('rxList'),text=document.getElementById('rxText'),out=document.getElementById('rxOut');
      function render(){list.innerHTML='';for(var i=0;i<LIB.length;i++){(function(i){var d=document.createElement('div');d.className='rx-item';d.innerHTML='<div class="rx-name">'+LIB[i][0]+'</div><div class="rx-pat">'+LIB[i][1]+'</div>';d.onclick=function(){text.value=LIB[i][2];test(LIB[i][1]);};list.appendChild(d);})(i);}}
      function test(pat){try{var re=new RegExp(pat,'g');var s=text.value;var m;var html='';var last=0;while((m=re.exec(s))!==null){html+=esc(s.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length;if(m.index===re.lastIndex)re.lastIndex++;}html+=esc(s.slice(last));out.innerHTML=html||'(无匹配)';}catch(e){out.textContent='正则错误：'+e.message;}}
      function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
      text.oninput=function(){var pat=list.querySelector('.rx-pat');if(pat)test(pat.textContent);};
      render();
    })();
  </script>
</body>
</html>
