<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机密码生成器 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
    .panel h2{font-size:15px;margin:0 0 16px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:15px;background:var(--primary);border-radius:3px;display:inline-block;}

    /* 主密码展示 */
    .pw-main{
      display:flex;align-items:center;gap:12px;
      background:var(--bg);border:1px solid var(--border);border-radius:12px;
      padding:16px 18px;margin-bottom:14px;
    }
    .pw-main .txt{
      flex:1;font-family:"SFMono-Regular",Consolas,"Courier New",monospace;
      font-size:20px;font-weight:700;letter-spacing:.6px;color:var(--text);
      word-break:break-all;line-height:1.5;
    }
    .icon-btn{
      border:1px solid var(--border);background:var(--card);color:var(--text-2);
      border-radius:9px;padding:8px 12px;font-size:15px;cursor:pointer;transition:.15s;flex-shrink:0;
    }
    .icon-btn:hover{border-color:var(--primary);color:var(--primary);}

    /* 强度条 */
    .strength{margin-bottom:4px;}
    .st-bar{display:flex;gap:5px;margin-bottom:7px;}
    .st-bar i{flex:1;height:6px;border-radius:4px;background:var(--border);transition:background .25s;}
    .st-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-3);}
    .st-meta b{font-size:13px;}

    /* 配置项 */
    .field{margin-bottom:18px;}
    .field:last-child{margin-bottom:0;}
    .field > label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:9px;}
    .range-row{display:flex;align-items:center;gap:12px;}
    .range-row input[type="range"]{flex:1;accent-color:var(--primary);}
    .range-row .val{
      font-size:15px;font-weight:700;color:var(--primary);min-width:38px;text-align:right;
      font-variant-numeric:tabular-nums;
    }
    .len-quick{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
    .len-quick button{
      border:1px solid var(--border);background:var(--bg);color:var(--text-2);
      border-radius:18px;padding:4px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;
    }
    .len-quick button:hover{border-color:var(--primary);color:var(--primary);}

    .chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .chk{
      display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
      border:1px solid var(--border);border-radius:10px;padding:11px 13px;background:var(--bg);transition:.15s;
    }
    .chk:hover{border-color:var(--primary);}
    .chk input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;}
    .chk .n{font-size:13.5px;font-weight:600;color:var(--text);}
    .chk .s{
      font-size:11.5px;color:var(--text-3);margin-left:auto;
      font-family:"SFMono-Regular",Consolas,monospace;
    }
    .chk.on{border-color:var(--primary);background:var(--primary-soft);}

    .count-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .count-row select{
      padding:9px 12px;border:1px solid var(--border);border-radius:9px;
      background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;cursor:pointer;
    }
    .count-row select:focus{border-color:var(--primary);}

    .btn{
      border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;
      padding:11px 18px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
    }
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn.block{width:100%;}

    /* 批量列表 */
    .pw-list{display:flex;flex-direction:column;gap:9px;}
    .pw-item{
      display:flex;align-items:center;gap:10px;
      background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 13px;
    }
    .pw-item .idx{
      font-size:11.5px;color:var(--text-3);min-width:20px;flex-shrink:0;font-variant-numeric:tabular-nums;
    }
    .pw-item .txt{
      flex:1;font-family:"SFMono-Regular",Consolas,"Courier New",monospace;font-size:14px;
      color:var(--text);word-break:break-all;
    }
    .pw-item .copy{
      border:1px solid var(--border);background:var(--card);color:var(--text-2);
      border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;
      transition:.15s;flex-shrink:0;
    }
    .pw-item .copy:hover{border-color:var(--primary);color:var(--primary);}
    .pw-item .copy.done{border-color:var(--green);color:var(--green);}
    .list-empty{color:var(--text-3);font-size:13.5px;text-align:center;padding:10px 0;}

    .warn{
      font-size:12.5px;color:#e5484d;background:rgba(229,72,77,.08);
      border:1px solid rgba(229,72,77,.25);border-radius:9px;padding:9px 12px;margin-top:12px;display:none;
    }

    .tip-toast{
      position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);
      background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;
      opacity:0;pointer-events:none;transition:.22s;z-index:9999;
    }
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:640px){
      .panel{padding:18px 15px;}
      .chk-grid{grid-template-columns:1fr;}
      .pw-main .txt{font-size:16px;}
    }
  </style>
</head>
<body>

  <!-- 页面跳转加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🔑</span>
      <h1>随机密码生成器</h1>
    </div>
    <p class="tool-sub">基于浏览器密码学安全随机数（Crypto API）本地生成，不联网、不上传、不记录，关闭页面即消失。</p>

    <!-- 结果 -->
    <div class="panel">
      <div class="pw-main">
        <span class="txt" id="pwMain">点击下方按钮生成密码</span>
        <button class="icon-btn" id="refreshBtn" title="重新生成">🔄</button>
        <button class="icon-btn" id="copyMainBtn" title="复制密码">📋</button>
      </div>
      <div class="strength">
        <div class="st-bar">
          <i data-i="0"></i><i data-i="1"></i><i data-i="2"></i><i data-i="3"></i>
        </div>
        <div class="st-meta">
          <span>强度：<b id="stText">—</b></span>
          <span id="stEntropy">熵值 — bit</span>
        </div>
      </div>
    </div>

    <!-- 配置 -->
    <div class="panel">
      <h2><span class="bar"></span> 生成配置</h2>

      <div class="field">
        <label for="lenRange">密码长度</label>
        <div class="range-row">
          <input type="range" id="lenRange" min="8" max="64" step="1" value="16">
          <span class="val" id="lenVal">16</span>
        </div>
        <div class="len-quick">
          <button type="button" data-len="8">8 位</button>
          <button type="button" data-len="12">12 位</button>
          <button type="button" data-len="16">16 位</button>
          <button type="button" data-len="24">24 位</button>
          <button type="button" data-len="32">32 位</button>
          <button type="button" data-len="64">64 位</button>
        </div>
      </div>

      <div class="field">
        <label>包含字符类型</label>
        <div class="chk-grid">
          <label class="chk on"><input type="checkbox" id="cUpper" checked><span class="n">大写字母</span><span class="s">A-Z</span></label>
          <label class="chk on"><input type="checkbox" id="cLower" checked><span class="n">小写字母</span><span class="s">a-z</span></label>
          <label class="chk on"><input type="checkbox" id="cDigit" checked><span class="n">数字</span><span class="s">0-9</span></label>
          <label class="chk on"><input type="checkbox" id="cSymbol" checked><span class="n">特殊符号</span><span class="s">!@#$…</span></label>
          <label class="chk"><input type="checkbox" id="cNoSimilar"><span class="n">排除易混淆字符</span><span class="s">0O1lI</span></label>
          <label class="chk"><input type="checkbox" id="cNoRepeat"><span class="n">字符不重复</span><span class="s">唯一</span></label>
        </div>
        <div class="warn" id="warnBox"></div>
      </div>

      <div class="field">
        <label for="countSel">生成数量</label>
        <div class="count-row">
          <select id="countSel">
            <option value="1" selected>1 个</option>
            <option value="3">3 个</option>
            <option value="5">5 个</option>
            <option value="10">10 个</option>
            <option value="20">20 个</option>
          </select>
          <button class="btn primary" id="genBtn" style="flex:1;">⚡ 生成密码</button>
        </div>
      </div>
    </div>

    <!-- 批量结果 -->
    <div class="panel" id="listPanel" style="display:none;">
      <h2><span class="bar"></span> 生成结果 <span style="font-weight:500;color:var(--text-3);font-size:13px;" id="listCount"></span></h2>
      <div class="pw-list" id="pwList"></div>
      <div style="margin-top:14px;">
        <button class="btn block" id="copyAllBtn">📋 复制全部</button>
      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <!-- 子目录站内链接修正 -->
  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <!-- 工具逻辑 -->
  <script>
    (function () {
      var SETS = {
        upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lower: "abcdefghijklmnopqrstuvwxyz",
        digit: "0123456789",
        symbol: "!@#$%^&*()-_=+[]{};:,.?/"
      };
      var SIMILAR = "0O1lI|`'\"";

      var lenRange = document.getElementById("lenRange");
      var lenVal = document.getElementById("lenVal");
      var cUpper = document.getElementById("cUpper");
      var cLower = document.getElementById("cLower");
      var cDigit = document.getElementById("cDigit");
      var cSymbol = document.getElementById("cSymbol");
      var cNoSimilar = document.getElementById("cNoSimilar");
      var cNoRepeat = document.getElementById("cNoRepeat");
      var countSel = document.getElementById("countSel");
      var genBtn = document.getElementById("genBtn");
      var pwMain = document.getElementById("pwMain");
      var stText = document.getElementById("stText");
      var stEntropy = document.getElementById("stEntropy");
      var stBars = document.querySelectorAll(".st-bar i");
      var listPanel = document.getElementById("listPanel");
      var pwList = document.getElementById("pwList");
      var listCount = document.getElementById("listCount");
      var warnBox = document.getElementById("warnBox");
      var toastEl = document.getElementById("tipToast");

      var current = [];

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
      }

      /* ---------- 安全随机 ---------- */
      function randInt(max) {
        if (max <= 0) return 0;
        if (window.crypto && window.crypto.getRandomValues) {
          var limit = Math.floor(4294967296 / max) * max;
          var buf = new Uint32Array(1);
          var v;
          do { window.crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
          return v % max;
        }
        return Math.floor(Math.random() * max);
      }
      function pick(str) { return str.charAt(randInt(str.length)); }

      /* ---------- 字符池 ---------- */
      function buildPools() {
        var pools = [];
        if (cUpper.checked) pools.push(SETS.upper);
        if (cLower.checked) pools.push(SETS.lower);
        if (cDigit.checked) pools.push(SETS.digit);
        if (cSymbol.checked) pools.push(SETS.symbol);
        if (cNoSimilar.checked) {
          pools = pools.map(function (p) {
            return p.split("").filter(function (ch) { return SIMILAR.indexOf(ch) === -1; }).join("");
          }).filter(function (p) { return p.length > 0; });
        }
        return pools;
      }

      /* ---------- 生成单条密码 ---------- */
      function generateOne(len, pools, noRepeat) {
        var all = pools.join("");
        var chars = [];
        var used = {};

        // 每类至少一个
        for (var i = 0; i < pools.length && chars.length < len; i++) {
          var c = pick(pools[i]);
          if (noRepeat) {
            var guard = 0;
            while (used[c] && guard++ < 200) c = pick(pools[i]);
            if (used[c]) continue;
            used[c] = 1;
          }
          chars.push(c);
        }
        // 补足剩余
        while (chars.length < len) {
          var ch = pick(all);
          if (noRepeat) {
            var g = 0;
            while (used[ch] && g++ < 500) ch = pick(all);
            if (used[ch]) break;
            used[ch] = 1;
          }
          chars.push(ch);
        }
        // 洗牌（Fisher-Yates）
        for (var j = chars.length - 1; j > 0; j--) {
          var k = randInt(j + 1);
          var t = chars[j]; chars[j] = chars[k]; chars[k] = t;
        }
        return chars.join("");
      }

      /* ---------- 强度评估 ---------- */
      function evaluate(len, poolSize) {
        var entropy = poolSize > 1 ? len * (Math.log(poolSize) / Math.log(2)) : 0;
        var level, color;
        if (entropy < 40) { level = 0; }
        else if (entropy < 60) { level = 1; }
        else if (entropy < 90) { level = 2; }
        else { level = 3; }
        var names = ["弱", "中", "强", "极强"];
        var colors = ["#e5484d", "#f5a524", "#21ba72", "#0d6efd"];
        color = colors[level];

        stText.textContent = names[level];
        stText.style.color = color;
        stEntropy.textContent = "熵值 " + Math.round(entropy) + " bit";
        Array.prototype.forEach.call(stBars, function (bar, i) {
          bar.style.background = i <= level ? color : "";
        });
      }

      /* ---------- 校验配置 ---------- */
      function validate(len, pools) {
        var all = pools.join("");
        if (!pools.length) return "请至少勾选一种字符类型";
        if (cNoRepeat.checked && len > all.length) {
          return "「字符不重复」模式下，长度不能超过可用字符总数（当前 " + all.length + " 个）";
        }
        return "";
      }

      /* ---------- 渲染 ---------- */
      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
        return new Promise(function (resolve, reject) {
          try {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            resolve();
          } catch (e) { reject(e); }
        });
      }

      function renderList() {
        pwList.innerHTML = "";
        if (current.length <= 1) {
          listPanel.style.display = "none";
          return;
        }
        listPanel.style.display = "block";
        listCount.textContent = "共 " + current.length + " 条";
        current.forEach(function (pw, i) {
          var row = document.createElement("div");
          row.className = "pw-item";

          var idx = document.createElement("span");
          idx.className = "idx";
          idx.textContent = (i + 1);

          var txt = document.createElement("span");
          txt.className = "txt";
          txt.textContent = pw;

          var btn = document.createElement("button");
          btn.className = "copy";
          btn.textContent = "复制";
          btn.addEventListener("click", function () {
            copyText(pw).then(function () {
              btn.textContent = "已复制";
              btn.classList.add("done");
              setTimeout(function () { btn.textContent = "复制"; btn.classList.remove("done"); }, 1300);
            }).catch(function () { toast("复制失败，请手动选中复制"); });
          });

          row.appendChild(idx);
          row.appendChild(txt);
          row.appendChild(btn);
          pwList.appendChild(row);
        });
      }

      function generate() {
        var len = parseInt(lenRange.value, 10);
        var pools = buildPools();
        var err = validate(len, pools);
        if (err) {
          warnBox.textContent = "⚠️ " + err;
          warnBox.style.display = "block";
          return;
        }
        warnBox.style.display = "none";

        var n = parseInt(countSel.value, 10);
        var noRepeat = cNoRepeat.checked;
        current = [];
        for (var i = 0; i < n; i++) current.push(generateOne(len, pools, noRepeat));

        pwMain.textContent = current[0];
        evaluate(len, pools.join("").length);
        renderList();
      }

      /* ---------- 事件 ---------- */
      lenRange.addEventListener("input", function () {
        lenVal.textContent = lenRange.value;
        generate();
      });
      Array.prototype.forEach.call(document.querySelectorAll(".len-quick button"), function (b) {
        b.addEventListener("click", function () {
          lenRange.value = b.dataset.len;
          lenVal.textContent = b.dataset.len;
          generate();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll(".chk input"), function (inp) {
        inp.addEventListener("change", function () {
          inp.closest(".chk").classList.toggle("on", inp.checked);
          generate();
        });
      });
      countSel.addEventListener("change", generate);
      genBtn.addEventListener("click", generate);
      document.getElementById("refreshBtn").addEventListener("click", generate);

      document.getElementById("copyMainBtn").addEventListener("click", function () {
        if (!current.length) { toast("请先生成密码"); return; }
        copyText(current[0]).then(function () { toast("密码已复制到剪贴板"); })
          .catch(function () { toast("复制失败，请手动选中复制"); });
      });
      document.getElementById("copyAllBtn").addEventListener("click", function () {
        if (!current.length) return;
        copyText(current.join("\n")).then(function () { toast("已复制全部 " + current.length + " 条密码"); })
          .catch(function () { toast("复制失败，请手动选中复制"); });
      });

      function boot() {
        lenVal.textContent = lenRange.value;
        generate();
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
  </script>

  <!-- 左下角水印 -->
  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
