<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆翻牌 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:680px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .top-bar{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--text-2);}
    .top-bar b{color:var(--primary);font-size:16px;}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;margin:0 auto;}
    .card{aspect-ratio:1/1;background:var(--bg);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;user-select:none;transition:transform .25s,background .25s;transform-style:preserve-3d;position:relative;}
    .card.flipped,.card.matched{background:var(--primary-soft);border-color:var(--primary);cursor:default;}
    .card.matched{background:rgba(39,174,96,.16);border-color:#27ae60;}
    .card span{opacity:0;transition:opacity .2s;}
    .card.flipped span,.card.matched span{opacity:1;}
    .btns{text-align:center;margin-top:22px;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .tip-toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:9999;}
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @media(max-width:560px){.grid{gap:8px;}.card{font-size:26px;}}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🃏</span>
      <h1>记忆翻牌</h1>
    </div>
    <p class="tool-sub">翻开两张相同的卡片即可消除，用最少的步数找出所有配对吧！</p>

    <div class="top-bar">
      <span>步数：<b id="moves">0</b></span>
      <span>配对：<b id="pairs">0</b>/8</span>
      <span>用时：<b id="time">0s</b></span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="btns">
      <button class="btn-primary" id="restartBtn">🔄 重新开始</button>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var EMOJI=["🍎","🍌","🍇","🍉","🍓","🍒","🥝","🍑"];
      var grid=document.getElementById("grid"), movesEl=document.getElementById("moves"), pairsEl=document.getElementById("pairs"), timeEl=document.getElementById("time");
      var toastEl=document.getElementById("tipToast");
      function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove("show");},1700);}

      var first=null, lock=false, moves=0, pairs=0, start=0, timer=null;

      function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

      function build(){
        moves=0; pairs=0; first=null; lock=false;
        movesEl.textContent="0"; pairsEl.textContent="0";
        start=Date.now();
        if(timer) clearInterval(timer);
        timer=setInterval(function(){ timeEl.textContent=Math.floor((Date.now()-start)/1000)+"s"; },1000);
        var items=shuffle(EMOJI.concat(EMOJI));
        grid.innerHTML="";
        items.forEach(function(sym,idx){
          var c=document.createElement("div");
          c.className="card"; c.dataset.sym=sym; c.dataset.idx=idx;
          c.innerHTML="<span>"+sym+"</span>";
          c.addEventListener("click", flip);
          grid.appendChild(c);
        });
      }

      function flip(){
        if(lock) return;
        var c=this;
        if(c.classList.contains("flipped")||c.classList.contains("matched")) return;
        c.classList.add("flipped");
        if(!first){ first=c; return; }
        moves++; movesEl.textContent=moves;
        if(first.dataset.sym===c.dataset.sym){
          first.classList.add("matched"); c.classList.add("matched");
          first=null; pairs++; pairsEl.textContent=pairs;
          if(pairs===EMOJI.length){ if(timer)clearInterval(timer); toast("🎉 全部配对完成！用了 "+moves+" 步"); }
        } else {
          lock=true;
          var f=first; first=null;
          setTimeout(function(){ f.classList.remove("flipped"); c.classList.remove("flipped"); lock=false; },700);
        }
      }

      document.getElementById("restartBtn").addEventListener("click", build);
      build();
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
