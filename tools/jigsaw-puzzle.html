<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼图游戏 - XHCDNS</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.jp-wrap{max-width:360px;margin:0 auto;padding:28px 0 48px;text-align:center;}
.jp-wrap h1{margin-bottom:4px;font-size:22px;}
.jp-info{display:flex;justify-content:center;gap:20px;margin:14px 0;font-size:15px;}
.jp-info span{background:var(--card);border:1px solid var(--border);padding:6px 18px;border-radius:8px;}
.jp-board{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#bbada0;padding:6px;border-radius:8px;width:240px;margin:0 auto;}
.jp-tile{width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;border-radius:6px;cursor:pointer;user-select:none;transition:transform .15s,color .15s;}
.jp-tile.empty{background:#cdc1b4;color:#cdc1b4;cursor:default;}
.jp-tile:not(.empty):active{transform:scale(0.95);}
.jp-btns{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.hint-text{color:var(--text-3);font-size:13px;margin-top:12px;}
.jp-win{color:#27ae60;font-weight:bold;font-size:18px;display:none;margin-top:10px;}
.jp-colors{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
  </style>
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="loader-content"><img src="../assets/images/loading-logo.png" alt="" class="loader-logo"><div class="loader-bar"><div class="loader-bar-inner"></div></div></div></div>
<header class="header"><div class="container"><a class="brand" href="../index.html"><img src="../assets/images/xhc-96x96.png" alt="" class="site-logo"><span class="brand-name">XHC<b>DNS</b></span></a><nav class="nav" id="navCats"></nav><div class="search"><input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off"><button id="searchBtn" title="搜索">🔍</button></div><span id="accountSlot"></span></div></header>
<main class="jp-wrap">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
<h1>🖼️ 拼图游戏</h1>
<div class="jp-info"><span>步数：<strong id="jpSteps">0</strong></span><span>时间：<strong id="jpTime">00:00</strong></span></div>
<div class="jp-board" id="jpBoard"></div>
<div class="jp-btns"><button class="btn btn-primary" id="jpShuffle">打乱</button><button class="btn btn-outline" id="jpReset">重置</button></div>
<p class="hint-text">点击色块移动到空位，按数字顺序排列获胜</p>
<div class="jp-win" id="jpWin">🎉 恭喜完成！</div>
</main>
<footer class="footer"><div class="container">© <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>本站由 XHCDNS 制作</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script>
<script>
(function(){
var colors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c','#e91e63','#ff9800'];
var board=[],emptyIdx=8,steps=0,timer=null,sec=0;
var boardEl=document.getElementById('jpBoard');

function render(){boardEl.innerHTML='';for(var i=0;i<9;i++){var d=document.createElement('div');d.className='jp-tile jp-colors'+(i===emptyIdx?' empty':'');d.textContent=i===emptyIdx?'':board[i];if(i!==emptyIdx)d.style.background=colors[board[i]-1]||colors[i];if(i!==emptyIdx)d.onclick=(function(idx){return function(){moveTile(idx);};})(i);boardEl.appendChild(d);}document.getElementById('jpSteps').textContent=steps;}

function moveTile(idx){
var er=(emptyIdx/3)|0,ec=emptyIdx%3,r=(idx/3)|0,c=idx%3;
if((Math.abs(r-er)===1&&c===ec)||(Math.abs(c-ec)===1&&r===er)){
board[emptyIdx]=board[idx];board[idx]=0;emptyIdx=idx;steps++;render();checkWin();if(!timer){timer=setInterval(function(){sec++;var m=('0'+((sec/60)|0)).slice(-2),s=('0'+(sec%60)).slice(-2);document.getElementById('jpTime').textContent=m+':'+s;},1000);}}}

function checkWin(){for(var i=0;i<8;i++)if(board[i]!==i+1)return;if(board[8]!==0)return;clearInterval(timer);timer=null;document.getElementById('jpWin').style.display='block';}

function shuffle(){for(var i=0;i<100;i++){var neighbors=[];var er=(emptyIdx/3)|0,ec=emptyIdx%3;if(er>0)neighbors.push(emptyIdx-3);if(er<2)neighbors.push(emptyIdx+3);if(ec>0)neighbors.push(emptyIdx-1);if(ec<2)neighbors.push(emptyIdx+1);var n=neighbors[Math.floor(Math.random()*neighbors.length)];board[emptyIdx]=board[n];board[n]=0;emptyIdx=n;}steps=0;sec=0;if(timer){clearInterval(timer);timer=null;}document.getElementById('jpTime').textContent='00:00';document.getElementById('jpWin').style.display='none';render();}

function init(){board=[1,2,3,4,5,6,7,8,0];emptyIdx=8;steps=0;sec=0;if(timer){clearInterval(timer);timer=null;}document.getElementById('jpTime').textContent='00:00';document.getElementById('jpWin').style.display='none';render();shuffle();}

document.getElementById('jpShuffle').onclick=shuffle;
document.getElementById('jpReset').onclick=init;

init();
})();
</script>
<div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="../assets/images/watermark.png" alt=""></a></div>
</body>
</html>
