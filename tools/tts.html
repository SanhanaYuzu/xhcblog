<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字转语音 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;box-sizing:border-box;}
    textarea{resize:vertical;min-height:140px;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    .field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:11px 13px;color:var(--text);word-break:break-all;}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
    .col2{display:flex;gap:12px;flex-wrap:wrap;}
    .col2>div{flex:1;min-width:160px;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🗣️</span>
      <div>
        <h1>文字转语音</h1>
        <p class="tool-sub">基于浏览器 Web Speech API，输入文字即可朗读，支持语速 / 音调 / 音色</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 输入要朗读的文字</h2>
      <textarea id="text" placeholder="请输入或粘贴要朗读的中文 / 英文文本……">你好，欢迎使用 XHC 博客的文字转语音工具。</textarea>
      <div class="row" style="margin-top:12px;">
        <label class="field" style="flex:1;min-width:200px;">音色
          <select id="voice"></select>
        </label>
      </div>
      <div class="col2">
        <div>
          <label class="field" style="margin-bottom:6px;">语速 <span id="rateV">1.0</span></label>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" style="width:100%">
        </div>
        <div>
          <label class="field" style="margin-bottom:6px;">音调 <span id="pitchV">1.0</span></label>
          <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" style="width:100%">
        </div>
      </div>
      <div class="btns" style="margin-top:14px;">
        <button class="btn-primary" id="play">▶ 朗读</button>
        <button class="btn-ghost" id="pause">⏸ 暂停</button>
        <button class="btn-ghost" id="resume">⏵ 继续</button>
        <button class="btn-ghost" id="stop">⏹ 停止</button>
      </div>
      <div class="out" id="status" style="margin-top:12px;">就绪</div>
      <div class="note">语音合成能力依赖浏览器内置引擎，Chrome / Edge 效果最佳。当前设备若无中文语音包，可尝试切换其它音色。所有处理均在本地完成，文字不会上传。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var text=document.getElementById("text");
      var voiceSel=document.getElementById("voice");
      var rate=document.getElementById("rate"), rateV=document.getElementById("rateV");
      var pitch=document.getElementById("pitch"), pitchV=document.getElementById("pitchV");
      var play=document.getElementById("play"), pause=document.getElementById("pause");
      var resume=document.getElementById("resume"), stop=document.getElementById("stop");
      var status=document.getElementById("status");
      document.getElementById("year").textContent=new Date().getFullYear();

      var synth = window.speechSynthesis;
      var voices = [];
      function setStatus(m){ status.textContent=m; }
      function loadVoices(){
        voices = synth ? synth.getVoices() : [];
        voiceSel.innerHTML = "";
        if(!voices.length){ voiceSel.innerHTML='<option value="">（当前浏览器无可用语音）</option>'; return; }
        voices.forEach(function(v,i){
          var o=document.createElement("option");
          o.value=i;
          o.textContent=v.name+" ("+(v.lang||"?")+")"+(v.default?" ·默认":"");
          voiceSel.appendChild(o);
        });
        // 尝试默认选中 zh
        var zh=voices.findIndex(function(v){return /zh/i.test(v.lang);});
        if(zh>=0) voiceSel.value=zh;
      }
      if(synth){
        loadVoices();
        if(typeof synth.onvoiceschanged!=="undefined"){ synth.onvoiceschanged=loadVoices; }
      } else {
        voiceSel.innerHTML='<option value="">（当前浏览器不支持语音合成）</option>';
        setStatus("当前浏览器不支持 Web Speech API");
      }

      rate.oninput=function(){ rateV.textContent=(+rate.value).toFixed(1); };
      pitch.oninput=function(){ pitchV.textContent=(+pitch.value).toFixed(1); };

      function speak(){
        if(!synth) return;
        synth.cancel();
        var t=text.value.trim();
        if(!t){ setStatus("请先输入文字"); return; }
        var u=new SpeechSynthesisUtterance(t);
        var vi=parseInt(voiceSel.value,10);
        if(voices[vi]) u.voice=voices[vi];
        u.lang = voices[vi] ? voices[vi].lang : "zh-CN";
        u.rate=+rate.value; u.pitch=+pitch.value;
        u.onstart=function(){ setStatus("朗读中…"); };
        u.onend=function(){ setStatus("朗读结束"); };
        u.onerror=function(e){ setStatus("出错："+(e.error||"未知")); };
        synth.speak(u);
      }
      play.onclick=speak;
      pause.onclick=function(){ if(synth) synth.pause(); setStatus("已暂停"); };
      resume.onclick=function(){ if(synth) synth.resume(); setStatus("继续朗读"); };
      stop.onclick=function(){ if(synth) synth.cancel(); setStatus("已停止"); };
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
