<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日期差计算 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    input[type=date],input[type=number]{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;}
    .field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);}
    .out{font-size:15px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:14px;color:var(--text);line-height:1.9;}
    .out b{color:var(--primary);font-size:17px;}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">📆</span>
      <div>
        <h1>日期差 / 推算</h1>
        <p class="tool-sub">计算两个日期相差多少天，或从一个日期加 / 减天数</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 相差天数</h2>
      <div class="row">
        <div class="field">起始 <input type="date" id="d1"></div>
        <div class="field">结束 <input type="date" id="d2"></div>
      </div>
      <div class="out" id="diffOut">请选择两个日期</div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 日期推算</h2>
      <div class="row">
        <div class="field">基准 <input type="date" id="d3"></div>
        <div class="field">天数 <input type="number" id="addN" value="7" style="width:90px"></div>
        <button class="btn-primary" id="addBtn">加</button>
        <button class="btn-ghost" id="subBtn">减</button>
      </div>
      <div class="out" id="calcOut">—</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var d1=document.getElementById("d1"), d2=document.getElementById("d2"), diffOut=document.getElementById("diffOut");
      var d3=document.getElementById("d3"), addN=document.getElementById("addN"), calcOut=document.getElementById("calcOut");
      var pad=function(n){return n<10?"0"+n:""+n;};
      function fmt(ms){ var d=new Date(ms); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
      function ymd(s){ var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null; return Date.UTC(+m[1],+m[2]-1,+m[3]); }

      function diff(){
        if(!d1.value||!d2.value){ diffOut.textContent="请选择两个日期"; return; }
        var a=ymd(d1.value), b=ymd(d2.value);
        var days=Math.round((b-a)/86400000);
        var abs=Math.abs(days);
        var y=Math.floor(abs/365), r=abs%365, mo=Math.floor(r/30), dd=r%30;
        var parts=[]; if(y)parts.push(y+" 年"); if(mo)parts.push(mo+" 个月"); if(dd||!parts.length)parts.push(dd+" 天");
        diffOut.innerHTML="相差 <b>"+abs+"</b> 天（约 "+parts.join(" ")+"）<br><span style='color:var(--text-3);font-size:13px'>"+
          (days>=0? d1.value+" 到 "+d2.value+" 是 "+days+" 天后" : d2.value+" 比 "+d1.value+" 早 "+abs+" 天")+"</span>";
      }
      function calc(sign){
        if(!d3.value){ calcOut.textContent="请选择基准日期"; return; }
        var base=ymd(d3.value); var n=parseInt(addN.value,10)||0;
        calcOut.innerHTML="结果：<b>"+fmt(base+sign*n*86400000)+"</b> <span style='color:var(--text-3);font-size:13px'>（"+(sign>0?"加":"减")+n+" 天）</span>";
      }
      d1.onchange=d2.onchange=diff;
      d3.onchange=function(){ calc(1); };
      document.getElementById("addBtn").onclick=function(){calc(1);};
      document.getElementById("subBtn").onclick=function(){calc(-1);};

      var t=new Date();
      d1.value=fmt(t.getTime()); d2.value=fmt(t.getTime()+7*86400000);
      d3.value=fmt(t.getTime());
      diff(); calc(1);
      document.getElementById("year").textContent=t.getFullYear();
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
