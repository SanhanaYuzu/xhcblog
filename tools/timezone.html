<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时区转换 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .tz-out{margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    .tz-item{display:flex;justify-content:space-between;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;}
    .tz-item .z{color:var(--text-2);font-size:13px;}
    .tz-item .t{font-weight:700;font-variant-numeric:tabular-nums;}
    @media(max-width:520px){.tz-out{grid-template-columns:1fr;}}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🌐</span>
      <h1>时区转换</h1>
    </div>
    <p class="tool-sub">输入一个时间，同时换算到多个常用时区（基于浏览器本地时间）。</p>

    <div class="panel">
      <div class="row"><label>本地时间</label><input type="datetime-local" id="tzInput" style="flex:1;"></div>
      <div class="tz-out" id="tzOut"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHCDNS · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var ZONES=[['北京','Asia/Shanghai'],['东京','Asia/Tokyo'],['纽约','America/New_York'],['伦敦','Europe/London'],['巴黎','Europe/Paris'],['莫斯科','Europe/Moscow'],['悉尼','Australia/Sydney'],['洛杉矶','America/Los_Angeles']];
      var input=document.getElementById('tzInput'),out=document.getElementById('tzOut');
      function pad(n){return n<10?'0'+n:n;}
      function toLocal(d){var off=-d.getTimezoneOffset();return new Date(d.getTime()-off*60000);}
      function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
      function update(){
        var v=input.value;if(!v){out.innerHTML='';return;}
        var d=new Date(v);if(isNaN(d)){out.innerHTML='';return;}
        var utc=toLocal(d).getTime();
        var h='';for(var i=0;i<ZONES.length;i++){var opt={timeZone:ZONES[i][1],year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false};var s=new Intl.DateTimeFormat('zh-CN',opt).format(d);h+='<div class="tz-item"><span class="z">'+ZONES[i][0]+'</span><span class="t">'+s+'</span></div>';}
        out.innerHTML=h;
      }
      var now=new Date();input.value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'T'+pad(now.getHours())+':'+pad(now.getMinutes());
      input.onchange=update;input.oninput=update;update();
    })();
  </script>
</body>
</html>
