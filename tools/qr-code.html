<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二维码生成器 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}

    .qr-wrap{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
    .field textarea{
      width:100%;min-height:130px;resize:vertical;padding:12px 14px;font-size:14px;line-height:1.6;
      border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);
      font-family:inherit;outline:none;transition:.15s;
    }
    .field textarea:focus{border-color:var(--primary);background:var(--card);}
    .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .opt-grid select,.opt-grid input[type="range"]{width:100%;}
    .opt-grid select{
      padding:9px 10px;border:1px solid var(--border);border-radius:9px;
      background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;cursor:pointer;
    }
    .opt-grid select:focus{border-color:var(--primary);}
    .range-row{display:flex;align-items:center;gap:10px;}
    .range-row input[type="range"]{flex:1;accent-color:var(--primary);}
    .range-row .val{font-size:13px;color:var(--text-2);min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}
    .color-row{display:flex;align-items:center;gap:8px;}
    .color-row input[type="color"]{
      width:42px;height:34px;padding:2px;border:1px solid var(--border);border-radius:8px;
      background:var(--card);cursor:pointer;
    }
    .color-row span{font-size:13px;color:var(--text-3);}

    .qr-preview{
      background:var(--bg);border:1px solid var(--border);border-radius:14px;
      padding:18px;text-align:center;
    }
    .qr-box{
      min-height:220px;display:flex;align-items:center;justify-content:center;
      background:#fff;border-radius:10px;padding:10px;overflow:hidden;
    }
    body.dark .qr-box{background:#f1f2f4;}
    #qrCanvas{max-width:100%;height:auto;display:none;border-radius:4px;}
    .qr-empty{color:var(--text-3);font-size:13px;line-height:1.8;}
    .qr-empty .big{font-size:40px;display:block;margin-bottom:6px;}
    .qr-tip{font-size:12px;color:var(--text-3);margin:12px 0 14px;min-height:18px;}
    .qr-tip.err{color:#e5484d;}

    .btn{
      border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;
      padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
    }
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;width:100%;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.45;cursor:not-allowed;}
    .btn:disabled:hover{border-color:var(--border);color:var(--text-2);}
    .btn.primary:disabled:hover{background:var(--primary);color:#fff;}

    .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
    .quick button{
      border:1px solid var(--border);background:var(--bg);color:var(--text-2);
      border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;
    }
    .quick button:hover{border-color:var(--primary);color:var(--primary);}

    .tip-toast{
      position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);
      background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;
      opacity:0;pointer-events:none;transition:.22s;z-index:9999;
    }
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:760px){
      .qr-wrap{grid-template-columns:1fr;}
      .panel{padding:18px 15px;}
      .opt-grid{grid-template-columns:1fr;gap:12px;}
    }
  </style>
</head>
<body>

  <!-- 页面跳转加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">📱</span>
      <h1>二维码生成器</h1>
    </div>
    <p class="tool-sub">输入文本或网址即可实时生成二维码，支持自定义尺寸、容错级别与配色，可下载 PNG 图片。</p>

    <div class="panel">
      <div class="qr-wrap">
        <!-- 左：输入与配置 -->
        <div>
          <div class="field">
            <label for="qrText">内容（文本 / 网址 / 任意字符）</label>
            <textarea id="qrText" placeholder="在此输入要生成二维码的内容，例如：https://xhc.dpdns.org">https://xhc.dpdns.org</textarea>
            <div class="quick">
              <button type="button" data-fill="https://xhc.dpdns.org">🌐 本站网址</button>
              <button type="button" data-fill="WIFI:T:WPA;S:WiFi名称;P:密码;;">📶 WiFi 模板</button>
              <button type="button" data-fill="mailto:hello@example.com">✉️ 邮箱模板</button>
              <button type="button" data-fill="tel:10086">📞 电话模板</button>
            </div>
          </div>

          <div class="opt-grid">
            <div class="field" style="margin-bottom:0;">
              <label for="qrSize">尺寸</label>
              <div class="range-row">
                <input type="range" id="qrSize" min="120" max="800" step="20" value="320">
                <span class="val" id="sizeVal">320 px</span>
              </div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="qrMargin">白边宽度</label>
              <div class="range-row">
                <input type="range" id="qrMargin" min="0" max="8" step="1" value="2">
                <span class="val" id="marginVal">2</span>
              </div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="qrEc">容错级别</label>
              <select id="qrEc">
                <option value="L">L · 低（约 7%）</option>
                <option value="M" selected>M · 中（约 15%）</option>
                <option value="Q">Q · 较高（约 25%）</option>
                <option value="H">H · 高（约 30%）</option>
              </select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label>前景 / 背景色</label>
              <div class="color-row">
                <input type="color" id="qrFg" value="#000000" title="前景色">
                <input type="color" id="qrBg" value="#ffffff" title="背景色">
                <span id="colorReset" style="cursor:pointer;text-decoration:underline;">重置</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 右：预览与下载 -->
        <div class="qr-preview">
          <div class="qr-box">
            <canvas id="qrCanvas"></canvas>
            <div class="qr-empty" id="qrEmpty">
              <span class="big">🔳</span>
              输入内容后<br>自动生成二维码
            </div>
          </div>
          <div class="qr-tip" id="qrTip"></div>
          <button class="btn primary" id="dlBtn" disabled>⬇️ 下载 PNG</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- 子目录站内链接修正（app.js 生成的链接以站点根目录为基准） -->
  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <!-- 工具逻辑 -->
  <script>
    (function () {
      var textEl = document.getElementById("qrText");
      var canvas = document.getElementById("qrCanvas");
      var emptyEl = document.getElementById("qrEmpty");
      var tipEl = document.getElementById("qrTip");
      var dlBtn = document.getElementById("dlBtn");
      var sizeEl = document.getElementById("qrSize"), sizeVal = document.getElementById("sizeVal");
      var marginEl = document.getElementById("qrMargin"), marginVal = document.getElementById("marginVal");
      var ecEl = document.getElementById("qrEc");
      var fgEl = document.getElementById("qrFg"), bgEl = document.getElementById("qrBg");
      var toastEl = document.getElementById("tipToast");
      var timer = null, ready = false;

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
      }

      function showEmpty(msg, isErr) {
        canvas.style.display = "none";
        emptyEl.style.display = "block";
        dlBtn.disabled = true;
        ready = false;
        tipEl.textContent = msg || "";
        tipEl.className = isErr ? "qr-tip err" : "qr-tip";
      }

      function render() {
        var text = textEl.value;
        if (!window.QRCode || typeof window.QRCode.toCanvas !== "function") {
          showEmpty("二维码库加载失败，请检查网络后刷新页面重试", true);
          return;
        }
        if (!text.trim()) {
          showEmpty("");
          return;
        }
        var opts = {
          width: parseInt(sizeEl.value, 10),
          margin: parseInt(marginEl.value, 10),
          errorCorrectionLevel: ecEl.value,
          color: { dark: fgEl.value, light: bgEl.value }
        };
        window.QRCode.toCanvas(canvas, text, opts, function (err) {
          if (err) {
            showEmpty("生成失败：内容过长，请减少字符数或降低容错级别", true);
            return;
          }
          canvas.style.display = "block";
          emptyEl.style.display = "none";
          dlBtn.disabled = false;
          ready = true;
          tipEl.className = "qr-tip";
          tipEl.textContent = "共 " + text.length + " 个字符 · " + opts.width + "×" + opts.width + " px";
        });
      }

      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(render, 180);
      }

      textEl.addEventListener("input", schedule);
      ecEl.addEventListener("change", render);
      fgEl.addEventListener("input", schedule);
      bgEl.addEventListener("input", schedule);
      sizeEl.addEventListener("input", function () {
        sizeVal.textContent = sizeEl.value + " px";
        schedule();
      });
      marginEl.addEventListener("input", function () {
        marginVal.textContent = marginEl.value;
        schedule();
      });

      document.getElementById("colorReset").addEventListener("click", function () {
        fgEl.value = "#000000";
        bgEl.value = "#ffffff";
        render();
      });

      Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function (b) {
        b.addEventListener("click", function () {
          textEl.value = b.dataset.fill;
          textEl.focus();
          render();
        });
      });

      dlBtn.addEventListener("click", function () {
        if (!ready) return;
        try {
          var a = document.createElement("a");
          a.download = "qrcode-" + Date.now() + ".png";
          a.href = canvas.toDataURL("image/png");
          a.click();
          toast("二维码已保存为 PNG");
        } catch (e) {
          toast("下载失败，请长按或右键图片另存为");
        }
      });

      // 库为异步加载，就绪后首次渲染
      function boot() {
        sizeVal.textContent = sizeEl.value + " px";
        marginVal.textContent = marginEl.value;
        var tries = 0;
        (function wait() {
          if (window.QRCode && typeof window.QRCode.toCanvas === "function") { render(); return; }
          if (++tries > 40) { showEmpty("二维码库加载失败，请检查网络后刷新页面重试", true); return; }
          setTimeout(wait, 100);
        })();
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
  </script>

  <!-- 左下角水印 -->
  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
