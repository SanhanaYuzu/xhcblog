<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二维码生成器 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}

    .qr-wrap{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
    .field textarea{
      width:100%;min-height:130px;resize:vertical;padding:12px 14px;font-size:14px;line-height:1.6;
      border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);
      font-family:inherit;outline:none;transition:.15s;
    }
    .field textarea:focus{border-color:var(--primary);background:var(--card);}
    .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .opt-grid select,.opt-grid input[type="range"]{width:100%;}
    .opt-grid select{
      padding:9px 10px;border:1px solid var(--border);border-radius:9px;
      background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;cursor:pointer;
    }
    .opt-grid select:focus{border-color:var(--primary);}
    .range-row{display:flex;align-items:center;gap:10px;}
    .range-row input[type="range"]{flex:1;accent-color:var(--primary);}
    .range-row .val{font-size:13px;color:var(--text-2);min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}
    .color-row{display:flex;align-items:center;gap:8px;}
    .color-row input[type="color"]{
      width:42px;height:34px;padding:2px;border:1px solid var(--border);border-radius:8px;
      background:var(--card);cursor:pointer;
    }
    .color-row span{font-size:13px;color:var(--text-3);}

    .qr-preview{
      background:var(--bg);border:1px solid var(--border);border-radius:14px;
      padding:18px;text-align:center;
    }
    .qr-box{
      min-height:220px;display:flex;align-items:center;justify-content:center;
      background:#fff;border-radius:10px;padding:10px;overflow:hidden;
    }
    body.dark .qr-box{background:#f1f2f4;}
    #qrCanvas{max-width:100%;height:auto;display:none;border-radius:4px;}
    .qr-empty{color:var(--text-3);font-size:13px;line-height:1.8;}
    .qr-empty .big{font-size:40px;display:block;margin-bottom:6px;}
    .qr-tip{font-size:12px;color:var(--text-3);margin:12px 0 14px;min-height:18px;}
    .qr-tip.err{color:#e5484d;}

    .btn{
      border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;
      padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
    }
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;width:100%;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.45;cursor:not-allowed;}
    .btn:disabled:hover{border-color:var(--border);color:var(--text-2);}
    .btn.primary:disabled:hover{background:var(--primary);color:#fff;}

    .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
    .quick button{
      border:1px solid var(--border);background:var(--bg);color:var(--text-2);
      border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;
    }
    .quick button:hover{border-color:var(--primary);color:var(--primary);}

    .tip-toast{
      position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(10px);
      background:rgba(20,22,28,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;
      opacity:0;pointer-events:none;transition:.22s;z-index:9999;
    }
    .tip-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    .style-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
    .style-row label{font-size:13px;font-weight:600;color:var(--text-2);margin:0;}
    .style-row select{
      padding:9px 10px;border:1px solid var(--border);border-radius:9px;
      background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;cursor:pointer;
    }
    .style-row select:focus{border-color:var(--primary);}
    .img-ctl{margin-bottom:16px;display:none;}
    .img-ctl.show{display:block;}
    .img-drop{
      border:1.5px dashed var(--border);border-radius:12px;padding:14px;
      display:flex;align-items:center;gap:14px;background:var(--bg);cursor:pointer;transition:.15s;
    }
    .img-drop:hover{border-color:var(--primary);}
    .img-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--border);background:#fff;flex:none;}
    .img-meta{font-size:13px;color:var(--text-2);line-height:1.5;flex:1;min-width:0;}
    .img-meta .nm{color:var(--text);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .img-meta .hint{color:var(--text-3);font-size:12px;}
    .img-remove{
      margin-left:auto;border:1px solid var(--border);background:var(--card);color:var(--text-2);
      border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;flex:none;
    }
    .img-remove:hover{border-color:var(--primary);color:var(--primary);}
    .img-pick{display:none;}

    @media(max-width:760px){
      .qr-wrap{grid-template-columns:1fr;}
      .panel{padding:18px 15px;}
      .opt-grid{grid-template-columns:1fr;gap:12px;}
    }
  </style>
</head>
<body>

  <!-- 页面跳转加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">📱</span>
      <h1>二维码生成器</h1>
    </div>
    <p class="tool-sub">输入文本或网址即可实时生成二维码，支持自定义尺寸、容错级别与配色；可上传图片生成「中心图标」品牌码或「艺术图片」二维码；支持下载 PNG。</p>

    <div class="panel">
      <div class="qr-wrap">
        <!-- 左：输入与配置 -->
        <div>
          <div class="field">
            <label for="qrText">内容（文本 / 网址 / 任意字符）</label>
            <textarea id="qrText" placeholder="在此输入要生成二维码的内容，例如：https://xhcdns.com">https://xhc.dpdns.org</textarea>
            <div class="quick">
              <button type="button" data-fill="https://xhcdns.com">🌐 本站网址</button>
              <button type="button" data-fill="WIFI:T:WPA;S:WiFi名称;P:密码;;">📶 WiFi 模板</button>
              <button type="button" data-fill="mailto:hello@example.com">✉️ 邮箱模板</button>
                <button type="button" data-fill="tel:10086">📞 电话模板</button>
              </div>
            </div>

            <div class="style-row">
              <label for="qrStyle">样式</label>
              <select id="qrStyle">
                <option value="standard" selected>标准二维码</option>
                <option value="logo">中心图标（品牌）</option>
                <option value="art">艺术图片二维码</option>
              </select>
              <span id="styleHint" style="font-size:12px;color:var(--text-3);"></span>
            </div>

            <div class="img-ctl" id="imgCtl">
              <label style="display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;">上传图片（作为中心图标或艺术底图）</label>
              <div class="img-drop" id="imgDrop">
                <img class="img-thumb" id="imgThumb" alt="预览" style="display:none;">
                <div class="img-meta">
                  <span class="nm" id="imgName"></span>
                  <span class="hint" id="imgHint">点击选择图片（建议正方形、对比度高的图，艺术模式效果更佳）</span>
                </div>
                <button type="button" class="img-remove" id="imgRemove" style="display:none;">移除</button>
              </div>
              <input type="file" id="imgPick" class="img-pick" accept="image/*">
            </div>

            <div class="opt-grid">
            <div class="field" style="margin-bottom:0;">
              <label for="qrSize">尺寸</label>
              <div class="range-row">
                <input type="range" id="qrSize" min="120" max="800" step="20" value="320">
                <span class="val" id="sizeVal">320 px</span>
              </div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="qrMargin">白边宽度</label>
              <div class="range-row">
                <input type="range" id="qrMargin" min="0" max="8" step="1" value="2">
                <span class="val" id="marginVal">2</span>
              </div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="qrEc">容错级别</label>
              <select id="qrEc">
                <option value="L">L · 低（约 7%）</option>
                <option value="M" selected>M · 中（约 15%）</option>
                <option value="Q">Q · 较高（约 25%）</option>
                <option value="H">H · 高（约 30%）</option>
              </select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label>前景 / 背景色</label>
              <div class="color-row">
                <input type="color" id="qrFg" value="#000000" title="前景色">
                <input type="color" id="qrBg" value="#ffffff" title="背景色">
                <span id="colorReset" style="cursor:pointer;text-decoration:underline;">重置</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 右：预览与下载 -->
        <div class="qr-preview">
          <div class="qr-box">
            <canvas id="qrCanvas"></canvas>
            <div class="qr-empty" id="qrEmpty">
              <span class="big">🔳</span>
              输入内容后<br>自动生成二维码
            </div>
          </div>
          <div class="qr-tip" id="qrTip"></div>
          <button class="btn primary" id="dlBtn" disabled>⬇️ 下载 PNG</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <div class="tip-toast" id="tipToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- 子目录站内链接修正（app.js 生成的链接以站点根目录为基准） -->
  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <!-- 工具逻辑 -->
  <script>
    (function () {
      var textEl = document.getElementById("qrText");
      var canvas = document.getElementById("qrCanvas");
      var ctx = canvas.getContext("2d");
      var emptyEl = document.getElementById("qrEmpty");
      var tipEl = document.getElementById("qrTip");
      var dlBtn = document.getElementById("dlBtn");
      var sizeEl = document.getElementById("qrSize"), sizeVal = document.getElementById("sizeVal");
      var marginEl = document.getElementById("qrMargin"), marginVal = document.getElementById("marginVal");
      var ecEl = document.getElementById("qrEc");
      var fgEl = document.getElementById("qrFg"), bgEl = document.getElementById("qrBg");
      var styleEl = document.getElementById("qrStyle"), styleHint = document.getElementById("styleHint");
      var imgCtl = document.getElementById("imgCtl");
      var imgDrop = document.getElementById("imgDrop");
      var imgPick = document.getElementById("imgPick");
      var imgThumb = document.getElementById("imgThumb");
      var imgName = document.getElementById("imgName");
      var imgHint = document.getElementById("imgHint");
      var imgRemove = document.getElementById("imgRemove");
      var toastEl = document.getElementById("tipToast");
      var timer = null, ready = false, hasImg = false, imgObj = null;

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
      }

      function showEmpty(msg, isErr) {
        canvas.style.display = "none";
        emptyEl.style.display = "block";
        dlBtn.disabled = true;
        ready = false;
        tipEl.textContent = msg || "";
        tipEl.className = isErr ? "qr-tip err" : "qr-tip";
      }

      function done(text, size, extra) {
        canvas.style.display = "block";
        emptyEl.style.display = "none";
        dlBtn.disabled = false;
        ready = true;
        tipEl.className = "qr-tip";
        tipEl.textContent = "共 " + text.length + " 个字符 · " + size + "×" + size + " px" + (extra || "");
      }

      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      function loadImage(file, cb) {
        if (!file) return cb(new Error("no file"));
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () { imgObj = img; hasImg = true; cb(null); };
          img.onerror = function () { cb(new Error("图片加载失败")); };
          img.src = e.target.result;
        };
        reader.onerror = function () { cb(new Error("读取失败")); };
        reader.readAsDataURL(file);
      }

      // 中心图标：在已生成的二维码正中叠加 logo（带白底圆角）
      function drawLogo() {
        var iw = imgObj.width, ih = imgObj.height;
        var ar = iw / ih;
        var lw = canvas.width * 0.22, lh = lw;
        if (ar >= 1) lh = lw / ar; else lw = lh * ar;
        var pad = Math.max(6, Math.round(Math.min(lw, lh) * 0.16));
        var bx = (canvas.width - (lw + pad * 2)) / 2;
        var by = (canvas.height - (lh + pad * 2)) / 2;
        ctx.save();
        roundRect(ctx, bx, by, lw + pad * 2, lh + pad * 2, Math.min(14, pad));
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.lineWidth = Math.max(1, pad * 0.25);
        ctx.strokeStyle = "rgba(0,0,0,.06)";
        ctx.stroke();
        ctx.restore();
        ctx.drawImage(imgObj, bx + pad, by + pad, lw, lh);
      }

      // 三个定位角（finder pattern）坐标
      function finderAt(r, c, N) {
        var f = [[0, 0], [0, N - 7], [N - 7, 0]];
        for (var i = 0; i < 3; i++) {
          var o = f[i];
          if (r >= o[0] && r < o[0] + 7 && c >= o[1] && c < o[1] + 7) return o;
        }
        return null;
      }
      function finderDark(rr, cc) {
        if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return true;   // 外环
        if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return true;       // 中心 3×3
        return false;                                                     // 白环留空
      }

      // 艺术图片二维码：按图片明暗把数据模块渲染成不同大小的圆点（halftone），定位角保持实心
      function renderArtistic(text, size, margin, fg, bg) {
        var model;
        try {
          model = window.QRCode.create(text, { errorCorrectionLevel: "H" });
        } catch (e) {
          showEmpty("生成失败：内容过长，请减少字符数", true);
          return;
        }
        var N = model.modules.size, mod = model.modules;
        var quiet = Math.max(2, margin);
        var full = N + quiet * 2;
        var ms = Math.max(2, Math.floor(size / full));
        var px = ms * full;
        canvas.width = px; canvas.height = px;
        ctx.fillStyle = bg; ctx.fillRect(0, 0, px, px);

        // 将图片按 cover 方式缩放到 N×N，取每模块亮度
        var tmp = document.createElement("canvas"); tmp.width = N; tmp.height = N;
        var tctx = tmp.getContext("2d");
        var iw = imgObj.width, ih = imgObj.height, s = Math.max(N / iw, N / ih);
        var dw = iw * s, dh = ih * s;
        tctx.drawImage(imgObj, (N - dw) / 2, (N - dh) / 2, dw, dh);
        var data = tctx.getImageData(0, 0, N, N).data;
        function lum(r, c) {
          var i = (r * N + c) * 4;
          return (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
        }

        ctx.fillStyle = fg;
        for (var r = 0; r < N; r++) {
          for (var c = 0; c < N; c++) {
            if (!mod.get(r, c)) continue;                 // 浅模块留白
            var x = (c + quiet) * ms, y = (r + quiet) * ms;
            var fo = finderAt(r, c, N);
            if (fo) {                                      // 定位角必须实心，保证可扫
              if (finderDark(r - fo[0], c - fo[1])) ctx.fillRect(x, y, ms, ms);
              continue;
            }
            var l = lum(r, c);                            // 0=暗 1=亮
            var k = 0.32 + 0.18 * (1 - l);                // 圆点半径系数 0.32~0.50
            ctx.beginPath();
            ctx.arc(x + ms / 2, y + ms / 2, ms * k, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        done(text, size, " · 艺术图片（容错 H）");
      }

      function render() {
        if (!window.QRCode || typeof window.QRCode.toCanvas !== "function") {
          showEmpty("二维码库加载失败，请检查网络后刷新页面重试", true);
          return;
        }
        var text = textEl.value;
        if (!text.trim()) { showEmpty(""); return; }
        var style = styleEl.value;
        if (style !== "standard" && !hasImg) {
          showEmpty("请先上传图片（" + (style === "logo" ? "中心图标" : "艺术底图") + "）", false);
          return;
        }
        var size = parseInt(sizeEl.value, 10);
        var margin = parseInt(marginEl.value, 10);
        var ec = ecEl.value;
        var fg = fgEl.value, bg = bgEl.value;

        if (style === "art") {                       // 艺术模式强制高容错，保证可扫
          ecEl.value = "H";
          renderArtistic(text, size, margin, fg, bg);
          return;
        }
        var opts = {
          width: size, margin: margin, errorCorrectionLevel: ec,
          color: { dark: fg, light: bg }
        };
        window.QRCode.toCanvas(canvas, text, opts, function (err) {
          if (err) {
            showEmpty("生成失败：内容过长，请减少字符数或降低容错级别", true);
            return;
          }
          if (style === "logo") drawLogo();
          done(text, size, style === "logo" ? " · 含中心图标" : "");
        });
      }

      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(render, 180);
      }

      textEl.addEventListener("input", schedule);
      ecEl.addEventListener("change", render);
      fgEl.addEventListener("input", schedule);
      bgEl.addEventListener("input", schedule);
      sizeEl.addEventListener("input", function () {
        sizeVal.textContent = sizeEl.value + " px";
        schedule();
      });
      marginEl.addEventListener("input", function () {
        marginVal.textContent = marginEl.value;
        schedule();
      });

      styleEl.addEventListener("change", function () {
        var s = styleEl.value;
        if (s === "standard") {
          imgCtl.classList.remove("show");
          styleHint.textContent = "";
        } else {
          imgCtl.classList.add("show");
          styleHint.textContent = s === "logo" ? "图片将置于二维码中心" : "图片越清晰、对比越强扫描越稳（建议短内容）";
          if (s === "art") ecEl.value = "H";
        }
        render();
      });

      document.getElementById("colorReset").addEventListener("click", function () {
        fgEl.value = "#000000";
        bgEl.value = "#ffffff";
        render();
      });

      imgDrop.addEventListener("click", function () { imgPick.click(); });
      imgPick.addEventListener("change", function () {
        var f = imgPick.files && imgPick.files[0];
        if (!f) return;
        loadImage(f, function (err) {
          if (err) { toast("图片读取失败"); return; }
          imgThumb.src = imgObj.src;
          imgThumb.style.display = "block";
          imgName.textContent = f.name;
          imgHint.style.display = "none";
          imgRemove.style.display = "inline-block";
          render();
        });
      });
      imgRemove.addEventListener("click", function (e) {
        e.stopPropagation();
        hasImg = false; imgObj = null; imgPick.value = "";
        imgThumb.style.display = "none";
        imgName.textContent = "";
        imgHint.style.display = "";
        imgRemove.style.display = "none";
        render();
      });

      Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function (b) {
        b.addEventListener("click", function () {
          textEl.value = b.dataset.fill;
          textEl.focus();
          render();
        });
      });

      dlBtn.addEventListener("click", function () {
        if (!ready) return;
        try {
          var a = document.createElement("a");
          a.download = "qrcode-" + Date.now() + ".png";
          a.href = canvas.toDataURL("image/png");
          a.click();
          toast("二维码已保存为 PNG");
        } catch (e) {
          toast("下载失败，请长按或右键图片另存为");
        }
      });

      // 库为异步加载，就绪后首次渲染
      function boot() {
        sizeVal.textContent = sizeEl.value + " px";
        marginVal.textContent = marginEl.value;
        var tries = 0;
        (function wait() {
          if (window.QRCode && typeof window.QRCode.toCanvas === "function") { render(); return; }
          if (++tries > 40) { showEmpty("二维码库加载失败，请检查网络后刷新页面重试", true); return; }
          setTimeout(wait, 100);
        })();
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
  </script>
