<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密码强度检测 - XHC 博客</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
    .panel h2{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .panel h2 .bar{width:4px;height:14px;background:var(--primary);border-radius:3px;display:inline-block;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    input[type=text],input[type=password]{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit;box-sizing:border-box;}
    .pw-wrap{position:relative;}
    .toggle{cursor:pointer;position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-3);user-select:none;}
    .bar{height:10px;border-radius:6px;background:var(--border);overflow:hidden;margin:14px 0 6px;}
    .bar>i{display:block;height:100%;width:0;transition:width .25s,background .25s;border-radius:6px;}
    .label{font-weight:700;font-size:16px;}
    .checks{list-style:none;padding:0;margin:14px 0 0;font-size:14px;color:var(--text-2);}
    .checks li{margin:7px 0;display:flex;align-items:center;gap:8px;}
    .checks .ok{color:#27ae60;} .checks .no{color:var(--text-3);}
    .btns{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
    .note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.7;}
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHC 博客 logo" class="site-logo">
        <span class="brand-name">XHC<b>博客</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      <a class="btn-home" href="http://xhc.dpdns.org" target="_blank">返回主站</a>
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">🛡️</span>
      <div>
        <h1>密码强度检测</h1>
        <p class="tool-sub">实时评估密码强度，检查长度与复杂度，提醒常见弱口令</p>
      </div>
    </div>

    <div class="panel">
      <h2><span class="bar"></span> 输入密码</h2>
      <div class="pw-wrap">
        <input type="password" id="pw" placeholder="输入要检测的密码（仅本地，不上传）">
        <span class="toggle" id="toggle">显示</span>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="label" id="strengthLabel">—</div>
      <ul class="checks">
        <li id="cLen"><span class="no">○</span> 至少 8 位</li>
        <li id="cLow"><span class="no">○</span> 包含小写字母</li>
        <li id="cUp"><span class="no">○</span> 包含大写字母</li>
        <li id="cNum"><span class="no">○</span> 包含数字</li>
        <li id="cSym"><span class="no">○</span> 包含特殊符号</li>
        <li id="cWeak"><span class="no">○</span> 非常见弱口令</li>
      </ul>
      <div class="btns" style="margin-top:14px">
        <button class="btn-ghost" id="genBtn">🎲 生成强密码</button>
        <button class="btn-ghost" id="copyBtn">📋 复制</button>
      </div>
      <div class="note">强度综合长度、字符类别与是否命中弱口令词典。本工具完全在浏览器本地运行，密码不会上传到任何服务器。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> NT Group · XHC 的小站 · 认准 <a href="http://xhc.dpdns.org" target="_blank">xhc.dpdns.org</a> 官方域名<br>
      本站由 XHC 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var pw=document.getElementById("pw"), toggle=document.getElementById("toggle");
      var barFill=document.getElementById("barFill"), label=document.getElementById("strengthLabel");
      var cLen=document.getElementById("cLen"), cLow=document.getElementById("cLow"), cUp=document.getElementById("cUp"),
          cNum=document.getElementById("cNum"), cSym=document.getElementById("cSym"), cWeak=document.getElementById("cWeak");
      var genBtn=document.getElementById("genBtn"), copyBtn=document.getElementById("copyBtn");
      var WEAK=["123456","password","12345678","qwerty","abc123","111111","123123","admin","letmein","iloveyou","000000","passw0rd","root","toor","xiaoming"];
      function setLi(li, ok){ li.querySelector("span").textContent=ok?"●":"○"; li.querySelector("span").className=ok?"ok":"no"; }

      function score(p){
        var s=0;
        var hasLow=/[a-z]/.test(p), hasUp=/[A-Z]/.test(p), hasNum=/[0-9]/.test(p), hasSym=/[^a-zA-Z0-9]/.test(p);
        var cats=(hasLow?1:0)+(hasUp?1:0)+(hasNum?1:0)+(hasSym?1:0);
        s+=Math.min(4, Math.floor(p.length/3)); // 长度
        s+=cats; // 类别
        if(p.length>=12 && cats>=3) s+=1;
        if(WEAK.indexOf(p.toLowerCase())>-1) s=-1;
        return {s:s, hasLow:hasLow, hasUp:hasUp, hasNum:hasNum, hasSym:hasSym, cats:cats};
      }
      function update(){
        var p=pw.value;
        if(!p){ barFill.style.width="0"; label.textContent="—"; ["cLen","cLow","cUp","cNum","cSym","cWeak"].forEach(function(id){setLi(document.getElementById(id),false);}); return; }
        var r=score(p);
        setLi(cLen, p.length>=8); setLi(cLow,r.hasLow); setLi(cUp,r.hasUp); setLi(cNum,r.hasNum); setLi(cSym,r.hasSym); setLi(cWeak, WEAK.indexOf(p.toLowerCase())<0);
        var max=9, pct=Math.max(0,Math.min(100, (r.s/max)*100));
        var col, txt;
        if(r.s<0){ col="#e74c3c"; txt="⚠️ 弱口令，请立即更换"; pct=100; }
        else if(r.s<=2){ col="#e74c3c"; txt="弱"; }
        else if(r.s<=4){ col="#e67e22"; txt="中"; }
        else if(r.s<=6){ col="#f1c40f"; txt="较强"; }
        else { col="#27ae60"; txt="强"; }
        barFill.style.width=pct+"%"; barFill.style.background=col; label.textContent=txt; label.style.color=col;
      }
      pw.oninput=update;
      toggle.onclick=function(){ var t=pw.type==="password"?"text":"password"; pw.type=t; this.textContent=t==="password"?"显示":"隐藏"; };

      function gen(){
        var s="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*";
        var out="";
        var buf=crypto.getRandomValues(new Uint32Array(14));
        for(var i=0;i<14;i++) out+=s[buf[i]%s.length];
        pw.value=out; update(); toast("已生成强密码");
      }
      genBtn.onclick=gen;
      copyBtn.onclick=function(){ if(!pw.value){toast("无内容");return;} copy(pw.value); };
      function toast(m){ var t=document.createElement("div"); t.textContent=m; t.style.cssText="position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:14px;"; document.body.appendChild(t); setTimeout(function(){document.body.removeChild(t);},1400); }
      function copy(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("已复制");},function(){fallback(t);});} else fallback(t); }
      function fallback(t){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("已复制");}catch(e){toast("复制失败");} document.body.removeChild(ta); }

      document.getElementById("year").textContent=new Date().getFullYear();
    })();
  </script>

  <div class="watermark"><a href="http://xhc.dpdns.org" target="_blank" title="XHC.DPDNS.ORG"><img src="../assets/images/watermark.png" alt="XHC.DPDNS.ORG"></a></div>
</body>
</html>
