<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>井字棋 - XHCDNS</title>
  <link rel="icon" href="../assets/images/xhc-96x96.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .tool-page{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
    .back-link{display:inline-block;font-size:14px;color:var(--text-2);margin-bottom:12px;}
    .back-link:hover{color:var(--primary);}
    .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
    .tool-head .ico{font-size:30px;line-height:1;}
    .tool-head h1{font-size:23px;margin:0;}
    .tool-sub{color:var(--text-3);font-size:14px;margin:0 0 20px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
    body.dark .panel{box-shadow:none;}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
    .btn:hover{border-color:var(--primary);color:var(--primary);}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
    .row label{font-size:14px;font-weight:600;color:var(--text-2);min-width:64px;}
    input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    textarea{width:100%;resize:vertical;box-sizing:border-box;}
    .res{margin-top:14px;font-size:15px;color:var(--text);}
    .res b{color:var(--primary);font-size:20px;font-weight:800;}
    canvas{display:block;width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--border);touch-action:none;}
    .ttt-board{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center;margin:10px auto;}
    .ttt-cell{width:90px;height:90px;font-size:48px;font-weight:800;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;cursor:pointer;color:var(--primary);}
    .ttt-cell:hover{background:var(--card);}
    .ttt-cell.o{color:#e67e22;}
    .ttt-status{text-align:center;font-size:16px;margin:12px 0;color:var(--text-2);}
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="../assets/images/loading-logo.png" alt="" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/images/xhc-96x96.png" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索文章、标签…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="../tools.html">← 返回工具箱</a>
    <div class="tool-head">
      <span class="ico">⭕</span>
      <h1>井字棋</h1>
    </div>
    <p class="tool-sub">经典 3×3 井字棋，你执 X，电脑执 O（会防守和进攻）。</p>

    <div class="panel">
      <div class="ttt-board" id="tttBoard"></div>
      <div class="ttt-status" id="tttStatus">轮到你了（X）</div>
      <div class="row" style="justify-content:center;"><button class="btn primary" id="tttReset">↺ 重新开局</button></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> XHCDNS · 基于 <a href="https://supabase.com" target="_blank">Supabase</a> 全栈驱动</p>
    </div>
  </footer>
  <div class="watermark">
    <img src="../assets/images/xhcntgroup.png" alt="">
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    (function () {
      function fix(h) {
        if (!h || /^(https?:|data:|javascript:|mailto:|tel:|#|\.\.\/|\/)/i.test(h)) return null;
        return /\.html(\?|#|$)/i.test(h) ? "../" + h : null;
      }
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var n = fix(a.getAttribute("href"));
        if (n) a.setAttribute("href", n);
      }, true);
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var si = document.getElementById("searchInput"), sb = document.getElementById("searchBtn");
          if (!si || !sb) return;
          var go = function () { location.href = "../index.html?q=" + encodeURIComponent(si.value.trim()); };
          sb.onclick = go;
          si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); go(); } }, true);
        }, 0);
      });
    })();
  </script>

  <script>
    (function () {
      var board=[null,null,null,null,null,null,null,null,null];
      var over=false;
      var b=document.getElementById('tttBoard');
      var st=document.getElementById('tttStatus');
      var WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      function draw(){
        b.innerHTML='';
        for(var i=0;i<9;i++){
          var c=document.createElement('div');
          c.className='ttt-cell'+(board[i]==='O'?' o':'');
          c.textContent=board[i]||'';
          (function(idx){c.onclick=function(){click(idx);};})(i);
          b.appendChild(c);
        }
      }
      function winLine(p){for(var i=0;i<WINS.length;i++){var w=WINS[i];if(board[w[0]]===p&&board[w[1]]===p&&board[w[2]]===p)return w;}return null;}
      function click(i){
        if(over||board[i])return;
        board[i]='X';
        if(winLine('X')){over=true;st.textContent='🎉 你赢了！';draw();return;}
        if(board.indexOf(null)<0){over=true;st.textContent='平局！';draw();return;}
        ai();
      }
      function ai(){
        var move=best('O')||best('X')||firstEmpty();
        board[move]='O';
        if(winLine('O')){over=true;st.textContent='💻 电脑赢了！';draw();return;}
        if(board.indexOf(null)<0){over=true;st.textContent='平局！';draw();return;}
        st.textContent='轮到你了（X）';draw();
      }
      function best(p){for(var i=0;i<WINS.length;i++){var w=WINS[i];var cnt=0,empty=-1;for(var j=0;j<3;j++){if(board[w[j]]===p)cnt++;else if(!board[w[j]])empty=w[j];}if(cnt===2&&empty>=0)return empty;}return null;}
      function firstEmpty(){for(var i=0;i<9;i++)if(!board[i])return i;return 0;}
      document.getElementById('tttReset').onclick=function(){board=[null,null,null,null,null,null,null,null,null];over=false;st.textContent='轮到你了（X）';draw();};
      draw();
    })();
  </script>
</body>
</html>
