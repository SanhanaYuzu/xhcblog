<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理 - XHCDNS</title>
  <link rel="icon" href="assets/images/xhc-96x96.png?v=20260812">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 页面跳转加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <img src="assets/images/loading-logo.png" alt="Loading" class="loader-logo">
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="header">
    <div class="container">
      <a class="brand" href="index.html">
        <img src="assets/images/xhc-96x96.png?v=20260812" alt="XHCDNS logo" class="site-logo">
        <span class="brand-name">XHC<b>DNS</b></span>
      </a>
      <nav class="nav" id="navCats"></nav>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索用户…" autocomplete="off">
        <button id="searchBtn" title="搜索">🔍</button>
      </div>
      
      <span id="accountSlot"></span>
    </div>
  </header>

  <!-- 主体 -->
  <main class="container" style="padding:24px 0;">
    <div class="feed-head" style="margin-bottom:18px;">
      <h1>👥 用户管理</h1>
      <span class="count" id="userStats"></span>
      <div class="tabs" id="userTabs" style="margin-left:auto;">
        <a data-filter="all" class="active">全部用户</a>
        <a data-filter="online">在线</a>
        <a data-filter="banned">已禁言</a>
      </div>
    </div>

    <div id="userList" class="card" style="padding:0;overflow:hidden;"></div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      © <span id="year"></span> XHCDNS · 认准 <a href="https://xhcdns.com" target="_blank">xhcdns.com</a> 官方域名<br>
      本站由 XHCDNS 制作
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- 左下角水印 -->
  <div class="watermark"><a href="https://xhcdns.com" target="_blank" title="XHCDNS"><img src="assets/images/watermark.png" alt="XHCDNS"></a></div>
</body>
</html>
